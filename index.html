<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14322f">
<meta name="mobile-web-app-capable" content="yes">
<title>VoiceCoach – Speech, Voice &amp; Communication Trainer</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d2421;--muted:#5f6b66;--line:#ded8cb;--accent:#1f6f63;--accent2:#c8643b;--soft:#e4efe9;--warn:#b3412e;--ok:#2f8a4d;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#17211e;--ink:#e8eee9;--muted:#9aa9a3;--line:#2a3833;--accent:#5cc2ad;--accent2:#e88a5f;--soft:#1d2e29;--warn:#ee7a65;--ok:#6bcf8a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap}
header .ver{font-size:.7rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px;vertical-align:middle}
header .badge{font-size:.78rem;color:var(--muted)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 10px;font-size:.8rem}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--muted);padding:8px 0 9px;font-size:.6rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:700}
section.view{display:none} section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.flat{background:var(--soft);border:0}
.card h2{font-size:1.05rem;margin:0 0 6px} .card h3{font-size:.95rem;margin:12px 0 6px}
p{margin:6px 0} .muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .grow{flex:1}
button.b{border:0;border-radius:12px;padding:11px 14px;font-size:.95rem;font-weight:600;background:var(--accent);color:#fff;min-height:46px}
button.b.alt{background:var(--soft);color:var(--ink)} button.b.warm{background:var(--accent2)}
button.b.sm{padding:7px 11px;min-height:36px;font-size:.84rem} button.b:disabled{opacity:.4}
button.b.full{width:100%;text-align:left;margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-size:2.5rem;font-weight:700;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.huge{font-size:2.1rem;font-weight:700;text-align:center;padding:20px 8px;min-height:100px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat div{background:var(--soft);border-radius:12px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:1.3rem} .stat span{font-size:.7rem;color:var(--muted)}
details{border-top:1px solid var(--line);padding:8px 0} details summary{cursor:pointer;font-weight:600}
dl dt{font-weight:700;margin-top:8px} dl dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.warnbox{border-left:4px solid var(--warn);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:.87rem}
.okbox{border-left:4px solid var(--ok);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:.9rem}
canvas{width:100%;display:block;border-radius:12px;background:var(--soft)}
.meter{height:20px;border-radius:10px;background:var(--soft);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ok),var(--accent2),var(--warn));width:0}
.meter u{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.5}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.breath{width:210px;height:210px;margin:10px auto;position:relative;display:flex;align-items:center;justify-content:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.breath .ball{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent),#0d4a41);transform:scale(.35);opacity:.9}
.breath .lbl{position:absolute;color:#fff;font-weight:700;text-align:center;font-size:1.05rem;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.reader{font-size:1.25rem;line-height:1.7} .reader span{padding:1px 2px;border-radius:5px}
.reader span.now{background:var(--accent2);color:#fff} .reader span.done{color:var(--muted)}
.list{margin:0;padding-left:18px} .list li{margin:3px 0}
.step{display:flex;gap:5px;margin:8px 0} .step i{flex:1;height:6px;border-radius:3px;background:var(--line)} .step i.d{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.82rem} td,th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:left;vertical-align:top}
.tap{width:100%;min-height:110px;font-size:1.5rem;border-radius:20px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:.88rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.cents{position:relative;height:34px;background:var(--soft);border-radius:10px;margin:6px 0}
.cents b{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--accent2);left:50%;transform:translateX(-3px)}
.cents::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--ok)}
.cents .z{position:absolute;left:40%;right:40%;top:0;bottom:0;background:rgba(47,138,77,.18)}
.bubble{border-radius:16px;padding:12px 14px;margin:8px 0;font-size:1.05rem;line-height:1.4}
.bubble.them{background:var(--soft);border-top-left-radius:4px;margin-right:24px}
.bubble.me{background:var(--accent);color:#fff;border-top-right-radius:4px;margin-left:24px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin-right:4px;vertical-align:middle}
.tag.ok{background:var(--ok);color:#fff} .tag.due{background:var(--accent2);color:#fff} .tag.lock{opacity:.5}
.kp{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:99px;border:1px dashed var(--accent);font-size:.88rem}
.kp.hit{background:var(--ok);border:1px solid var(--ok);color:#fff} .kp.miss{border-color:var(--warn);color:var(--warn)}
.sc{display:grid;grid-template-columns:110px 1fr 40px;gap:6px;align-items:center;font-size:.85rem;margin:3px 0}
.scorebig{font-size:2.6rem;font-weight:800;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:720px;margin:0;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.rate-row{margin:8px 0} .rate-row .chips{margin:3px 0}
.tiprow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.92rem} .tiprow button{flex:none;min-height:30px!important;padding:3px 8px!important}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:8px 0} .cal i{aspect-ratio:1;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.cal i b{position:absolute;left:0;right:0;bottom:0;background:var(--ok)} .cal i.today{outline:2px solid var(--accent)}
.planitem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)} .planitem .ck{font-size:1.3rem;width:28px;text-align:center}
.planitem.done .grow{opacity:.55;text-decoration:line-through}
.lesson{border-top:1px solid var(--line);padding:6px 0}
.check{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:.92rem} .check input{width:20px;height:20px;flex:none}
.beatdot{width:120px;height:120px;margin:12px auto;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;transition:transform .08s,background .08s}
.beatdot.on{background:var(--accent2);color:#fff;transform:scale(1.15)}
.dots{display:inline-flex;gap:4px;vertical-align:middle} .dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:inline-block} .dots i.on{background:var(--ok)} .dots.big i{width:20px;height:20px}
b.stress{color:var(--accent2);text-decoration:underline} .pmark{color:var(--accent);font-weight:700}
.tipbtn{flex:none;min-height:30px!important;padding:3px 8px!important;margin-left:auto}
textarea{width:100%;min-height:90px;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>VoiceCoach <span class="ver">v5.0</span></h1>
  <span class="badge" id="streakBadge"></span>
  <button class="pill hidden" id="installBtn" data-t="install"></button>
  <button class="pill" id="setBtn">⚙ <span id="setSummary"></span></button>
</header>

<div class="sheet hidden" id="settings"><div class="card">
  <h2 data-t="set_title"></h2>
  <h3 data-t="set_ui"></h3><div class="chips" id="setUi"></div>
  <h3 data-t="set_train"></h3><div class="chips" id="setTl"></div>
  <h3 data-t="set_ctx"></h3><div class="chips" id="setCtx"></div>
  <div id="setProf"></div>
  <div id="setVoice"></div>
  <h3 data-t="set_mode"></h3><div class="chips" id="setMode"></div>
  <div id="setMic"></div>
  <h3><span data-t="set_rate"></span>: <span id="rateVal"></span></h3>
  <input type="range" id="setRate" min="0.6" max="1.3" step="0.05">
  <div class="row" style="margin-top:12px"><span class="grow"></span><button class="b" id="setClose" data-t="set_close"></button></div>
</div></div>

<div class="sheet hidden" id="coachSheet"><div class="card" id="coachBody" style="max-height:92vh"></div></div>

<main>
<!-- TODAY -->
<section class="view on" id="v-today">
  <div class="card" id="goalCard"><h2 data-t="goal_title"></h2><p class="muted" data-t="goal_desc"></p><div id="goalBody"></div></div>
  <div class="card"><div class="row"><h2 class="grow" style="margin:0" data-t="plan_title"></h2><b id="planCount"></b></div>
    <p class="muted" data-t="plan_desc"></p><div id="planList"></div><p class="muted hidden" id="planNoTest" data-t="plan_notest"></p>
    <div class="cal" id="planCal"></div><p class="muted" style="font-size:.75rem" data-t="plan_cal"></p></div>
  <div class="card" id="coachCard"><h2 data-t="coach_title"></h2><p class="muted" data-t="coach_desc"></p><div id="coachList"></div></div>
  <div class="card"><h2 data-t="due_title"></h2><div id="dueList"></div></div>
  <div class="card"><h2 data-t="next_title"></h2><div id="nextBox"></div></div>
  <div class="card">
    <h2 data-t="week_title"></h2>
    <div class="stat">
      <div><b id="stSessions">0</b><span data-t="st_sessions"></span></div>
      <div><b id="stMinutes">0</b><span data-t="st_minutes"></span></div>
      <div><b id="stStreak">0</b><span data-t="st_streak"></span></div>
      <div><b id="stDue">0</b><span data-t="st_due"></span></div>
    </div>
    <p class="muted" data-t="week_note"></p>
  </div>
  <div class="card" id="lessonCard"><h2 data-t="lessons_title"></h2><p class="muted" data-t="lessons_desc"></p><div id="lessonList"></div></div>
  <div class="card"><h2 data-t="routines_title"></h2><p class="muted" data-t="routines_desc"></p><div id="routineList"></div></div>
  <div class="card hidden" id="routinePlayer">
    <div class="row"><b class="grow" id="rpTitle"></b><button class="b sm alt" id="rpClose" data-t="close"></button></div>
    <div class="step" id="rpSteps"></div>
    <h2 id="rpStepTitle" style="margin-top:8px"></h2>
    <p id="rpStepText"></p><p class="muted" id="rpStepWhy"></p>
    <div class="big" id="rpTime">0:00</div>
    <div class="row"><button class="b alt grow" id="rpPrev" data-t="back"></button><button class="b grow" id="rpPlay" data-t="startb"></button><button class="b alt grow" id="rpNext" data-t="next"></button></div>
  </div>
  <div class="card"><h2 data-t="howto_title"></h2><div data-t="howto_html"></div><div class="warnbox" data-t="warn_html" style="margin-top:10px"></div></div>
  <div class="card"><details><summary data-t="gloss_title"></summary><dl id="glossary"></dl></details></div>
</section>

<!-- TALK -->
<section class="view" id="v-talk">
  <div id="convList">
    <div class="card">
      <h2 data-t="talk_title"></h2>
      <p class="muted" data-t="talk_desc"></p>
      <div class="chips" id="talkCtx"></div>
      <div class="chips" id="talkTl"></div>
      <details><summary data-t="grading_title"></summary><div data-t="grading_html" class="muted"></div></details>
    </div>
    <div id="sceneList"></div>
    <div class="card" id="impCard">
      <h2 data-t="imp_title"></h2><p class="muted" data-t="imp_desc"></p>
      <div class="huge" id="topicBox" style="font-size:1.3rem"></div>
      <div class="chips" id="topicDur"></div>
      <div class="big" id="topicTime">1:00</div>
      <div class="row"><button class="b alt grow" id="topicNew" data-t="imp_new"></button><button class="b grow" id="topicStart" data-t="startb"></button></div>
      <div id="impRec" style="margin-top:8px"></div><div id="impOut"></div>
    </div>
    <div class="card">
      <h2 data-t="filler_title"></h2><p class="muted" data-t="filler_desc"></p>
      <button class="b warm tap" id="fillTap"></button>
      <div class="row" style="margin-top:8px"><span class="grow"><span data-t="time"></span>: <b id="fillTime">0:00</b> · <b id="fillRate">–</b> <span data-t="per_min"></span></span>
        <button class="b alt sm" id="fillStart" data-t="start_timer"></button><button class="b alt sm" id="fillSave" data-t="save"></button></div>
    </div>
  </div>

  <div id="convPlayer" class="hidden">
    <div class="card">
      <div class="row"><b class="grow" id="cpTitle"></b><button class="b sm alt" id="cpClose" data-t="close"></button></div>
      <div class="muted" id="cpLevel"></div>
      <div class="step" id="cpSteps"></div>
      <div id="cpBody"></div>
    </div>
  </div>
</section>

<!-- SPEECH -->
<section class="view" id="v-speech">
  <div class="card" id="artCard">
    <div class="row"><h2 class="grow" style="margin:0" data-t="art_title"></h2><div class="chips" id="speechTl"></div></div>
    <p class="muted" data-t="art_desc"></p>
    <div class="chips" id="soundChips"></div>
    <div class="chips" id="posChips"></div>
    <p class="muted" id="soundTip"></p>
    <div class="card flat">
      <div class="huge tl" id="drillWord">–</div>
      <p class="muted" id="drillHeard" style="text-align:center;min-height:1.2em"></p>
      <div class="row">
        <button class="b alt" id="drillPrev">◀</button>
        <button class="b grow" id="drillCheck" data-t="art_check"></button>
        <button class="b alt" id="drillOk" style="background:var(--ok);color:#fff">✓</button>
        <button class="b alt" id="drillBad" style="background:var(--warn);color:#fff">✗</button>
        <button class="b alt" id="drillNext">▶</button>
      </div>
      <div class="bar" style="margin-top:10px"><i id="artBar" style="width:0"></i></div>
      <p class="muted" id="artMastery"></p>
      <p class="muted" id="drillCount"></p>
    </div>
    <div id="serBox"></div>
  </div>
  <div class="card">
    <h2 data-t="pairs_title"></h2><p class="muted" data-t="pairs_desc"></p>
    <div class="huge tl" id="pairBox">–</div>
    <div class="row"><button class="b grow" id="pairNext" data-t="pairs_new"></button><button class="b alt grow" id="pairPick" data-t="pairs_pick"></button></div>
    <p class="muted" id="pairPicked"></p>
  </div>
  <div class="card" id="twCard">
    <h2 data-t="tw_title"></h2><p class="muted" data-t="tw_desc"></p>
    <select class="tl" id="twSelect" style="width:100%"></select>
    <div class="reader card tl" id="twReader" style="margin-top:10px"></div>
    <label class="muted"><span data-t="speed"></span>: <span id="twWpmVal">60</span> WPM</label>
    <input type="range" id="twWpm" min="30" max="200" step="5" value="60">
    <div class="row"><label class="muted grow"><input type="checkbox" id="twClick"> <span data-t="metronome"></span></label><button class="b" id="twStart" data-t="startb"></button></div>
    <div id="twRec" style="margin-top:8px"></div><div id="twOut"></div>
  </div>
  <div class="card" id="paceCard">
    <h2 data-t="read_title"></h2><p class="muted" data-t="read_desc"></p>
    <select class="tl" id="paceSelect" style="width:100%"></select>
    <div class="reader card tl" id="paceReader" style="margin-top:10px"></div>
    <label class="muted"><span data-t="speed"></span>: <span id="paceWpmVal">130</span> WPM</label>
    <input type="range" id="paceWpm" min="60" max="200" step="5" value="130">
    <div class="row"><span class="grow"></span><button class="b" id="paceStart" data-t="startb"></button></div>
  </div>
</section>

<!-- VOICE -->
<section class="view" id="v-voice">
  <div class="card" id="toneCard"><h2><span data-t="tone_title"></span> <span class="muted" style="font-size:.85rem;font-weight:400" id="toneSub"></span></h2><div id="toneBody"></div></div>
  <div class="card" id="testCard"><h2 data-t="test_title"></h2><p class="muted" data-t="test_desc"></p><div id="testBody"></div>
    <details><summary data-t="dims_info"></summary><div class="muted" data-t="dims_help"></div></details></div>
  <div class="card" id="studioCard"><h2 data-t="studio_title"></h2><p class="muted" data-t="studio_desc"></p>
    <label class="muted" data-t="studio_prompt"></label><select id="studioPrompt" style="width:100%"></select>
    <div class="card flat hidden" id="studioTask" style="margin-top:8px"></div>
    <label class="check"><input type="checkbox" id="studioVideo"> <span data-t="studio_video"></span></label>
    <div id="studioRec"></div>
    <label class="b sm alt" style="display:inline-flex;align-items:center;margin-top:8px">📂 <span data-t="studio_import"></span><input type="file" id="studioFile" accept="audio/*,video/*" class="hidden"></label>
    <div id="studioOut"></div></div>
  <div class="card" id="refCard"><h2 data-t="ref_title"></h2><p class="muted" data-t="ref_desc"></p><div id="refBody"></div></div>
  <div class="card" id="intoCard"><h2 data-t="into_title"></h2><p class="muted" data-t="into_desc"></p>
    <div class="huge tl" id="intoSent" style="font-size:1.5rem;font-weight:500"></div><button class="b sm alt" id="intoNew" data-t="into_new"></button>
    <div id="intoRec" style="margin-top:8px"></div><div id="intoOut"></div></div>
  <div class="card" id="projCard"><h2 data-t="proj_title"></h2><p class="muted" data-t="proj_desc"></p>
    <div class="huge tl" id="projText" style="font-size:1.2rem;font-weight:500"></div><div id="projRec"></div><div id="projOut"></div></div>
  <div class="card"><h2 data-t="mic_title"></h2><p class="muted" data-t="mic_desc"></p>
    <button class="b" style="width:100%" id="micBtn" data-t="mic_on"></button>
    <div class="warnbox hidden" id="micErr" style="margin-top:8px"></div></div>
  <div class="card"><h2 data-t="pitch_title"></h2><p class="muted" data-t="pitch_desc"></p>
    <div class="row"><div class="big grow" id="pitchHz">– Hz</div><div class="big grow" id="pitchNote">–</div></div>
    <canvas id="pitchCanvas" height="170"></canvas><p class="muted" id="pitchStats"></p></div>
  <div class="card"><h2 data-t="match_title"></h2><p class="muted" data-t="match_desc"></p>
    <div class="row"><select id="targetNote" class="grow"></select><button class="b alt" id="playTarget" data-t="play"></button></div>
    <div class="cents"><div class="z"></div><b id="centsMark"></b></div>

  ["Willkommen! Wo haben Sie vorher gewohnt?","Sag, wo du vorher gewohnt hast, und nenne ein Detail.","Danke! Vorher haben wir fünf Jahre in Köln gewohnt. Das war schön, aber hier haben wir mehr Platz und einen Garten.","vorher|gewohnt|früher; jahre|stadt|köln; aber |und |weil"],
  ["Schön. Haben Sie schon Pläne fürs Wochenende?","Erzähl von deinen Plänen und stell eine Gegenfrage.","Wir haben noch viele Kisten auszupacken, aber am Sonntag möchten wir den Park erkunden. Was würden Sie hier in der Nähe empfehlen?","wochenende|samstag|sonntag|pläne|möchten|wollen; was |wo |haben sie|würden sie|können sie|empfehlen"],
  ["Die Bäckerei an der Ecke ist super. So, ich muss jetzt leider los.","Bedanke dich und beende das Gespräch höflich.","Danke für den Tipp, das probiere ich morgen aus. Schön, Sie kennenzulernen. Bis bald!","dank; schön|freut|nett; bis bald|tschüss|wiedersehen|bis dann"]],
 fr:[
  ["Bonjour ! Je crois que vous venez d'emménager à côté. Moi, c'est Sam.","Saluez, présentez-vous, dites quelque chose d'aimable.","Bonjour Sam, enchanté ! Moi, c'est Alex. Oui, nous avons emménagé la semaine dernière. C'est une très jolie rue.","bonjour|salut|enchanté; moi c est|je m appelle|je suis; emménagé|semaine|nouveau"],
  ["Bienvenue ! Où habitiez-vous avant ?","Dites où vous habitiez, avec un détail.","Merci ! Avant, nous avons habité cinq ans à Lyon. C'était bien, mais ici nous avons plus d'espace et un jardin.","avant|habité|habitions; ans |ville|lyon; mais |et |parce qu"],
  ["Super. Vous avez des projets pour le week-end ?","Parlez de vos projets et posez une question en retour.","Nous avons encore beaucoup de cartons à défaire, mais dimanche nous voulons découvrir le parc. Qu'est-ce que vous recommandez dans le quartier ?","week end|samedi|dimanche|projet|voulons|aimerions; qu est ce|recommand|conseill|vous avez|quel"],
  ["La boulangerie au coin est excellente. Bon, je dois y aller.","Remerciez et terminez poliment la conversation.","Merci pour le conseil, je vais l'essayer demain. Ravi de vous avoir rencontré. À bientôt !","merci; ravi|enchanté|plaisir; à bientôt|au revoir|à plus|bonne journée"]]
}},
{id:"cafe", ctx:"cas", title:{en:"At the café", de:"Im Café", fr:"Au café"}, turns:{
 en:[
  ["Hello, what can I get you?","Order a drink and something to eat, politely.","Hello! I'd like a large cappuccino and a piece of apple cake, please.","i d like|i would like|can i have|could i have|i ll have; please; coffee|cappuccino|tea |cake|sandwich|water|juice"],
  ["To drink here or take away?","Answer and ask one question about the menu.","To drink here, please. Do you also have oat milk?","here|take away|to go; do you|is there|have you got"],
  ["Sorry, we've run out of oat milk. We have soy or almond milk.","React calmly to the problem and choose an alternative.","No problem. Then I'll take almond milk, thank you.","no problem|that s fine|okay|ok |never mind; almond|soy |then; thank"],
  ["That's eight euros fifty. Card or cash?","Pay and say something friendly.","By card, please. Here you go. Thank you, have a nice day!","card|cash; here you go|here you are; nice day|thank|good day"]],
 de:[
  ["Hallo, was darf es sein?","Bestelle höflich ein Getränk und etwas zu essen.","Hallo! Ich hätte gern einen großen Cappuccino und ein Stück Apfelkuchen, bitte.","hätte gern|möchte|nehme|hätte gerne; bitte; kaffee|cappuccino|tee |kuchen|wasser|saft|brötchen"],
  ["Zum Hiertrinken oder zum Mitnehmen?","Antworte und stell eine Frage zur Karte.","Zum Hiertrinken, bitte. Haben Sie auch Hafermilch?","hier|mitnehmen; haben sie|gibt es"],
  ["Tut mir leid, die Hafermilch ist aus. Wir haben Soja- oder Mandelmilch.","Reagiere gelassen auf das Problem und wähle eine Alternative.","Kein Problem. Dann nehme ich Mandelmilch, danke.","kein problem|macht nichts|in ordnung|okay; mandel|soja|dann ; dank"],
  ["Das macht acht Euro fünfzig. Mit Karte oder bar?","Bezahle und sag etwas Freundliches.","Mit Karte, bitte. Bitte schön. Danke und einen schönen Tag noch!","karte|bar ; bitte schön|bitte sehr|hier ; schönen tag|danke"]],
 fr:[
  ["Bonjour, qu'est-ce que je vous sers ?","Commandez poliment une boisson et quelque chose à manger.","Bonjour ! Je voudrais un grand cappuccino et une part de tarte aux pommes, s'il vous plaît.","je voudrais|je vais prendre|j aimerais|je prends; s il vous plaît|s il te plaît; café|cappuccino|thé |tarte|gâteau|eau |jus |croissant"],
  ["Sur place ou à emporter ?","Répondez et posez une question sur la carte.","Sur place, s'il vous plaît. Vous avez aussi du lait d'avoine ?","sur place|emporter; vous avez|avez vous|est ce que"],
  ["Désolé, nous n'avons plus de lait d'avoine. Nous avons du lait de soja ou d'amande.","Réagissez calmement et choisissez une alternative.","Pas de problème. Alors je prends du lait d'amande, merci.","pas de problème|pas grave|d accord|ce n est pas grave; amande|soja|alors; merci"],
  ["Ça fait huit euros cinquante. Carte ou espèces ?","Payez et dites quelque chose d'aimable.","Par carte, s'il vous plaît. Voilà. Merci, bonne journée !","carte|espèces|liquide; voilà|tenez; bonne journée|merci"]]
}},

{id:"qa", ctx:"aca", title:{en:"Questions after a presentation", de:"Fragen nach einem Vortrag", fr:"Questions après un exposé"}, turns:{
 en:[
  ["Thank you for your presentation. Could you summarise your main finding in one or two sentences?","State your main result clearly and briefly.","Certainly. Our main finding is that gravel filters remove about eighty percent of suspended solids at low cost. This makes them suitable for rural schools.","main finding|main result|we found|our result|show; percent|significant|most; this means|suitable|therefore|so "],
  ["How did you collect your data?","Describe your method: what, how many, how long.","We took water samples twice a week over six months at three different sites. In total we analysed one hundred and twenty samples in the laboratory.","samples|data|measure|survey|interview; week|month|year; in total|in all|analysed|analyzed|collected"],
  ["Isn't your sample too small to generalise?","Acknowledge the limitation, then defend your result calmly.","That is a fair point. The sample is limited, so we cannot generalise to all regions. However, the results were consistent across all three sites, and we plan a larger study next year.","fair point|good point|you are right|agree|limitation|limited; however|but |nevertheless; plan|future|next |further"],
  ["What would you recommend for practice?","Give a recommendation with a reason.","I would recommend that schools combine gravel filters with regular maintenance, because performance drops quickly when filters are not cleaned.","recommend|suggest|should|advise; because|since|as ; maintenance|clean|regular|train"]],
 de:[
  ["Vielen Dank für Ihren Vortrag. Können Sie Ihr Hauptergebnis in ein, zwei Sätzen zusammenfassen?","Nenne dein Hauptergebnis klar und knapp.","Gerne. Unser Hauptergebnis ist, dass Kiesfilter etwa achtzig Prozent der Schwebstoffe kostengünstig entfernen. Damit eignen sie sich gut für Schulen auf dem Land.","ergebnis|gezeigt|zeigt; prozent|deutlich|signifikant|meisten; damit|deshalb|daher|eignen"],
  ["Wie haben Sie Ihre Daten erhoben?","Beschreibe deine Methode: was, wie viele, wie lange.","Wir haben sechs Monate lang zweimal pro Woche Wasserproben an drei Standorten genommen. Insgesamt haben wir hundertzwanzig Proben im Labor analysiert.","proben|daten|gemessen|umfrage|interview; woche|monat|jahr; insgesamt|analysiert|erhoben"],
  ["Ist Ihre Stichprobe nicht zu klein, um zu verallgemeinern?","Erkenne die Grenze an und verteidige dann dein Ergebnis sachlich.","Das ist ein berechtigter Einwand. Die Stichprobe ist begrenzt, deshalb können wir nicht auf alle Regionen schließen. Allerdings waren die Ergebnisse an allen drei Standorten einheitlich, und wir planen nächstes Jahr eine größere Studie.","berechtigt|guter punkt|recht |stimmt|begrenzt; allerdings|aber |trotzdem|jedoch; planen|zukunft|nächst|weitere"],
  ["Was würden Sie für die Praxis empfehlen?","Gib eine Empfehlung mit Begründung.","Ich würde empfehlen, Kiesfilter mit regelmäßiger Wartung zu kombinieren, weil die Leistung schnell sinkt, wenn die Filter nicht gereinigt werden.","empfehle|empfehlen|sollte|rate ; weil|da |denn; wartung|reinig|regelmäßig"]],
 fr:[
  ["Merci pour votre présentation. Pourriez-vous résumer votre résultat principal en une ou deux phrases ?","Énoncez votre résultat principal clairement et brièvement.","Bien sûr. Notre résultat principal est que les filtres à gravier éliminent environ quatre-vingts pour cent des matières en suspension à faible coût. Ils conviennent donc aux écoles rurales.","résultat|montré|montre; pour cent|significati|plupart; donc|ainsi|par conséquent|conviennent"],
  ["Comment avez-vous collecté vos données ?","Décrivez la méthode : quoi, combien, combien de temps.","Nous avons prélevé des échantillons d'eau deux fois par semaine pendant six mois sur trois sites. Au total, nous avons analysé cent vingt échantillons en laboratoire.","échantillon|données|mesure|enquête|entretien; semaine|mois|an ; au total|analysé|collecté"],
  ["Votre échantillon n'est-il pas trop petit pour généraliser ?","Reconnaissez la limite, puis défendez calmement votre résultat.","C'est une remarque juste. L'échantillon est limité, donc nous ne pouvons pas généraliser à toutes les régions. Cependant, les résultats étaient cohérents sur les trois sites, et nous prévoyons une étude plus large l'année prochaine.","remarque juste|vous avez raison|bonne question|limité|d accord; cependant|mais |toutefois|néanmoins; prévoyons|futur|prochain|plus large"],
  ["Que recommanderiez-vous pour la pratique ?","Donnez une recommandation avec une raison.","Je recommanderais de combiner les filtres à gravier avec un entretien régulier, parce qu la performance baisse vite quand les filtres ne sont pas nettoyés.","recommand|conseill|devrait|suggère; parce qu|car |puisque; entretien|nettoy|régulier"]]
}},
{id:"seminar", ctx:"aca", title:{en:"Seminar discussion", de:"Seminardiskussion", fr:"Discussion en séminaire"}, turns:{
 en:[
  ["Today's question: should universities replace exams with project work? What is your view?","State your opinion clearly with one reason.","In my view, universities should use more project work, because it shows how students apply knowledge to real problems.","in my view|i think|i believe|in my opinion|from my perspective; because|since|as ; project|exam|student"],
  ["But projects are harder to grade fairly. Exams are more objective.","Disagree politely and give a counter-argument.","I see your point, but I'm not fully convinced. With clear criteria, projects can be graded fairly, and exams also have problems, for example stress and memorisation.","i see your point|i understand|that s true|fair|i agree; but |however|although; criteria|rubric|for example|such as"],
  ["Can you give an example?","Give a concrete example from your experience or reading.","For example, in my engineering course we designed a water filter in teams. The final report and prototype showed our skills much better than a written test.","for example|for instance|such as; course|class|study|research|project; better|more |showed|show"],
  ["Let's try to find a compromise. What would you propose?","Propose a compromise and summarise.","I would propose a combination: a short exam for basic knowledge and a project for application. That way we keep objectivity and still measure practical skills.","propose|suggest|combination|combine|both; exam; project; that way|so |therefore|in this way"]],
 de:[
  ["Heutige Frage: Sollten Hochschulen Prüfungen durch Projektarbeit ersetzen? Was meinen Sie?","Sag klar deine Meinung und begründe sie.","Meiner Meinung nach sollten Hochschulen mehr Projektarbeit einsetzen, weil sie zeigt, wie Studierende Wissen auf echte Probleme anwenden.","meiner meinung|ich finde|ich denke|ich glaube|aus meiner sicht; weil|da |denn; projekt|prüfung|studier"],
  ["Aber Projekte sind schwerer fair zu bewerten. Prüfungen sind objektiver.","Widersprich höflich und nenne ein Gegenargument.","Ich verstehe Ihren Punkt, bin aber nicht ganz überzeugt. Mit klaren Kriterien kann man Projekte fair bewerten, und auch Prüfungen haben Nachteile, zum Beispiel Stress und Auswendiglernen.","ich verstehe|das stimmt|guter punkt|verständlich; aber |allerdings|jedoch; kriterien|zum beispiel|beispielsweise"],
  ["Können Sie ein Beispiel nennen?","Gib ein konkretes Beispiel aus deiner Erfahrung oder Lektüre.","Zum Beispiel haben wir in meinem Ingenieurkurs im Team einen Wasserfilter entwickelt. Bericht und Prototyp haben unsere Fähigkeiten viel besser gezeigt als eine schriftliche Prüfung.","zum beispiel|beispielsweise; kurs|studium|seminar|projekt|forschung|im team; besser|mehr |gezeigt|zeigt"],
  ["Versuchen wir einen Kompromiss. Was schlagen Sie vor?","Schlag einen Kompromiss vor und fasse zusammen.","Ich würde eine Kombination vorschlagen: eine kurze Prüfung für Grundwissen und ein Projekt für die Anwendung. So bleibt es objektiv, und wir messen trotzdem praktische Fähigkeiten.","vorschlag|schlage|kombination|kombinieren|beides; prüfung; projekt; so |dadurch|damit|deshalb"]],
 fr:[
  ["Question du jour : les universités devraient-elles remplacer les examens par des projets ? Quel est votre avis ?","Donnez clairement votre avis avec une raison.","À mon avis, les universités devraient utiliser davantage les projets, parce qu'ils montrent comment les étudiants appliquent leurs connaissances à des problèmes réels.","à mon avis|je pense|je crois|selon moi|de mon point de vue; parce qu|car |puisque; projet|examen|étudiant"],
  ["Mais les projets sont plus difficiles à noter équitablement. Les examens sont plus objectifs.","Exprimez poliment votre désaccord avec un contre-argument.","Je comprends votre point de vue, mais je ne suis pas entièrement convaincu. Avec des critères clairs, on peut noter les projets équitablement, et les examens ont aussi des défauts, par exemple le stress et l'apprentissage par cœur.","je comprends|c est vrai|certes|vous avez raison; mais |cependant|pourtant|toutefois; critères|par exemple|comme "],
  ["Pouvez-vous donner un exemple ?","Donnez un exemple concret tiré de votre expérience ou de vos lectures.","Par exemple, dans mon cours d'ingénierie, nous avons conçu un filtre à eau en équipe. Le rapport et le prototype ont mieux montré nos compétences qu'un examen écrit.","par exemple|notamment; cours |études|séminaire|projet|recherche; mieux|plus |montré"],
  ["Essayons de trouver un compromis. Que proposez-vous ?","Proposez un compromis et résumez.","Je proposerais une combinaison : un court examen pour les connaissances de base et un projet pour l'application. Ainsi, on garde l'objectivité tout en mesurant les compétences pratiques.","propos|suggère|combinaison|combiner|les deux; examen; projet; ainsi|de cette façon|donc|comme ça"]]
}}
];

  ["dBFS","Dezibel relativ zum Vollaussteuerungspegel: 0 = lautester aufnehmbarer Wert; −20 dBFS = 10-fach kleinere Amplitude. Nicht gleich dB SPL eines Schallpegelmessers."],
  ["MPT (maximale Phonationszeit)","Längste Zeit, die ein Vokal auf einem Atemzug in bequemer Tonhöhe und Lautstärke gehalten wird; bester von 3 Versuchen."],
  ["s/z-Quotient","Längstes /s/ geteilt durch längstes /z/. Etwa 1,0 typisch; ab 1,4 möglicher unvollständiger Stimmlippenschluss."],
  ["Zwerchfellatmung","Einatmen durch Senken des Zwerchfells (kuppelförmiger Muskel unter der Lunge): Bauch geht nach außen, Schultern bleiben locker."],
  ["SOVT","Semi-okkludierter Vokaltrakt: Übungen mit teilweise verschlossenem Mund (Summen, Lippenflattern, Strohhalm). Die Stimmlippen schwingen mit weniger Kraft."],
  ["Artikulation / Positionen","Lautbildung mit Lippen, Zunge, Kiefer, Gaumen. Positionen: Anfang (initial), Mitte (medial), Ende (final) des Wortes."],
  ["Minimalpaar","Zwei Wörter, die sich in genau einem Laut unterscheiden (Kanne/Tanne, sip/ship, poisson/poison)."],
  ["WPM","Words per minute = Wörter pro Minute, Sprech- bzw. Lesetempo."],
  ["Verteilte Wiederholung","Wiederholen in wachsenden Abständen (1, 3, 7, 14, 30, 60 Tage), damit eine Fähigkeit ins Langzeitgedächtnis übergeht."],
  ["Bestehensgrenze / gemeistert","Bestehensgrenze = Mindestpunktzahl einer Stufe (70/75/80). Gemeistert = Stufe 3 bestanden; Artikulation gemeistert = mindestens 9 der letzten 10 Versuche richtig."],
  ["PREP","Redeaufbau: Point (Kernaussage) – Reason (Begründung) – Example (Beispiel) – Point (Kernaussage)."],
  ["Gleichmäßigkeit","Standardabweichung der Lautstärke über 1 s: mittlerer Abstand der Werte von ihrem Durchschnitt; kleiner = gleichmäßiger."]],
 fr:[["Orthophonie (Logopädie)","Prise en charge professionnelle des troubles de la parole, du langage, de la voix, de la déglutition et de la communication (orthophoniste ; all. Logopäde ; angl. speech-language pathologist)."],
  ["Phonation","Production de la voix : l'air des poumons fait vibrer les cordes vocales (deux petits replis de muscle et de tissu dans le larynx)."],
  ["Sonore / sourd","Sonore : les cordes vocales vibrent (/z/, /v/, toutes les voyelles). Sourd : seulement un bruit d'air (/s/, /f/). Test : doigts sur la gorge – la vibration n'apparaît que sur les sons sonores."],
  ["F0 / Hz","Fréquence fondamentale : nombre de vibrations des cordes vocales par seconde (Hz = hertz). Perçue comme la hauteur."],
  ["Demi-ton / cent","Demi-ton = écart entre deux touches voisines du piano. Cent = 1/100 de demi-ton."],
  ["Noms de notes (A3, C4…)","Notation internationale : lettre = note (C = do, D = ré, E = mi, F = fa, G = sol, A = la, B = si), chiffre = octave. C4 ≈ 262 Hz (do central), A4 = 440 Hz (la du diapason), A3 = 220 Hz (une octave plus bas = fréquence divisée par deux)."],
  ["dBFS","Décibels par rapport à la pleine échelle : 0 = le plus fort que le micro peut enregistrer ; −20 dBFS = amplitude 10 fois plus faible. Différent des dB SPL d'un sonomètre."],
  ["TMP (temps maximal de phonation)","Durée la plus longue de tenue d'une voyelle sur une respiration, à hauteur et intensité confortables ; meilleur de 3 essais."],
  ["Rapport s/z","Plus long /s/ divisé par plus long /z/. Environ 1,0 typique ; 1,4 ou plus peut indiquer une fermeture incomplète des cordes vocales."],
  ["Respiration diaphragmatique","Inspirer en abaissant le diaphragme (muscle en dôme sous les poumons) : le ventre se gonfle, les épaules restent détendues."],
  ["SOVT","Conduit vocal semi-occlus : exercices bouche partiellement fermée (fredonnement, vibration des lèvres, paille). Les cordes vocales vibrent avec moins d'effort."],
  ["Articulation / positions","Former les sons avec lèvres, langue, mâchoire, palais. Positions : initiale (début du mot), médiane (milieu), finale (fin)."],
  ["Paire minimale","Deux mots qui ne diffèrent que par un son (poisson/poison, sip/ship, Kanne/Tanne)."],
  ["WPM","Words per minute = mots par minute, vitesse de parole ou de lecture."],
  ["Répétition espacée","Réviser à intervalles croissants (1, 3, 7, 14, 30, 60 jours) pour ancrer une compétence dans la mémoire à long terme."],
  ["Seuil / maîtrise","Seuil = note minimale pour réussir un niveau (70/75/80). Maîtrisé = niveau 3 réussi ; articulation maîtrisée = au moins 9 des 10 derniers essais réussis."],
  ["PREP","Structure de discours : Point – Raison – Exemple – Point."],
  ["Stabilité","Écart-type de l'intensité sur 1 s : écart moyen des valeurs par rapport à leur moyenne ; plus petit = plus stable."]]
};

SCENES.push(
{id:"salary", ctx:"pro", title:{en:"Salary negotiation", de:"Gehaltsverhandlung", fr:"Négociation salariale"}, turns:{
 en:[["Thanks for your great work this year. You asked to talk about your salary?","State your request clearly, with a number and a reason.","Yes, thank you. Based on my results this year and the market rate for my role, I would like to ask for a salary increase to sixty-two thousand euros.","based on|because|results|market; increase|raise; thousand|euros|percent"],
  ["Hmm, that's quite a lot. Our budget is tight this year.","Acknowledge the constraint, then support your request with evidence.","I understand the budget is tight. At the same time, I led the new client project, which brought in about two hundred thousand euros, and I trained two new colleagues.","i understand|i see|understand; led|delivered|brought|achieved|project; client|colleagues|team|thousand"],
  ["I can't promise that amount now. What else could work for you?","Propose an alternative and agree on a next step.","Could we agree on a smaller increase now and a review in six months with clear goals? Alternatively, a training budget would also help me. Can we fix a date to decide?","could we|would you|alternatively|what about|propose; months|review|goals|training; date|decide|next step|follow up"]],
 de:[["Danke für Ihre tolle Arbeit dieses Jahr. Sie wollten über Ihr Gehalt sprechen?","Formuliere deine Forderung klar, mit Zahl und Begründung.","Ja, danke. Auf Grundlage meiner Ergebnisse in diesem Jahr und des Marktwerts meiner Position möchte ich um eine Gehaltserhöhung auf zweiundsechzigtausend Euro bitten.","grundlage|ergebnis|markt|weil; erhöhung|mehr gehalt|anheben; tausend|euro|prozent"],
  ["Hm, das ist ziemlich viel. Unser Budget ist dieses Jahr knapp.","Erkenne die Einschränkung an und belege dann deine Forderung mit Fakten.","Ich verstehe, dass das Budget knapp ist. Gleichzeitig habe ich das neue Kundenprojekt geleitet, das etwa zweihunderttausend Euro eingebracht hat, und zwei neue Kolleginnen eingearbeitet.","verstehe|nachvollziehen|klar; geleitet|erreicht|eingebracht|projekt; kunde|kolleg|team|tausend"],
  ["Diesen Betrag kann ich jetzt nicht zusagen. Was wäre sonst für Sie denkbar?","Schlag eine Alternative vor und vereinbare den nächsten Schritt.","Könnten wir jetzt eine kleinere Erhöhung und ein Gespräch in sechs Monaten mit klaren Zielen vereinbaren? Alternativ würde mir auch ein Weiterbildungsbudget helfen. Können wir einen Termin für die Entscheidung festlegen?","könnten wir|vorschlag|alternativ|wie wäre|würde; monat|ziele|weiterbildung|gespräch; termin|entscheid|festlegen|nächste"]],
 fr:[["Merci pour votre excellent travail cette année. Vous vouliez parler de votre salaire ?","Formulez clairement votre demande, avec un chiffre et une raison.","Oui, merci. Au vu de mes résultats cette année et du marché pour mon poste, je souhaiterais une augmentation à soixante-deux mille euros.","au vu|résultat|marché|parce qu; augmentation|hausse; mille|euros|pour cent"],
  ["Hum, c'est beaucoup. Notre budget est serré cette année.","Reconnaissez la contrainte, puis appuyez votre demande par des faits.","Je comprends que le budget soit serré. En même temps, j'ai dirigé le nouveau projet client, qui a rapporté environ deux cent mille euros, et j'ai formé deux nouveaux collègues.","comprends|entends; dirigé|réalisé|rapporté|projet; client|collègue|équipe|mille"],
  ["Je ne peux pas promettre ce montant maintenant. Qu'est-ce qui pourrait vous convenir ?","Proposez une alternative et fixez une prochaine étape.","Pourrions-nous convenir d'une augmentation plus petite maintenant et d'un nouveau point dans six mois avec des objectifs clairs ? Sinon, un budget de formation m'aiderait aussi. Pouvons-nous fixer une date pour décider ?","pourrions|proposer|sinon|que diriez|alternative; mois|objectif|formation|point; date|décider|fixer|prochaine"]]
}},
{id:"feedback", ctx:"pro", title:{en:"Giving critical feedback", de:"Kritisches Feedback geben", fr:"Donner un retour critique"}, turns:{
 en:[["You wanted to talk to me? Is something wrong?","Open calmly and name the topic without blaming.","Thanks for taking the time. Nothing dramatic, but I'd like to talk about the last two team reports, because I noticed something I want to share with you.","thank; talk about|discuss|share; report|meeting|deadline|work"],
  ["Okay… what about them?","Describe the specific behaviour and its impact – not the person.","Both reports arrived one day after the deadline. As a result, I had to present to the client without the latest figures, which was uncomfortable for the whole team.","deadline|late|after; as a result|so |because|impact|which; client|team|figures"],
  ["I've just had too much on my plate recently.","Show understanding and agree on a solution together.","I understand, and thanks for telling me. Let's look at your priorities together. Could you tell me early when a deadline is at risk, so we can adjust in time?","understand|thanks for telling|i see; together|let s|we can; could you|early|in time|adjust|priorit"]],
 de:[["Du wolltest mit mir sprechen? Ist etwas nicht in Ordnung?","Eröffne ruhig und nenne das Thema ohne Vorwurf.","Danke, dass du dir Zeit nimmst. Nichts Dramatisches, aber ich möchte über die letzten beiden Teamberichte sprechen, weil mir etwas aufgefallen ist.","dank; sprechen|reden|besprechen; bericht|termin|abgabe|arbeit"],
  ["Okay … was ist damit?","Beschreibe das konkrete Verhalten und seine Folge – nicht die Person.","Beide Berichte kamen einen Tag nach der Frist. Dadurch musste ich dem Kunden ohne die aktuellen Zahlen präsentieren, und das war für das ganze Team unangenehm.","frist|spät|nach dem termin|verspät; dadurch|deshalb|weil|folge; kunde|team|zahlen"],
  ["Ich hatte in letzter Zeit einfach zu viel auf dem Tisch.","Zeig Verständnis und vereinbart gemeinsam eine Lösung.","Das verstehe ich, danke, dass du es sagst. Lass uns gemeinsam auf deine Prioritäten schauen. Kannst du mir früh Bescheid geben, wenn eine Frist wackelt, damit wir rechtzeitig umplanen können?","verstehe|danke|nachvollziehen; gemeinsam|zusammen|lass uns; früh|bescheid|rechtzeitig|prioritäten"]],
 fr:[["Tu voulais me parler ? Il y a un problème ?","Ouvrez calmement et nommez le sujet sans reproche.","Merci de prendre le temps. Rien de grave, mais j'aimerais parler des deux derniers rapports d'équipe, parce que j'ai remarqué quelque chose.","merci; parler|discuter|aborder; rapport|délai|réunion|travail"],
  ["D'accord… qu'est-ce qu'ils ont ?","Décrivez le comportement précis et son impact – pas la personne.","Les deux rapports sont arrivés un jour après la date limite. Du coup, j'ai dû présenter au client sans les derniers chiffres, ce qui a été gênant pour toute l'équipe.","date limite|retard|après|délai; du coup|donc|par conséquent|ce qui; client|équipe|chiffres"],
  ["J'ai juste eu trop de travail ces derniers temps.","Montrez de la compréhension et trouvez ensemble une solution.","Je comprends, merci de me le dire. Regardons ensemble tes priorités. Est-ce que tu pourrais me prévenir tôt quand un délai est en danger, pour qu'on puisse s'adapter à temps ?","comprends|merci de; ensemble|regardons|on peut; prévenir|tôt|à temps|priorit"]]
}},
{id:"sayno", ctx:"cas", title:{en:"Saying no to family", de:"Nein sagen in der Familie", fr:"Dire non en famille"}, turns:{
 en:[["Can you look after the kids again this whole weekend? It would really help me.","Say no kindly but clearly, without long excuses.","I can see you need help, and I love the kids. But this weekend I can't, because I really need some rest after a hard week.","i can see|i understand|i know|love; can t|cannot|no |not this; because|need|rest"],
  ["Come on, it's only two days. You always say you're tired.","Hold your boundary calmly, without getting defensive.","I understand it's frustrating. My answer is still no for this weekend. It's not about you, it's about my energy.","understand|i hear|frustrat; still|my answer|no ; not about|energy|need"],
  ["Fine. So what can you do, then?","Offer an alternative that works for you.","I could take them next Saturday afternoon, from two to six. Would that help you?","could|can |offer|how about; saturday|sunday|next|afternoon|morning; would that|does that|help|work"]],
 de:[["Kannst du wieder das ganze Wochenende auf die Kinder aufpassen? Das würde mir echt helfen.","Sag freundlich, aber klar Nein – ohne lange Ausreden.","Ich sehe, dass du Hilfe brauchst, und ich mag die Kinder sehr. Aber dieses Wochenende geht es nicht, weil ich nach einer harten Woche wirklich Ruhe brauche.","ich sehe|verstehe|ich weiß|mag ; nicht|nein; weil|brauche|ruhe"],
  ["Komm schon, es sind nur zwei Tage. Du bist doch immer müde.","Bleib ruhig bei deiner Grenze, ohne dich zu rechtfertigen.","Ich verstehe, dass das frustrierend ist. Meine Antwort bleibt Nein für dieses Wochenende. Es geht nicht um dich, sondern um meine Energie.","verstehe|frustrier; bleibt|meine antwort|nein; nicht um dich|energie|brauche"],
  ["Na gut. Was kannst du denn dann machen?","Biete eine Alternative an, die für dich passt.","Ich könnte sie nächsten Samstagnachmittag nehmen, von zwei bis sechs. Würde dir das helfen?","könnte|kann |biete|wie wäre; samstag|sonntag|nächst|nachmittag|vormittag; würde dir|hilft|passt|helfen"]],
 fr:[["Tu peux encore garder les enfants tout le week-end ? Ça m'aiderait vraiment.","Dites non gentiment mais clairement, sans longues excuses.","Je vois que tu as besoin d'aide, et j'adore les enfants. Mais ce week-end, je ne peux pas, parce que j'ai vraiment besoin de repos après une semaine difficile.","je vois|je comprends|je sais|adore; ne peux pas|non |pas ce; parce qu|besoin|repos"],
  ["Allez, c'est seulement deux jours. Tu dis toujours que tu es fatigué.","Maintenez calmement votre limite, sans vous justifier.","Je comprends que ce soit frustrant. Ma réponse reste non pour ce week-end. Ce n'est pas contre toi, c'est une question d'énergie.","comprends|frustrant; reste|ma réponse|non ; pas contre toi|énergie|besoin"],
  ["Bon. Alors qu'est-ce que tu peux faire ?","Proposez une alternative qui vous convient.","Je pourrais les prendre samedi prochain l'après-midi, de deux heures à six heures. Est-ce que ça t'aiderait ?","pourrais|peux |propose; samedi|dimanche|prochain|après midi|matin; aiderait|ça te va|convient"]]
}},
{id:"homework", ctx:"cas", title:{en:"Parenting: homework before games", de:"Erziehung: erst Hausaufgaben, dann Spiele", fr:"Parentalité : devoirs avant les jeux"}, turns:{
 en:[["Why do I have to stop playing now? I'm not done!","Stay calm, show you understand, and state the rule.","I get it, it's annoying to stop in the middle of a game. But our rule is homework first, then games, and it's already six o'clock.","i get it|i understand|i know|annoying; rule|agreed|homework first; then|o clock|time"],
  ["But the homework is boring and I don't understand it anyway.","Acknowledge the feeling and offer concrete help.","It sounds frustrating when you don't understand it. Let's look at the first exercise together for ten minutes, and then you try the next one alone.","sounds|frustrat|understand; together|let s|help; minutes|first|then"],
  ["Okay… but can I play afterwards?","Agree on a clear deal with a time limit.","Yes. When your homework is finished, you can play for forty-five minutes, until eight o'clock. Deal?","yes|okay|sure; when|after|finished|done; minutes|until|o clock|deal"]],
 de:[["Warum muss ich jetzt aufhören zu spielen? Ich bin noch nicht fertig!","Bleib ruhig, zeig Verständnis und nenne die Regel.","Ich verstehe, es nervt, mitten im Spiel aufzuhören. Aber unsere Regel ist: erst Hausaufgaben, dann Spiele, und es ist schon sechs Uhr.","verstehe|ich weiß|nervt; regel|abgemacht|erst ; dann|uhr|zeit"],
  ["Aber die Hausaufgaben sind langweilig, und ich verstehe sie sowieso nicht.","Erkenne das Gefühl an und biete konkrete Hilfe an.","Das klingt frustrierend, wenn man etwas nicht versteht. Lass uns die erste Aufgabe zehn Minuten zusammen anschauen, und die nächste probierst du dann allein.","klingt|frustrier|verstehe; zusammen|gemeinsam|lass uns|helfe; minuten|erste|dann"],
  ["Okay … aber darf ich danach spielen?","Triff eine klare Abmachung mit Zeitgrenze.","Ja. Wenn die Hausaufgaben fertig sind, darfst du fünfundvierzig Minuten spielen, bis acht Uhr. Abgemacht?","ja |okay|klar; wenn|danach|fertig; minuten|bis |uhr|abgemacht"]],
 fr:[["Pourquoi je dois arrêter de jouer maintenant ? J'ai pas fini !","Restez calme, montrez que vous comprenez et rappelez la règle.","Je comprends, c'est énervant d'arrêter au milieu d'une partie. Mais notre règle, c'est d'abord les devoirs, ensuite les jeux, et il est déjà six heures.","comprends|je sais|énervant; règle|convenu|d abord; ensuite|heures|l heure"],
  ["Mais les devoirs sont ennuyeux et de toute façon je ne comprends rien.","Reconnaissez le ressenti et proposez une aide concrète.","C'est frustrant quand on ne comprend pas. Regardons ensemble le premier exercice pendant dix minutes, et ensuite tu essaies le suivant seul.","frustrant|comprends|difficile; ensemble|regardons|aide; minutes|premier|ensuite"],
  ["D'accord… mais je pourrai jouer après ?","Mettez-vous d'accord sur un marché clair avec une limite de temps.","Oui. Quand tes devoirs sont finis, tu peux jouer quarante-cinq minutes, jusqu'à huit heures. Marché conclu ?","oui|d accord|bien sûr; quand|après|fini; minutes|jusqu|heures|marché"]]
}},
{id:"opening", ctx:"aca", title:{en:"Opening a presentation", de:"Einen Vortrag eröffnen", fr:"Ouvrir un exposé"}, turns:{
 en:[["Our next speaker is ready. The floor is yours.","Open with a hook: a question or a surprising fact.","Thank you. Did you know that one in four schools in the world has no safe drinking water? Today I want to show you a simple way to change that.","thank; did you know|imagine|question|one in|percent; today|want to show|i will"],
  ["(You feel nervous; the audience is waiting.) Please continue with your outline.","Give a clear outline of your talk in three parts.","My talk has three parts. First, the problem and its causes. Second, the gravel filter we tested. And finally, what schools can do with very little money.","three parts|three points|outline; first|firstly; second|then|next; finally|lastly|third"],
  ["Sorry, could you speak up a bit? We can't hear you at the back.","React calmly, project your voice and continue.","Of course, thank you for telling me. Is this better at the back? Good. So, let's start with the problem.","of course|sure|thank; better|hear|at the back; so |let s|start|continue"]],
 de:[["Unser nächster Redner ist bereit. Sie haben das Wort.","Beginne mit einem Aufhänger: einer Frage oder einer überraschenden Zahl.","Vielen Dank. Wussten Sie, dass jede vierte Schule der Welt kein sicheres Trinkwasser hat? Heute möchte ich Ihnen zeigen, wie man das einfach ändern kann.","dank; wussten sie|stellen sie sich vor|frage|jede vierte|prozent; heute|möchte ich|zeigen"],
  ["(Sie sind nervös; das Publikum wartet.) Bitte fahren Sie mit Ihrer Gliederung fort.","Gib eine klare Gliederung in drei Teilen.","Mein Vortrag hat drei Teile. Erstens das Problem und seine Ursachen. Zweitens der Kiesfilter, den wir getestet haben. Und schließlich, was Schulen mit sehr wenig Geld tun können.","drei teile|drei punkte|gliederung; erstens|zuerst; zweitens|dann|danach; schließlich|zum schluss|drittens"],
  ["Entschuldigung, könnten Sie etwas lauter sprechen? Hinten hört man Sie nicht.","Reagiere ruhig, sprich tragfähiger und mach weiter.","Natürlich, danke für den Hinweis. Ist es hinten jetzt besser? Gut. Dann beginnen wir mit dem Problem.","natürlich|gerne|danke; besser|hören|hinten; dann|beginnen|weiter|also"]],
 fr:[["Notre prochain intervenant est prêt. Vous avez la parole.","Commencez par une accroche : une question ou un chiffre surprenant.","Merci. Saviez-vous qu'une école sur quatre dans le monde n'a pas d'eau potable sûre ? Aujourd'hui, je veux vous montrer un moyen simple de changer cela.","merci; saviez vous|imaginez|question|une sur|pour cent; aujourd hui|je veux|montrer|je vais"],
  ["(Vous êtes nerveux ; le public attend.) Veuillez continuer avec votre plan.","Annoncez un plan clair en trois parties.","Mon exposé comporte trois parties. D'abord, le problème et ses causes. Ensuite, le filtre à gravier que nous avons testé. Enfin, ce que les écoles peuvent faire avec très peu d'argent.","trois parties|trois points|plan; d abord|premièrement; ensuite|deuxièmement|puis; enfin|pour finir|troisièmement"],
  ["Pardon, vous pourriez parler un peu plus fort ? On ne vous entend pas au fond.","Réagissez calmement, portez la voix et continuez.","Bien sûr, merci de me le dire. C'est mieux au fond ? Très bien. Alors, commençons par le problème.","bien sûr|volontiers|merci; mieux|entend|au fond; alors|commençons|continuons|donc"]]
}},
{id:"extension", ctx:"aca", title:{en:"Asking a professor for an extension", de:"Bei der Professorin um Fristverlängerung bitten", fr:"Demander un délai à une professeure"}, turns:{
 en:[["Come in. What can I do for you?","Greet, introduce yourself and state your request briefly.","Good afternoon, Professor Klein. I'm Alex Meyer from your Tuesday seminar. I'd like to ask whether I could get a one-week extension for my term paper.","good afternoon|good morning|hello; i m|i am|my name|from your; extension|more time|deadline"],
  ["Why do you need more time? The deadline was announced months ago.","Give an honest reason and show what you have already done.","That's true. I was ill for ten days last month, and I have a medical certificate. I have already finished the literature review and half of the analysis.","true|you re right|i know; ill |sick|because|certificate|reason; already|finished|done|half"],
  ["Alright. What would the new deadline be?","Propose a concrete date and thank the professor.","Would Friday the twelfth be possible? I would also send you the outline by Monday. Thank you very much for your understanding.","would|could|possible|propose; friday|monday|twelfth|date|week; thank"]],
 de:[["Herein. Was kann ich für Sie tun?","Begrüße, stell dich vor und nenne kurz dein Anliegen.","Guten Tag, Frau Professorin Klein. Ich bin Alex Meyer aus Ihrem Dienstagsseminar. Ich möchte fragen, ob ich eine Woche Verlängerung für meine Hausarbeit bekommen könnte.","guten tag|guten morgen|hallo; ich bin|mein name|aus ihrem; verlängerung|mehr zeit|frist|abgabe"],
  ["Warum brauchen Sie mehr Zeit? Die Frist ist seit Monaten bekannt.","Nenne einen ehrlichen Grund und zeig, was schon erledigt ist.","Das stimmt. Ich war letzten Monat zehn Tage krank und habe ein ärztliches Attest. Die Literaturrecherche ist schon fertig und die Analyse zur Hälfte.","stimmt|richtig|ich weiß; krank|weil|attest|grund; schon|fertig|erledigt|hälfte"],
  ["In Ordnung. Was wäre der neue Termin?","Schlag ein konkretes Datum vor und bedanke dich.","Wäre Freitag, der Zwölfte, möglich? Die Gliederung würde ich Ihnen schon bis Montag schicken. Vielen Dank für Ihr Verständnis.","wäre|könnte|möglich|vorschlag; freitag|montag|zwölft|datum|woche; dank"]],
 fr:[["Entrez. Que puis-je faire pour vous ?","Saluez, présentez-vous et formulez brièvement votre demande.","Bonjour Madame Klein. Je suis Alex Meyer, de votre séminaire du mardi. Je voudrais vous demander s'il serait possible d'avoir une semaine de délai supplémentaire pour mon mémoire.","bonjour|bonsoir; je suis|je m appelle|de votre; délai|plus de temps|date limite|prolongation"],
  ["Pourquoi avez-vous besoin de plus de temps ? La date est connue depuis des mois.","Donnez une raison honnête et montrez ce qui est déjà fait.","C'est vrai. J'ai été malade dix jours le mois dernier, et j'ai un certificat médical. J'ai déjà terminé la revue de littérature et la moitié de l'analyse.","c est vrai|vous avez raison|je sais; malade|parce qu|certificat|raison; déjà|terminé|fini|moitié"],

 {id:"pause", dim:"pauses", txt:{
  en:["The power of the pause",["Pause for 1–2 seconds after each complete idea – listeners need this time to process.","A short pause before an important word creates attention.","Replace fillers (uhm, so) with silence: silence sounds confident, fillers sound unsure."],"Explain what you do at work in three sentences, with a clear pause after each sentence."],

 {id:"fall", dim:"melody", txt:{

  de:["Aussagen fallen lassen",["In einer Aussage fällt die Tonhöhe auf dem letzten Wort. Ein steigendes Ende klingt wie eine Frage und wirkt unsicher.","Ja/Nein-Fragen dürfen am Ende steigen – das ist richtig.","Übung: Sag „Ich heiße …“ und lass die Stimme auf deinem Namen deutlich fallen."],"Nenne drei Fakten über dich und lass die Stimme am Ende jedes Satzes fallen."],
  fr:["Faire descendre les affirmations",["Dans une affirmation, la voix descend sur le dernier mot. Une fin montante ressemble à une question et paraît peu assurée.","Les questions fermées (oui/non) peuvent monter à la fin – c'est correct.","Exercice : dites « Je m'appelle … » en faisant nettement descendre la voix sur votre nom."],"Donnez trois informations sur vous en faisant descendre la voix à la fin de chacune."]}},
 {id:"melody", dim:"melody", txt:{

  de:["Melodie in die Stimme bringen",["Eine monotone Stimme ermüdet Zuhörer. Ziel: Tonhöhenvariation über 2,5 Halbtöne (siehe Glossar).","Betone ein Schlüsselwort pro Satz: etwas höher, lauter und länger.","Stell dir vor, du erklärst einem Kind etwas Spannendes."],"Beschreibe dein Lieblingsessen, als wäre es das Beste der Welt."],
  fr:["Mettre de la mélodie dans la voix",["Une voix monotone fatigue l'auditeur. Visez une variation de hauteur supérieure à 2,5 demi-tons (voir le glossaire).","Accentuez un mot clé par phrase : un peu plus haut, plus fort et plus long.","Imaginez que vous expliquez quelque chose de passionnant à un enfant."],"Décrivez votre plat préféré comme si c'était la meilleure chose au monde."]}},

 {id:"belly", dim:"projection", txt:{

  de:["Aus dem Bauch sprechen",["Lautstärke kommt aus der Atemstütze, nicht aus Drücken im Hals.","Tief einatmen (Bauch raus), beim Sprechen den Bauch langsam nach innen gehen lassen.","Mund weiter öffnen und die Stimme zur entferntesten Person im Raum richten."],"Stell dich vor, als ob du zu jemandem in 5 Metern Entfernung sprichst."],
  fr:["Parler avec le ventre",["Le volume vient du soutien respiratoire, pas d'une poussée dans la gorge.","Inspirez bas (ventre qui gonfle), puis laissez le ventre rentrer lentement en parlant.","Ouvrez davantage la bouche et dirigez la voix vers la personne la plus éloignée."],"Présentez-vous comme si vous parliez à quelqu'un à 5 mètres."]}},
 {id:"fillers", dim:"fluency", txt:{

  de:["Füllwörter loswerden",["Füllwörter entstehen, wenn wir beim Sprechen denken. Plane den ersten Satz, bevor du anfängst.","Wenn ein „äh“ kommt: Mund schließen und Pause machen.","Nimm dich auf und zähle deine Füllwörter – sie zu bemerken ist der erste Schritt, sie zu ersetzen."],"Sprich 30 Sekunden über deinen letzten Urlaub ohne ein einziges Füllwort."],

 {id:"star", dim:"fluency", txt:{
  en:["Structure answers with STAR",["STAR = Situation (context), Task (your goal), Action (what you did), Result (the outcome, ideally with a number).","Use it in job interviews and feedback talks.","Keep each part to one or two sentences."],"Describe a problem you solved, using STAR."],
  de:["Antworten mit STAR strukturieren",["STAR = Situation (Kontext), Task (Aufgabe/Ziel), Action (was du getan hast), Result (Ergebnis, am besten mit Zahl).","Nutze es im Vorstellungsgespräch und in Feedbackgesprächen.","Jeder Teil höchstens ein bis zwei Sätze."],"Beschreibe mit STAR ein Problem, das du gelöst hast."],
  fr:["Structurer ses réponses avec STAR",["STAR = Situation (contexte), Tâche (votre objectif), Action (ce que vous avez fait), Résultat (idéalement chiffré).","Utilisez-la en entretien d'embauche et lors d'un retour.","Une ou deux phrases par partie."],"Décrivez un problème que vous avez résolu, avec la méthode STAR."]}},
 {id:"pushback", dim:"clarity", txt:{
  en:["Handling pushback: acknowledge – bridge – answer",["Acknowledge: “I understand your concern.” This lowers the tension.","Bridge: “At the same time…” or “That's why…” connects to your point.","Answer: give one fact or example, then stop – don't over-justify."],"Your manager says your proposal is too expensive. Respond in three sentences."],
  de:["Mit Widerspruch umgehen: anerkennen – überleiten – antworten",["Anerkennen: „Ich verstehe Ihre Bedenken.“ Das senkt die Spannung.","Überleiten: „Gleichzeitig …“ oder „Genau deshalb …“ verbindet mit deinem Punkt.","Antworten: ein Fakt oder Beispiel nennen, dann aufhören – nicht übermäßig rechtfertigen."],"Deine Chefin sagt, dein Vorschlag sei zu teuer. Antworte in drei Sätzen."],
  fr:["Gérer les objections : reconnaître – faire le lien – répondre",["Reconnaître : « Je comprends votre inquiétude. » Cela baisse la tension.","Faire le lien : « En même temps… » ou « C'est justement pour ça que… » ramène à votre point.","Répondre : un fait ou un exemple, puis s'arrêter – ne pas trop se justifier."],"Votre responsable dit que votre proposition est trop chère. Répondez en trois phrases."]}},
 {id:"body", dim:"projection", video:true, txt:{

  de:["Körpersprache vor der Kamera",["Schau in die Kameralinse, nicht auf den Bildschirm – das ist Blickkontakt für dein Gegenüber.","Aufrecht sitzen oder stehen, Schultern locker, Hände sichtbar.","Lächle am Anfang und am Ende – das verändert auch den Klang der Stimme."],"Nimm mit der Frontkamera ein 30-Sekunden-Video auf, in dem du dich vorstellst."],
  fr:["Le langage corporel face caméra",["Regardez l'objectif, pas l'écran – c'est le contact visuel pour votre interlocuteur.","Assis ou debout, dos droit, épaules relâchées, mains visibles.","Souriez au début et à la fin – cela change aussi le son de votre voix."],"Enregistrez une vidéo de 30 secondes avec la caméra frontale pour vous présenter."]}}

ROUTINES.push({name:{en:"Voice from the belly",de:"Stimme aus dem Bauch",fr:"Voix du ventre"}, steps:[
 [60,{de:["Bauchatmung spüren","Rücklings liegen oder aufrecht sitzen, eine Hand auf dem Bauch, eine auf der Brust. Durch die Nase einatmen: nur die Bauchhand hebt sich. Langsam durch den Mund aus: der Bauch sinkt. Die Brusthand bleibt ruhig.","So spürst du, wo die Atmung für die Stimme stattfinden soll – unten, nicht oben in Brust und Schultern."],en:["Feel belly breathing","Lie on your back or sit upright, one hand on the belly, one on the chest. Breathe in through the nose: only the belly hand rises. Breathe out slowly through the mouth: the belly sinks. The chest hand stays still.","You feel where breathing for the voice should happen – low, not high in chest and shoulders."],fr:["Sentir la respiration abdominale","Allongé sur le dos ou assis droit, une main sur le ventre, une sur la poitrine. Inspirez par le nez : seule la main du ventre monte. Expirez lentement par la bouche : le ventre descend. La main de la poitrine ne bouge pas.","Vous sentez où doit se faire la respiration pour la voix – en bas, pas dans la poitrine et les épaules."]}],
 [30,{de:["Hecheln","Mund leicht offen, schnell und flach hecheln wie ein Hund nach dem Laufen (etwa 2 pro Sekunde). Nur der Bauch bewegt sich, der Hals bleibt locker. Bei Schwindel sofort aufhören.","Aktiviert und lockert das Zwerchfell."],en:["Panting","Mouth slightly open, pant quickly and lightly like a dog after running (about 2 per second). Only the belly moves, the throat stays loose. Stop at once if you feel dizzy.","Activates and loosens the diaphragm."],fr:["Halètement","Bouche entrouverte, haletez vite et légèrement comme un chien après une course (environ 2 par seconde). Seul le ventre bouge, la gorge reste souple. Arrêtez tout de suite en cas de vertige.","Active et assouplit le diaphragme."]}],
 [45,{de:["Zwerchfell-Impulse auf f","Kurze, kräftige „f – f – f – f“ wie beim Ausblasen einer Kerze. Jeder Impuls ist ein kleiner Ruck der Bauchdecke nach innen; dazwischen Bauch loslassen.","Trainiert den Bauch als Motor für den Luftstrom."],en:["Diaphragm impulses on f","Short, strong “f – f – f – f” like blowing out a candle. Each impulse is a small inward jerk of the belly wall; release the belly in between.","Trains the belly as the motor of the airflow."],fr:["Impulsions sur f","Des « f – f – f – f » courts et forts, comme pour souffler une bougie. Chaque impulsion est un petit coup du ventre vers l'intérieur ; entre deux, relâchez le ventre.","Entraîne le ventre comme moteur du souffle."]}],
 [45,{de:["Impulse mit Stimme","Jetzt „ha – ha – ha“, „ho – ho – ho“, „hey!“ wie ein freundlicher Zuruf. Der Impuls kommt aus dem Bauch, die Kehle bleibt weit, kein Kratzen im Hals.","Verbindet Atemimpuls und Stimme ohne Pressen."],en:["Impulses with voice","Now “ha – ha – ha”, “ho – ho – ho”, “hey!” like a friendly call. The impulse comes from the belly, the throat stays wide, no scratching in the throat.","Connects breath impulse and voice without pushing."],fr:["Impulsions avec la voix","Maintenant « ha – ha – ha », « ho – ho – ho », « hé ! » comme un appel amical. L'impulsion vient du ventre, la gorge reste ouverte, sans gratter.","Relie l'impulsion respiratoire et la voix sans pousser."]}],
 [45,{de:["Gähnen und weit werden","Ein Gähnen beginnen und den weiten Raum im Rachen spüren. Mit diesem Gefühl „hmm“ seufzen, dann „ja“, „nein“, „hallo“ sagen.","Senkt den Kehlkopf und nimmt Druck aus dem Hals."],en:["Yawn and widen","Start a yawn and feel the wide space in the throat. With that feeling sigh “hmm”, then say “yes”, “no”, “hello”.","Lowers the larynx and takes pressure off the throat."],fr:["Bâiller et ouvrir","Commencez un bâillement et sentez l'espace large dans la gorge. Avec cette sensation, soupirez « hmm », puis dites « oui », « non », « bonjour ».","Abaisse le larynx et enlève la pression de la gorge."]}],
 [60,{de:["Summen mit Bauchstütze","Lippen locker zu, „mmmm“ in bequemer Tonlage summen, dabei den Bauch langsam einziehen. Hand auf Brustbein und Gesicht: das Vibrieren spüren. Dann öffnen: „mmm-ma, mmm-mo, mmm-mu“.","Lenkt den Klang nach vorne in den Gesichtsraum (Resonanz) statt in den Hals."],en:["Humming with belly support","Lips loosely closed, hum “mmmm” at a comfortable pitch while slowly pulling the belly in. Hands on breastbone and face: feel the vibration. Then open: “mmm-ma, mmm-mo, mmm-moo”.","Moves the sound forward into the face (resonance) instead of the throat."],fr:["Fredonner avec le ventre","Lèvres fermées sans serrer, fredonnez « mmmm » à hauteur confortable en rentrant lentement le ventre. Mains sur le sternum et le visage : sentez la vibration. Puis ouvrez : « mmm-ma, mmm-mo, mmm-mou ».","Place le son vers l'avant, dans le visage (résonance), plutôt que dans la gorge."]}],
 [60,{de:["Zählen mit Stütze","Einatmen in den Bauch, dann auf einem Atem langsam und deutlich zählen: „eins, zwei, drei …“. Bei jeder Zahl gibt der Bauch einen kleinen Impuls. Aufhören, bevor es im Hals eng wird.","Überträgt die Stütze auf die Sprache."],en:["Counting with support","Breathe into the belly, then count slowly and clearly on one breath: “one, two, three…”. With each number the belly gives a small impulse. Stop before the throat gets tight.","Transfers support to speech."],fr:["Compter avec soutien","Inspirez dans le ventre, puis comptez lentement et nettement sur un souffle : « un, deux, trois… ». À chaque nombre, le ventre donne une petite impulsion. Arrêtez avant que la gorge se serre.","Transfère le soutien vers la parole."]}],
 [60,{de:["Satz mit Bauchstütze","„Heute spreche ich ruhig, klar und kraftvoll.“ – dreimal: leise, normal, tragfähig in den Raum. Die Lautstärke kommt aus dem Bauch, nicht aus mehr Druck im Hals. Danach im Atem-Tab den Vorher/Nachher-Vergleich machen.","Festigt das neue Gefühl im Sprechen."],en:["Sentence with support","“Today I speak calmly, clearly and with energy.” – three times: quiet, normal, carrying into the room. Volume comes from the belly, not from more pressure in the throat. Then do the before/after comparison in the Breath tab.","Anchors the new feeling in speech."],fr:["Phrase avec soutien","« Aujourd'hui, je parle calmement, clairement et avec énergie. » – trois fois : doucement, normalement, en portant la voix dans la pièce. Le volume vient du ventre, pas d'une pression accrue dans la gorge. Ensuite, faites la comparaison avant/après dans l'onglet Souffle.","Ancre la nouvelle sensation dans la parole."]}]
]});

function resample(src, sr, tr){

  return out;
}

function tone(f,d=2){ try{ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.25,c.currentTime+.05); g.gain.setValueAtTime(.25,c.currentTime+d-.2); g.gain.linearRampToValueAtTime(0,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.05);}catch(e){} }

/* ---------- text-to-speech (partner voice) ---------- */
function speak(text, lang, onend, rate, role, pitchMul){
  let done=false; const fin=()=>{ if(!done){ done=true; onend&&onend(); } };
  try{
    if(!("speechSynthesis" in window)) return fin();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=LOCALE[lang]; u.rate=rate||+SET.rate||1;
    if(role==="model"&&typeof modelVoice==="function"){ const m=modelVoice(lang); if(m.voice) try{ u.voice=m.voice; }catch(e){} u.pitch=Math.max(0.1,Math.min(2,m.pitch*(pitchMul||1))); u.rate=u.rate*m.rate; }
    else { const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang));
      const pref=vs.find(v=>v.lang.replace("_","-")===LOCALE[lang])||vs[0]; if(pref) try{ u.voice=pref; }catch(e){} }
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    setTimeout(fin, 1500+text.length*90/(rate||+SET.rate||1));
  }catch(e){ fin(); }
}

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let srBroken = !SR;
function recognizeOnce(lang, onInterim){
  return new Promise((resolve,reject)=>{
    let r; try{ r=new SR(); }catch(e){ srBroken=true; return reject("unsupported"); }
    r.lang=LOCALE[lang]; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    let finalTxt="", interim="", tFirst=null, tLast=null, err=null, confs=[];
    r.onresult=e=>{ const now=performance.now(); if(tFirst===null) tFirst=now; tLast=now; interim=""; finalTxt="";
      confs=[]; for(let i=0;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal){ finalTxt+=tr+" "; confs.push(e.results[i][0].confidence||0); } else interim+=tr+" "; }
      onInterim&&onInterim((finalTxt+interim).trim()); };
    r.onerror=e=>{ err=e.error; if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)) srBroken=true; };
    r.onend=()=>{ const text=(finalTxt||interim).trim(); if(err&&err!=="no-speech"&&!text) reject(err); else resolve({text,tFirst,tLast,confs}); };
    try{ r.start(); }catch(e){ srBroken=true; reject("start-failed"); }
    recognizeOnce.current=r;
  });
}
function stopRecognition(){ try{ recognizeOnce.current&&recognizeOnce.current.stop(); }catch(e){} }

/* ---------- text matching & scoring ---------- */
const norm = s => String(s).toLowerCase().replace(/ß/g,"ss").replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function parseKW(str){ return str.split(";").map(g=>g.split("|").map(a=>a.replace(/^\s+/,"")).filter(a=>a.trim())).filter(g=>g.length); }
function kwHit(textN, alt){ const whole=/\s$/.test(alt), k=norm(alt); if(!k) return false; const hay=" "+textN+" ";
  if(whole) return hay.includes(" "+k+" "); if(k.length>=5) return hay.includes(k); return hay.includes(" "+k); }
function scoreTurn({text,dur,latency,level,model,kw,lang}){
  const tn=norm(text), words=tn?tn.split(" "):[], groups=parseKW(kw);
  const hits=groups.map(g=>g.some(a=>kwHit(tn,a)));
  let content=groups.length?hits.filter(Boolean).length/groups.length:1;
  const mw=norm(model).split(" ");
  if(level===1){ const ms=new Set(mw), ws=new Set(words); let o=0; ms.forEach(w=>{ if(ws.has(w)) o++; }); content=0.5*content+0.5*(o/ms.size); }
  const complete=Math.min(1, words.length/(0.6*mw.length));
  const wpm = dur>1.5 ? words.length/(dur/60) : null;
  const pace = wpm===null?0.7 : wpm<110?Math.max(0,(wpm-60)/50) : wpm>170?Math.max(0,(230-wpm)/60) : 1;
  const fset=new Set(FILLERS[lang].map(norm)), fillers=words.filter(w=>fset.has(w)).length;
  const fluency=Math.max(0, 1-0.25*fillers-(latency!=null&&latency>4?0.3:0));
  const score=Math.round(100*(0.5*content+0.2*complete+0.15*pace+0.15*fluency));
  return {score,content,complete,pace,fluency,wpm,fillers,hits,groups,auto:true};
}

$("#brStart").onclick=()=>{
  if(BR.run){ stopBreath(); return; }

  const P=BREATH[BR.p].ph, cyc=P.reduce((a,p)=>a+p[1],0), rounds=+$("#brRounds").value, t0=performance.now(), PH=BREATH_PH[SET.ui];
  BR.run=true; $("#brStart").textContent=t("stopb"); let lastPh=-1,lastSec=-1;
  const step=now=>{ if(!BR.run) return;
    const tt0=(now-t0)/1000, r=Math.floor(tt0/cyc);
    if(r>=rounds){ stopBreath(); beep(990,.3); logSession(BREATH[BR.p].name[SET.ui],rounds*cyc/60); return; }
    $("#brRound").textContent=r+1; let tt=tt0-r*cyc,k=0; while(tt>P[k][1]){ tt-=P[k][1]; k++; }
    const prev=P[(k-1+P.length)%P.length][2], f=tt/P[k][1], s=prev+(P[k][2]-prev)*(0.5-0.5*Math.cos(Math.PI*f));
    $("#ball").style.transform=`scale(${s.toFixed(3)})`;
    const sec=Math.ceil(P[k][1]-tt); if(k!==lastPh){ lastPh=k; beep(k===0?660:520,.1,.1); }
    if(sec!==lastSec){ lastSec=sec; $("#ballLbl").innerHTML=PH[P[k][0]]+"<br>"+sec; }
