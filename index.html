<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14322f">
<meta name="mobile-web-app-capable" content="yes">
<title>VoiceCoach – Speech, Voice &amp; Communication Trainer</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d2421;--muted:#5f6b66;--line:#ded8cb;--accent:#1f6f63;--accent2:#c8643b;--soft:#e4efe9;--warn:#b3412e;--ok:#2f8a4d;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#17211e;--ink:#e8eee9;--muted:#9aa9a3;--line:#2a3833;--accent:#5cc2ad;--accent2:#e88a5f;--soft:#1d2e29;--warn:#ee7a65;--ok:#6bcf8a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{font-size:1.15rem;margin:0;flex:1}
header .badge{font-size:.78rem;color:var(--muted)}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 10px;font-size:.8rem}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--muted);padding:8px 1px 9px;font-size:.66rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:700}
section.view{display:none} section.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card.flat{background:var(--soft);border:0}
.card h2{font-size:1.05rem;margin:0 0 6px} .card h3{font-size:.95rem;margin:12px 0 6px}
p{margin:6px 0} .muted{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .grow{flex:1}
button.b{border:0;border-radius:12px;padding:11px 14px;font-size:.95rem;font-weight:600;background:var(--accent);color:#fff;min-height:46px}
button.b.alt{background:var(--soft);color:var(--ink)} button.b.warm{background:var(--accent2)}
button.b.sm{padding:7px 11px;min-height:36px;font-size:.84rem} button.b:disabled{opacity:.4}
button.b.full{width:100%;text-align:left;margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-size:2.5rem;font-weight:700;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums}
.huge{font-size:2.1rem;font-weight:700;text-align:center;padding:20px 8px;min-height:100px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat div{background:var(--soft);border-radius:12px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:1.3rem} .stat span{font-size:.7rem;color:var(--muted)}
details{border-top:1px solid var(--line);padding:8px 0} details summary{cursor:pointer;font-weight:600}
dl dt{font-weight:700;margin-top:8px} dl dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.warnbox{border-left:4px solid var(--warn);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:.87rem}
.okbox{border-left:4px solid var(--ok);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:.9rem}
canvas{width:100%;display:block;border-radius:12px;background:var(--soft)}
.meter{height:20px;border-radius:10px;background:var(--soft);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ok),var(--accent2),var(--warn));width:0}
.meter u{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.5}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.breath{width:210px;height:210px;margin:10px auto;position:relative;display:flex;align-items:center;justify-content:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.breath .ball{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent),#0d4a41);transform:scale(.35);opacity:.9}
.breath .lbl{position:absolute;color:#fff;font-weight:700;text-align:center;font-size:1.05rem;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.reader{font-size:1.25rem;line-height:1.7} .reader span{padding:1px 2px;border-radius:5px}
.reader span.now{background:var(--accent2);color:#fff} .reader span.done{color:var(--muted)}
.list{margin:0;padding-left:18px} .list li{margin:3px 0}
.step{display:flex;gap:5px;margin:8px 0} .step i{flex:1;height:6px;border-radius:3px;background:var(--line)} .step i.d{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.82rem} td,th{border-bottom:1px solid var(--line);padding:5px 3px;text-align:left;vertical-align:top}
.tap{width:100%;min-height:110px;font-size:1.5rem;border-radius:20px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:.88rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.cents{position:relative;height:34px;background:var(--soft);border-radius:10px;margin:6px 0}
.cents b{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--accent2);left:50%;transform:translateX(-3px)}
.cents::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--ok)}
.cents .z{position:absolute;left:40%;right:40%;top:0;bottom:0;background:rgba(47,138,77,.18)}
.bubble{border-radius:16px;padding:12px 14px;margin:8px 0;font-size:1.05rem;line-height:1.4}
.bubble.them{background:var(--soft);border-top-left-radius:4px;margin-right:24px}
.bubble.me{background:var(--accent);color:#fff;border-top-right-radius:4px;margin-left:24px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin-right:4px;vertical-align:middle}
.tag.ok{background:var(--ok);color:#fff} .tag.due{background:var(--accent2);color:#fff} .tag.lock{opacity:.5}
.kp{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:99px;border:1px dashed var(--accent);font-size:.88rem}
.kp.hit{background:var(--ok);border:1px solid var(--ok);color:#fff} .kp.miss{border-color:var(--warn);color:var(--warn)}
.sc{display:grid;grid-template-columns:110px 1fr 40px;gap:6px;align-items:center;font-size:.85rem;margin:3px 0}
.scorebig{font-size:2.6rem;font-weight:800;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:720px;margin:0;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.rate-row{margin:8px 0} .rate-row .chips{margin:3px 0}
</style>
</head>
<body>
<header>
  <h1>VoiceCoach</h1>
  <span class="badge" id="streakBadge"></span>
  <button class="pill" id="setBtn">⚙ <span id="setSummary"></span></button>
</header>

<div class="sheet hidden" id="settings"><div class="card">
  <h2 data-t="set_title"></h2>
  <h3 data-t="set_ui"></h3><div class="chips" id="setUi"></div>
  <h3 data-t="set_train"></h3><div class="chips" id="setTl"></div>
  <h3 data-t="set_ctx"></h3><div class="chips" id="setCtx"></div>
  <h3><span data-t="set_rate"></span>: <span id="rateVal"></span></h3>
  <input type="range" id="setRate" min="0.6" max="1.3" step="0.05">
  <div class="row" style="margin-top:12px"><span class="grow"></span><button class="b" id="setClose" data-t="set_close"></button></div>
</div></div>

<main>
<!-- TODAY -->
<section class="view on" id="v-today">
  <div class="card"><h2 data-t="due_title"></h2><div id="dueList"></div></div>
  <div class="card"><h2 data-t="next_title"></h2><div id="nextBox"></div></div>
  <div class="card">
    <h2 data-t="week_title"></h2>
    <div class="stat">
      <div><b id="stSessions">0</b><span data-t="st_sessions"></span></div>
      <div><b id="stMinutes">0</b><span data-t="st_minutes"></span></div>
      <div><b id="stStreak">0</b><span data-t="st_streak"></span></div>
      <div><b id="stDue">0</b><span data-t="st_due"></span></div>
    </div>
    <p class="muted" data-t="week_note"></p>
  </div>
  <div class="card"><h2 data-t="routines_title"></h2><p class="muted" data-t="routines_desc"></p><div id="routineList"></div></div>
  <div class="card hidden" id="routinePlayer">
    <div class="row"><b class="grow" id="rpTitle"></b><button class="b sm alt" id="rpClose" data-t="close"></button></div>
    <div class="step" id="rpSteps"></div>
    <h2 id="rpStepTitle" style="margin-top:8px"></h2>
    <p id="rpStepText"></p><p class="muted" id="rpStepWhy"></p>
    <div class="big" id="rpTime">0:00</div>
    <div class="row"><button class="b alt grow" id="rpPrev" data-t="back"></button><button class="b grow" id="rpPlay" data-t="startb"></button><button class="b alt grow" id="rpNext" data-t="next"></button></div>
  </div>
  <div class="card"><h2 data-t="howto_title"></h2><div data-t="howto_html"></div><div class="warnbox" data-t="warn_html" style="margin-top:10px"></div></div>
  <div class="card"><details><summary data-t="gloss_title"></summary><dl id="glossary"></dl></details></div>
</section>

<!-- TALK -->
<section class="view" id="v-talk">
  <div id="convList">
    <div class="card">
      <h2 data-t="talk_title"></h2>
      <p class="muted" data-t="talk_desc"></p>
      <div class="chips" id="talkCtx"></div>
      <div class="chips" id="talkTl"></div>
      <details><summary data-t="grading_title"></summary><div data-t="grading_html" class="muted"></div></details>
    </div>
    <div id="sceneList"></div>
    <div class="card">
      <h2 data-t="imp_title"></h2><p class="muted" data-t="imp_desc"></p>
      <div class="huge" id="topicBox" style="font-size:1.3rem"></div>
      <div class="chips" id="topicDur"></div>
      <div class="big" id="topicTime">1:00</div>
      <div class="row"><button class="b alt grow" id="topicNew" data-t="imp_new"></button><button class="b grow" id="topicStart" data-t="startb"></button></div>
    </div>
    <div class="card">
      <h2 data-t="filler_title"></h2><p class="muted" data-t="filler_desc"></p>
      <button class="b warm tap" id="fillTap"></button>
      <div class="row" style="margin-top:8px"><span class="grow"><span data-t="time"></span>: <b id="fillTime">0:00</b> · <b id="fillRate">–</b> <span data-t="per_min"></span></span>
        <button class="b alt sm" id="fillStart" data-t="start_timer"></button><button class="b alt sm" id="fillSave" data-t="save"></button></div>
    </div>
  </div>

  <div id="convPlayer" class="hidden">
    <div class="card">
      <div class="row"><b class="grow" id="cpTitle"></b><button class="b sm alt" id="cpClose" data-t="close"></button></div>
      <div class="muted" id="cpLevel"></div>
      <div class="step" id="cpSteps"></div>
      <div id="cpBody"></div>
    </div>
  </div>
</section>

<!-- SPEECH -->
<section class="view" id="v-speech">
  <div class="card">
    <div class="row"><h2 class="grow" style="margin:0" data-t="art_title"></h2><div class="chips" id="speechTl"></div></div>
    <p class="muted" data-t="art_desc"></p>
    <div class="chips" id="soundChips"></div>
    <div class="chips" id="posChips"></div>
    <p class="muted" id="soundTip"></p>
    <div class="card flat">
      <div class="huge" id="drillWord">–</div>
      <p class="muted" id="drillHeard" style="text-align:center;min-height:1.2em"></p>
      <div class="row">
        <button class="b alt" id="drillPrev">◀</button>
        <button class="b grow" id="drillCheck" data-t="art_check"></button>
        <button class="b alt" id="drillOk" style="background:var(--ok);color:#fff">✓</button>
        <button class="b alt" id="drillBad" style="background:var(--warn);color:#fff">✗</button>
        <button class="b alt" id="drillNext">▶</button>
      </div>
      <div class="bar" style="margin-top:10px"><i id="artBar" style="width:0"></i></div>
      <p class="muted" id="artMastery"></p>
      <p class="muted" id="drillCount"></p>
    </div>
  </div>
  <div class="card">
    <h2 data-t="pairs_title"></h2><p class="muted" data-t="pairs_desc"></p>
    <div class="huge" id="pairBox">–</div>
    <div class="row"><button class="b grow" id="pairNext" data-t="pairs_new"></button><button class="b alt grow" id="pairPick" data-t="pairs_pick"></button></div>
    <p class="muted" id="pairPicked"></p>
  </div>
  <div class="card">
    <h2 data-t="tw_title"></h2><p class="muted" data-t="tw_desc"></p>
    <select id="twSelect" style="width:100%"></select>
    <div class="reader card" id="twReader" style="margin-top:10px"></div>
    <label class="muted"><span data-t="speed"></span>: <span id="twWpmVal">60</span> WPM</label>
    <input type="range" id="twWpm" min="30" max="200" step="5" value="60">
    <div class="row"><label class="muted grow"><input type="checkbox" id="twClick"> <span data-t="metronome"></span></label><button class="b" id="twStart" data-t="startb"></button></div>
  </div>
  <div class="card">
    <h2 data-t="read_title"></h2><p class="muted" data-t="read_desc"></p>
    <select id="paceSelect" style="width:100%"></select>
    <div class="reader card" id="paceReader" style="margin-top:10px"></div>
    <label class="muted"><span data-t="speed"></span>: <span id="paceWpmVal">130</span> WPM</label>
    <input type="range" id="paceWpm" min="60" max="200" step="5" value="130">
    <div class="row"><span class="grow"></span><button class="b" id="paceStart" data-t="startb"></button></div>
  </div>
</section>

<!-- VOICE -->
<section class="view" id="v-voice">
  <div class="card"><h2 data-t="mic_title"></h2><p class="muted" data-t="mic_desc"></p>
    <button class="b" style="width:100%" id="micBtn" data-t="mic_on"></button>
    <div class="warnbox hidden" id="micErr" style="margin-top:8px"></div></div>
  <div class="card"><h2 data-t="pitch_title"></h2><p class="muted" data-t="pitch_desc"></p>
    <div class="row"><div class="big grow" id="pitchHz">– Hz</div><div class="big grow" id="pitchNote">–</div></div>
    <canvas id="pitchCanvas" height="170"></canvas><p class="muted" id="pitchStats"></p></div>
  <div class="card"><h2 data-t="match_title"></h2><p class="muted" data-t="match_desc"></p>
    <div class="row"><select id="targetNote" class="grow"></select><button class="b alt" id="playTarget" data-t="play"></button></div>
    <div class="cents"><div class="z"></div><b id="centsMark"></b></div>
    <div class="row muted"><span class="grow" data-t="too_low"></span><span id="centsTxt">–</span><span class="grow" style="text-align:right" data-t="too_high"></span></div>
    <p class="muted"><span data-t="hold"></span>: <b id="holdTime">0.0 s</b> (<span data-t="best_lbl"></span> <b id="holdBest">0.0 s</b>)</p></div>
  <div class="card"><h2 data-t="loud_title"></h2><p class="muted" data-t="loud_desc"></p>
    <div class="meter"><i id="levelBar"></i><u id="levelThr"></u></div>
    <div class="row" style="margin-top:6px"><span class="grow"><span data-t="level"></span>: <b id="levelDb">–</b></span><span><span data-t="steady"></span>: <b id="steady">–</b></span></div>
    <label class="muted"><span data-t="threshold"></span>: <span id="thrVal">-45</span> dBFS</label>
    <input type="range" id="thr" min="-70" max="-15" value="-45">
    <div class="big" id="sustainTime">0.0 s</div>
    <p class="muted"><span data-t="best_sustain"></span>: <b id="sustainBest">0.0 s</b> <button class="b alt sm" id="sustainSave" data-t="save_mpt"></button></p>
    <p class="muted" data-t="steady_note"></p></div>
  <div class="card"><h2 data-t="rec_title"></h2><p class="muted" data-t="rec_desc"></p>
    <div class="row"><button class="b warm grow" id="recBtn" data-t="rec_btn"></button><span class="big" id="recTime" style="font-size:1.4rem">0:00</span></div>
    <p class="muted"><span data-t="rec_sentence"></span> <i id="recSentence"></i></p><div id="takes"></div></div>
</section>

<!-- BREATH -->
<section class="view" id="v-breath">
  <div class="card"><h2 data-t="br_title"></h2><p class="muted" data-t="br_desc"></p>
    <div class="chips" id="breathPresets"></div><p class="muted" id="breathDesc"></p>
    <div class="breath"><div class="ring"></div><div class="ball" id="ball"></div><div class="lbl" id="ballLbl"></div></div>
    <div class="row"><span class="muted grow"><span data-t="rounds"></span>: <b id="brRound">0</b> / <select id="brRounds"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></span>
      <button class="b" id="brStart" data-t="startb"></button></div></div>
  <div class="card"><h2 data-t="mpt_title"></h2><p data-t="mpt_what"></p><p class="muted" data-t="mpt_how"></p>
    <div class="big" id="mptTime">0.0 s</div>
    <div class="row"><button class="b grow" id="mptBtn" data-t="startb"></button><button class="b alt" id="mptSave" data-t="save_best"></button></div>
    <p class="muted" id="mptTries"></p></div>
  <div class="card"><h2 data-t="sz_title"></h2><p data-t="sz_what"></p><p class="muted" data-t="sz_how"></p>
    <div class="big" id="szTime">0.0 s</div>
    <div class="row"><button class="b grow" id="sBtn"></button><button class="b warm grow" id="zBtn"></button></div>
    <p id="szResult" class="muted"></p>
    <div class="row"><button class="b alt sm" id="szSave" data-t="sz_save"></button><button class="b alt sm" id="szReset" data-t="sz_reset"></button></div></div>
</section>

<!-- PROGRESS -->
<section class="view" id="v-progress">
  <div class="card"><h2 id="prMastTitle"></h2><div id="prMastery"></div><p class="muted" data-t="pr_mastery_note"></p><div id="prLangTable"></div></div>
  <div class="card"><h2 data-t="pr_scores"></h2><canvas id="scoreChart" height="170"></canvas><p class="muted" data-t="pr_scores_note"></p></div>
  <div class="card"><h2 id="prArtTitle"></h2><div id="prArt"></div></div>
  <div class="card"><h2 data-t="pr_meas"></h2><canvas id="measChart" height="150"></canvas><p class="muted" data-t="pr_meas_note"></p></div>
  <div class="card"><h2 data-t="pr_hist"></h2><div id="logTable"></div>
    <div class="row" style="margin-top:10px"><button class="b alt sm" id="logCopy" data-t="copy"></button><button class="b alt sm" id="logClear" data-t="clear"></button></div>
    <div class="warnbox hidden" id="confirmClear" style="margin-top:10px"><p data-t="clear_q"></p>
      <div class="row"><button class="b alt grow" id="ccNo" data-t="cancel"></button><button class="b grow" style="background:var(--warn)" id="ccYes" data-t="del"></button></div></div>
    <p class="muted" id="storeNote"></p></div>
</section>
</main>

<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<script>
/* UI strings – en / de / fr */
const T = {
en:{
 nav_today:"Today", nav_talk:"Talk", nav_speech:"Speech", nav_voice:"Voice", nav_breath:"Breath", nav_progress:"Progress",
 set_title:"Settings", set_ui:"App language", set_train:"Training language", set_ctx:"Training setting", set_rate:"Partner voice speed", set_close:"Done",
 ctx_pro:"Professional", ctx_cas:"Casual", ctx_aca:"Academic",
 due_title:"Due for review", due_none:"Nothing is due. When you master a conversation, it comes back here for review after 1, 3, 7, 14, 30 and 60 days – this spacing makes the skill stick (called <i>spaced repetition</i>).",
 next_title:"Continue training", next_none:"All conversations in this setting are mastered. Switch the setting or language in ⚙ Settings.",
 routines_title:"Warm-up routines", routines_desc:"Guided steps with a timer. A short beep marks each change of step. Total time in brackets.",
 week_title:"Your week", st_sessions:"sessions (7 days)", st_minutes:"minutes (7 days)", st_streak:"day streak", st_due:"reviews due",
 week_note:"A session is logged when you finish a routine, conversation or exercise. Streak = consecutive days with at least one session.",
 howto_title:"How to use this app",
 howto_html:"<ul class='list'><li><b>Talk</b> – graded conversations for professional, casual and academic situations, in English, German and French. You pass three levels per scene and repeat until you reach the required score.</li><li><b>Speech</b> – articulation drills with mastery tracking, minimal pairs, tongue twisters, reading pace.</li><li><b>Voice</b> – live pitch, loudness, steady-tone timer and recorder (microphone).</li><li><b>Breath</b> – paced breathing, maximum phonation time and s/z ratio.</li><li><b>Progress</b> – scores, mastery and measurements over time.</li></ul><p class='muted'>Change app language, training language and setting with ⚙ (top right).</p>",
 warn_html:"<b>Important:</b> this app is a practice companion, not a diagnosis or a replacement for a speech-language therapist (Logopäde/Logopädin, orthophoniste). Stop an exercise if it hurts or causes hoarseness, dizziness or throat tension. See an ENT doctor (ear, nose and throat specialist) if hoarseness lasts longer than 2–3 weeks.",

 talk_title:"Conversations", talk_desc:"The partner speaks a line (tap 🔊 to hear it again). You answer aloud. The app scores each answer from 0 to 100.",
 grading_title:"How grading and levels work",
 grading_html:"<p><b>Score per answer (0–100)</b> = Content 50 % + Completeness 20 % + Pace 15 % + Fluency 15 %.</p><ul class='list'><li><b>Content</b> – share of the key points you mentioned (the app looks for key words in what it heard). In level 1 it also counts how closely you followed the model answer.</li><li><b>Completeness</b> – length of your answer compared with the model answer (at least 60 % of its word count = full points).</li><li><b>Pace</b> – words per minute (WPM). 110–170 WPM = full points, falling to 0 at 60 or 230 WPM.</li><li><b>Fluency</b> – minus points for each filler (uhm, äh, euh…) the recogniser writes down and for hesitating more than 4 s before speaking.</li></ul><p><b>Levels:</b> 1 Guided – model answer is shown, pass mark 70. 2 Cued – only key points shown, pass mark 75. 3 Free – only the task, pass mark 80. The scene score is the average of its answers. Below the pass mark you repeat the level. After level 3 the scene is <i>mastered</i> and returns for review (pass mark 80). A failed review sends it back to level 2.</p><p class='muted'>Automatic scoring needs speech recognition (Chrome on Android, usually with internet). Without it you rate yourself on 4 criteria (0–4 points each; total converted to 0–100).</p>",

 howto_title:"So nutzt du die App",
 howto_html:"<ul class='list'><li><b>Gespräch</b> – bewertete Dialoge für berufliche, alltägliche und akademische Situationen auf Englisch, Deutsch und Französisch. Pro Szene drei Stufen; du wiederholst, bis die nötige Punktzahl erreicht ist.</li><li><b>Aussprache</b> – Artikulationsübungen mit Lernstand, Minimalpaare, Zungenbrecher, Lesetempo.</li><li><b>Stimme</b> – Tonhöhe, Lautstärke, Haltetontimer und Aufnahme (Mikrofon).</li><li><b>Atem</b> – Atemrhythmus, maximale Phonationszeit und s/z-Quotient.</li><li><b>Fortschritt</b> – Punkte, Lernstand und Messwerte im Zeitverlauf.</li></ul><p class='muted'>App-Sprache, Trainingssprache und Bereich änderst du mit ⚙ (oben rechts).</p>",
 warn_html:"<b>Wichtig:</b> Die App ist eine Übungshilfe, keine Diagnose und kein Ersatz für eine Logopädin / einen Logopäden. Brich eine Übung ab, wenn sie schmerzt oder Heiserkeit, Schwindel oder Halsenge auslöst. Bei Heiserkeit länger als 2–3 Wochen zum HNO-Arzt (Hals-Nasen-Ohren-Arzt).",
 gloss_title:"Glossar – alle Begriffe dieser App",
 talk_title:"Gespräche", talk_desc:"Der Partner spricht einen Satz (🔊 = nochmal hören). Du antwortest laut. Die App bewertet jede Antwort mit 0 bis 100 Punkten.",
 grading_title:"So funktionieren Bewertung und Stufen",
 grading_html:"<p><b>Punkte pro Antwort (0–100)</b> = Inhalt 50 % + Vollständigkeit 20 % + Tempo 15 % + Flüssigkeit 15 %.</p><ul class='list'><li><b>Inhalt</b> – Anteil der genannten Kernpunkte (die App sucht Schlüsselwörter im Erkannten). Auf Stufe 1 zählt zusätzlich, wie genau du der Musterantwort gefolgt bist.</li><li><b>Vollständigkeit</b> – Länge deiner Antwort im Vergleich zur Musterantwort (mindestens 60 % ihrer Wortzahl = volle Punkte).</li><li><b>Tempo</b> – Wörter pro Minute (WPM). 110–170 WPM = volle Punkte, fällt bis 0 bei 60 oder 230 WPM.</li><li><b>Flüssigkeit</b> – Abzug für jedes Füllwort (äh, ähm, euh …), das die Erkennung mitschreibt, und für mehr als 4 s Zögern vor dem Sprechen.</li></ul><p><b>Stufen:</b> 1 Geführt – Musterantwort sichtbar, Bestehensgrenze 70. 2 Stichworte – nur Kernpunkte sichtbar, Grenze 75. 3 Frei – nur die Aufgabe, Grenze 80. Die Szenenpunktzahl ist der Durchschnitt der Antworten. Darunter wiederholst du die Stufe. Nach Stufe 3 ist die Szene <i>gemeistert</i> und kommt zur Wiederholung (Grenze 80). Eine nicht bestandene Wiederholung setzt sie auf Stufe 2 zurück.</p><p class='muted'>Automatische Bewertung braucht Spracherkennung (Chrome auf Android, meist mit Internet). Ohne sie bewertest du dich selbst nach 4 Kriterien (je 0–4 Punkte, umgerechnet auf 0–100).</p>",

 grading_html:"<p><b>Note par réponse (0–100)</b> = Contenu 50 % + Complétude 20 % + Débit 15 % + Fluidité 15 %.</p><ul class='list'><li><b>Contenu</b> – part des points clés mentionnés (l'appli cherche des mots clés dans ce qu'elle a entendu). Au niveau 1, elle compte aussi la fidélité à la réponse modèle.</li><li><b>Complétude</b> – longueur de votre réponse par rapport au modèle (au moins 60 % de ses mots = note maximale).</li><li><b>Débit</b> – mots par minute (WPM). 110–170 WPM = note maximale, jusqu'à 0 à 60 ou 230 WPM.</li><li><b>Fluidité</b> – points en moins pour chaque mot de remplissage (euh, ben, uhm, äh…) transcrit et pour une hésitation de plus de 4 s avant de parler.</li></ul><p><b>Niveaux :</b> 1 Guidé – réponse modèle affichée, seuil 70. 2 Indices – seuls les points clés, seuil 75. 3 Libre – seulement la consigne, seuil 80. La note de la scène est la moyenne des réponses. En dessous du seuil, vous refaites le niveau. Après le niveau 3, la scène est <i>maîtrisée</i> et revient en révision (seuil 80). Une révision échouée la renvoie au niveau 2.</p><p class='muted'>La notation automatique nécessite la reconnaissance vocale (Chrome sur Android, généralement avec internet). Sinon, vous vous évaluez sur 4 critères (0–4 points chacun, convertis en 0–100).</p>",

{id:"interview", ctx:"pro", title:{en:"Job interview", de:"Vorstellungsgespräch", fr:"Entretien d'embauche"}, turns:{
 en:[
  ["Good morning, thank you for coming. Could you briefly introduce yourself?","Introduce yourself: name, current role, years of experience.","Good morning, thank you for inviting me. My name is Alex Meyer. I work as a project engineer and have about eight years of experience in planning and leading technical projects.","my name|i am|i m|name; work as|engineer|manager|role|position|job; years|experience"],
  ["Why are you interested in this position?","Give two clear reasons why you want this job.","I am interested in this position for two reasons. First, your company works on sustainable infrastructure, which matches my values. Second, the role would let me lead larger teams and grow professionally.","reason|because; first|firstly|one reason; second|secondly|also; company|team|role|position"],
  ["Tell me about a difficult situation at work and how you handled it.","Describe a challenge: situation – your action – the result.","Last year a key supplier delivered late, which put our deadline at risk. I organised a meeting with the supplier, re-planned the schedule and moved two tasks forward. As a result, we delivered only two days late and the client was satisfied.","problem|challenge|difficult|late|risk|situation; organi|decided|talked|spoke|planned|solved|handled; result|in the end|finally|outcome|satisfied"],
  ["Do you have any questions for us?","Ask one thoughtful question and thank the interviewer.","Yes, thank you. Could you tell me how success is measured in this role during the first six months? And thank you very much for your time today.","could you|can you|what|how|would; thank"]],
 de:[
  ["Guten Morgen, schön, dass Sie da sind. Stellen Sie sich bitte kurz vor.","Stellen Sie sich vor: Name, aktuelle Position, Jahre Berufserfahrung.","Guten Morgen, vielen Dank für die Einladung. Mein Name ist Alex Meyer. Ich arbeite als Projektingenieur und habe etwa acht Jahre Erfahrung in der Planung und Leitung technischer Projekte.","mein name|ich bin|heiße; arbeite|ingenieur|position|stelle|leiter; jahre|erfahrung"],
  ["Warum interessieren Sie sich für diese Stelle?","Nennen Sie zwei klare Gründe.","Mich interessiert die Stelle aus zwei Gründen. Erstens arbeitet Ihr Unternehmen an nachhaltiger Infrastruktur, das passt zu meinen Werten. Zweitens könnte ich größere Teams leiten und mich beruflich weiterentwickeln.","gründe|grund|weil|denn; erstens|zuerst|zum einen; zweitens|außerdem|zum anderen; unternehmen|firma|team|stelle"],
  ["Erzählen Sie von einer schwierigen Situation bei der Arbeit und wie Sie sie gelöst haben.","Situation – Ihre Handlung – Ergebnis.","Letztes Jahr hat ein wichtiger Lieferant zu spät geliefert, und unser Termin war in Gefahr. Ich habe ein Treffen mit dem Lieferanten organisiert, den Zeitplan neu geplant und zwei Aufgaben vorgezogen. Im Ergebnis waren wir nur zwei Tage später fertig, und der Kunde war zufrieden.","problem|schwierig|spät|gefahr|situation; organisiert|geplant|gesprochen|entschieden|gelöst; ergebnis|am ende|schließlich|zufrieden"],
  ["Haben Sie noch Fragen an uns?","Stellen Sie eine durchdachte Frage und bedanken Sie sich.","Ja, danke. Wie wird Erfolg in dieser Position in den ersten sechs Monaten gemessen? Und vielen Dank für Ihre Zeit heute.","wie |was |können sie|könnten sie|welche; dank"]],
 fr:[
  ["Bonjour, merci d'être venu. Pouvez-vous vous présenter brièvement ?","Présentez-vous : nom, poste actuel, années d'expérience.","Bonjour, merci pour l'invitation. Je m'appelle Alex Meyer. Je travaille comme ingénieur de projet et j'ai environ huit ans d'expérience dans la planification et la gestion de projets techniques.","je m appelle|je suis|nom; travaille|ingénieur|poste|responsable; ans |expérience"],
  ["Pourquoi ce poste vous intéresse-t-il ?","Donnez deux raisons claires.","Ce poste m'intéresse pour deux raisons. D'abord, votre entreprise travaille sur des infrastructures durables, ce qui correspond à mes valeurs. Ensuite, ce rôle me permettrait de diriger des équipes plus grandes et d'évoluer professionnellement.","raisons|parce qu|car ; d abord|premièrement|premier; ensuite|deuxièmement|aussi; entreprise|société|équipe|poste"],
  ["Parlez-moi d'une situation difficile au travail et de la façon dont vous l'avez gérée.","Situation – votre action – le résultat.","L'année dernière, un fournisseur important a livré en retard et notre échéance était en danger. J'ai organisé une réunion avec le fournisseur, replanifié le calendrier et avancé deux tâches. Résultat : nous avons livré avec seulement deux jours de retard et le client était satisfait.","problème|difficile|retard|danger|situation; organisé|planifié|parlé|décidé|résolu|géré; résultat|finalement|au final|satisfait"],
  ["Avez-vous des questions pour nous ?","Posez une question réfléchie et remerciez.","Oui, merci. Comment mesurez-vous la réussite dans ce poste pendant les six premiers mois ? Et merci beaucoup pour votre temps aujourd'hui.","comment|quel|pourriez|est ce que|pouvez; merci"]]
}},
{id:"meeting", ctx:"pro", title:{en:"Team meeting: status update", de:"Teambesprechung: Statusbericht", fr:"Réunion d'équipe : point d'avancement"}, turns:{
 en:[
  ["Let's start with your update. Where does your part of the project stand?","Give a short status: what is done, what is in progress.","Thanks. The design phase is finished, and we are now testing the first prototype. About seventy percent of the tests are complete.","finished|done|completed|complete; now|currently|in progress|testing|working on; percent|half|most"],
  ["Are there any risks or problems we should know about?","Name one risk and its possible impact.","Yes, there is one risk. A component is delayed by two weeks. If it does not arrive in time, the final test could move to next month.","risk|problem|issue|delay; if |could|might|impact; week|month|days"],
  ["What do you need from the team?","Make a clear, polite request.","I would like to ask for support from one colleague for the testing next week. Could someone from the quality team help us for two days?","would like|could|can |need|ask; help|support; week|days"],
  ["Good. Can you summarise the next steps?","Summarise the next steps with who and when.","Sure. First, I will finish the remaining tests by Friday. Second, the quality team supports us next week. Finally, I will send the report to everyone on the twentieth.","first|next|then; will |going to; friday|monday|week|by ; report|send|email"]],
 de:[
  ["Fangen wir mit Ihrem Update an. Wie ist der Stand bei Ihrem Projektteil?","Kurzer Stand: was ist erledigt, was läuft gerade.","Danke. Die Entwurfsphase ist abgeschlossen, und wir testen gerade den ersten Prototyp. Etwa siebzig Prozent der Tests sind erledigt.","abgeschlossen|fertig|erledigt; gerade|aktuell|momentan|zurzeit|testen; prozent|hälfte|meisten"],
  ["Gibt es Risiken oder Probleme, die wir kennen sollten?","Nennen Sie ein Risiko und seine mögliche Folge.","Ja, es gibt ein Risiko. Ein Bauteil verspätet sich um zwei Wochen. Wenn es nicht rechtzeitig kommt, könnte sich der Abschlusstest auf nächsten Monat verschieben.","risiko|problem|verspät|verzöger; wenn|könnte|falls; woche|monat|tage"],
  ["Was brauchen Sie vom Team?","Formulieren Sie eine klare, höfliche Bitte.","Ich möchte um Unterstützung durch eine Kollegin oder einen Kollegen für die Tests nächste Woche bitten. Könnte uns jemand aus dem Qualitätsteam zwei Tage helfen?","möchte|könnte|bitte|brauche; unterstütz|helfen|hilfe; woche|tage"],
  ["Gut. Können Sie die nächsten Schritte zusammenfassen?","Fassen Sie die nächsten Schritte zusammen: wer und wann.","Gerne. Erstens schließe ich die restlichen Tests bis Freitag ab. Zweitens unterstützt uns das Qualitätsteam nächste Woche. Zum Schluss schicke ich allen am Zwanzigsten den Bericht.","erstens|zuerst|dann; freitag|montag|woche|bis ; bericht|schicke|sende|mail"]],
 fr:[
  ["Commençons par votre point. Où en est votre partie du projet ?","Bref état : ce qui est fait, ce qui est en cours.","Merci. La phase de conception est terminée et nous testons actuellement le premier prototype. Environ soixante-dix pour cent des tests sont faits.","terminé|fini|fait |achevé; actuellement|en ce moment|maintenant|en cours|testons; pour cent|moitié|plupart"],
  ["Y a-t-il des risques ou des problèmes à connaître ?","Citez un risque et son impact possible.","Oui, il y a un risque. Un composant a deux semaines de retard. S'il n'arrive pas à temps, le test final pourrait être repoussé au mois prochain.","risque|problème|retard; si |s il|pourrait; semaine|mois|jours"],
  ["De quoi avez-vous besoin de la part de l'équipe ?","Formulez une demande claire et polie.","J'aimerais demander le soutien d'un collègue pour les tests la semaine prochaine. Est-ce que quelqu'un de l'équipe qualité pourrait nous aider pendant deux jours ?","aimerais|pourrait|besoin|demander|voudrais; aider|aide |soutien; semaine|jours"],
  ["Bien. Pouvez-vous résumer les prochaines étapes ?","Résumez les prochaines étapes : qui et quand.","Bien sûr. D'abord, je termine les derniers tests d'ici vendredi. Ensuite, l'équipe qualité nous aide la semaine prochaine. Enfin, j'envoie le rapport à tout le monde le vingt.","d abord|premièrement|ensuite|enfin; vendredi|lundi|semaine|d ici; rapport|envoie|mail"]]

{id:"neighbour", ctx:"cas", title:{en:"Meeting a new neighbour", de:"Neue Nachbarn kennenlernen", fr:"Rencontrer un nouveau voisin"}, turns:{
 en:[
  ["Hi! I think you just moved in next door. I'm Sam.","Greet, introduce yourself, say something friendly.","Hi Sam, nice to meet you! I'm Alex. Yes, we moved in last week. It's a lovely street.","hi |hello|nice to meet; i m|i am|my name; moved|week|new"],
  ["Welcome! Where did you live before?","Say where you lived and add one detail.","Thank you! Before, we lived in Cologne for five years. It was nice, but here we have more space and a garden.","before|lived|used to; years|city|town; but |and |because"],
  ["Oh nice. Do you have any plans for the weekend?","Talk about your plans and ask a question back.","We still have many boxes to unpack, but on Sunday we want to explore the park. What would you recommend around here?","weekend|saturday|sunday|plan|want; what |where|do you|would you|any "],
  ["The bakery on the corner is great. Well, I have to go now.","Thank them and close the conversation politely.","Thanks for the tip, I'll try it tomorrow. It was really nice to meet you. See you soon!","thank; nice|great|pleasure; see you|bye|soon|later"]],
 de:[
  ["Hallo! Ich glaube, Sie sind gerade nebenan eingezogen. Ich bin Sam.","Begrüßen, sich vorstellen, etwas Freundliches sagen.","Hallo Sam, freut mich! Ich bin Alex. Ja, wir sind letzte Woche eingezogen. Eine sehr schöne Straße.","hallo|guten tag|freut mich; ich bin|heiße|mein name; eingezogen|woche|neu "],
  ["Willkommen! Wo haben Sie vorher gewohnt?","Sagen Sie, wo Sie gewohnt haben, mit einem Detail.","Danke! Vorher haben wir fünf Jahre in Köln gewohnt. Das war schön, aber hier haben wir mehr Platz und einen Garten.","vorher|gewohnt|früher; jahre|stadt|köln; aber |und |weil"],
  ["Schön. Haben Sie schon Pläne fürs Wochenende?","Erzählen Sie von Ihren Plänen und stellen Sie eine Gegenfrage.","Wir haben noch viele Kisten auszupacken, aber am Sonntag möchten wir den Park erkunden. Was würden Sie hier in der Nähe empfehlen?","wochenende|samstag|sonntag|pläne|möchten|wollen; was |wo |haben sie|würden sie|können sie|empfehlen"],
  ["Die Bäckerei an der Ecke ist super. So, ich muss jetzt leider los.","Bedanken Sie sich und beenden Sie das Gespräch höflich.","Danke für den Tipp, das probiere ich morgen aus. Schön, Sie kennenzulernen. Bis bald!","dank; schön|freut|nett; bis bald|tschüss|wiedersehen|bis dann"]],
 fr:[
  ["Bonjour ! Je crois que vous venez d'emménager à côté. Moi, c'est Sam.","Saluez, présentez-vous, dites quelque chose d'aimable.","Bonjour Sam, enchanté ! Moi, c'est Alex. Oui, nous avons emménagé la semaine dernière. C'est une très jolie rue.","bonjour|salut|enchanté; moi c est|je m appelle|je suis; emménagé|semaine|nouveau"],
  ["Bienvenue ! Où habitiez-vous avant ?","Dites où vous habitiez, avec un détail.","Merci ! Avant, nous avons habité cinq ans à Lyon. C'était bien, mais ici nous avons plus d'espace et un jardin.","avant|habité|habitions; ans |ville|lyon; mais |et |parce qu"],
  ["Super. Vous avez des projets pour le week-end ?","Parlez de vos projets et posez une question en retour.","Nous avons encore beaucoup de cartons à défaire, mais dimanche nous voulons découvrir le parc. Qu'est-ce que vous recommandez dans le quartier ?","week end|samedi|dimanche|projet|voulons|aimerions; qu est ce|recommand|conseill|vous avez|quel"],
  ["La boulangerie au coin est excellente. Bon, je dois y aller.","Remerciez et terminez poliment la conversation.","Merci pour le conseil, je vais l'essayer demain. Ravi de vous avoir rencontré. À bientôt !","merci; ravi|enchanté|plaisir; à bientôt|au revoir|à plus|bonne journée"]]
}},
{id:"cafe", ctx:"cas", title:{en:"At the café", de:"Im Café", fr:"Au café"}, turns:{
 en:[
  ["Hello, what can I get you?","Order a drink and something to eat, politely.","Hello! I'd like a large cappuccino and a piece of apple cake, please.","i d like|i would like|can i have|could i have|i ll have; please; coffee|cappuccino|tea |cake|sandwich|water|juice"],
  ["To drink here or take away?","Answer and ask one question about the menu.","To drink here, please. Do you also have oat milk?","here|take away|to go; do you|is there|have you got"],
  ["Sorry, we've run out of oat milk. We have soy or almond milk.","React calmly to the problem and choose an alternative.","No problem. Then I'll take almond milk, thank you.","no problem|that s fine|okay|ok |never mind; almond|soy |then; thank"],
  ["That's eight euros fifty. Card or cash?","Pay and say something friendly.","By card, please. Here you go. Thank you, have a nice day!","card|cash; here you go|here you are; nice day|thank|good day"]],
 de:[
  ["Hallo, was darf es sein?","Bestellen Sie höflich ein Getränk und etwas zu essen.","Hallo! Ich hätte gern einen großen Cappuccino und ein Stück Apfelkuchen, bitte.","hätte gern|möchte|nehme|hätte gerne; bitte; kaffee|cappuccino|tee |kuchen|wasser|saft|brötchen"],
  ["Zum Hiertrinken oder zum Mitnehmen?","Antworten Sie und stellen Sie eine Frage zur Karte.","Zum Hiertrinken, bitte. Haben Sie auch Hafermilch?","hier|mitnehmen; haben sie|gibt es"],
  ["Tut mir leid, die Hafermilch ist aus. Wir haben Soja- oder Mandelmilch.","Reagieren Sie gelassen und wählen Sie eine Alternative.","Kein Problem. Dann nehme ich Mandelmilch, danke.","kein problem|macht nichts|in ordnung|okay; mandel|soja|dann ; dank"],
  ["Das macht acht Euro fünfzig. Mit Karte oder bar?","Bezahlen Sie und sagen Sie etwas Freundliches.","Mit Karte, bitte. Bitte schön. Danke und einen schönen Tag noch!","karte|bar ; bitte schön|bitte sehr|hier ; schönen tag|danke"]],
 fr:[
  ["Bonjour, qu'est-ce que je vous sers ?","Commandez poliment une boisson et quelque chose à manger.","Bonjour ! Je voudrais un grand cappuccino et une part de tarte aux pommes, s'il vous plaît.","je voudrais|je vais prendre|j aimerais|je prends; s il vous plaît|s il te plaît; café|cappuccino|thé |tarte|gâteau|eau |jus |croissant"],
  ["Sur place ou à emporter ?","Répondez et posez une question sur la carte.","Sur place, s'il vous plaît. Vous avez aussi du lait d'avoine ?","sur place|emporter; vous avez|avez vous|est ce que"],
  ["Désolé, nous n'avons plus de lait d'avoine. Nous avons du lait de soja ou d'amande.","Réagissez calmement et choisissez une alternative.","Pas de problème. Alors je prends du lait d'amande, merci.","pas de problème|pas grave|d accord|ce n est pas grave; amande|soja|alors; merci"],
  ["Ça fait huit euros cinquante. Carte ou espèces ?","Payez et dites quelque chose d'aimable.","Par carte, s'il vous plaît. Voilà. Merci, bonne journée !","carte|espèces|liquide; voilà|tenez; bonne journée|merci"]]
}},

{id:"qa", ctx:"aca", title:{en:"Questions after a presentation", de:"Fragen nach einem Vortrag", fr:"Questions après un exposé"}, turns:{
 en:[
  ["Thank you for your presentation. Could you summarise your main finding in one or two sentences?","State your main result clearly and briefly.","Certainly. Our main finding is that gravel filters remove about eighty percent of suspended solids at low cost. This makes them suitable for rural schools.","main finding|main result|we found|our result|show; percent|significant|most; this means|suitable|therefore|so "],
  ["How did you collect your data?","Describe your method: what, how many, how long.","We took water samples twice a week over six months at three different sites. In total we analysed one hundred and twenty samples in the laboratory.","samples|data|measure|survey|interview; week|month|year; in total|in all|analysed|analyzed|collected"],
  ["Isn't your sample too small to generalise?","Acknowledge the limitation, then defend your result calmly.","That is a fair point. The sample is limited, so we cannot generalise to all regions. However, the results were consistent across all three sites, and we plan a larger study next year.","fair point|good point|you are right|agree|limitation|limited; however|but |nevertheless; plan|future|next |further"],
  ["What would you recommend for practice?","Give a recommendation with a reason.","I would recommend that schools combine gravel filters with regular maintenance, because performance drops quickly when filters are not cleaned.","recommend|suggest|should|advise; because|since|as ; maintenance|clean|regular|train"]],
 de:[
  ["Vielen Dank für Ihren Vortrag. Können Sie Ihr Hauptergebnis in ein, zwei Sätzen zusammenfassen?","Nennen Sie Ihr Hauptergebnis klar und knapp.","Gerne. Unser Hauptergebnis ist, dass Kiesfilter etwa achtzig Prozent der Schwebstoffe kostengünstig entfernen. Damit eignen sie sich gut für Schulen auf dem Land.","ergebnis|gezeigt|zeigt; prozent|deutlich|signifikant|meisten; damit|deshalb|daher|eignen"],
  ["Wie haben Sie Ihre Daten erhoben?","Beschreiben Sie die Methode: was, wie viele, wie lange.","Wir haben sechs Monate lang zweimal pro Woche Wasserproben an drei Standorten genommen. Insgesamt haben wir hundertzwanzig Proben im Labor analysiert.","proben|daten|gemessen|umfrage|interview; woche|monat|jahr; insgesamt|analysiert|erhoben"],
  ["Ist Ihre Stichprobe nicht zu klein, um zu verallgemeinern?","Erkennen Sie die Grenze an und verteidigen Sie Ihr Ergebnis sachlich.","Das ist ein berechtigter Einwand. Die Stichprobe ist begrenzt, deshalb können wir nicht auf alle Regionen schließen. Allerdings waren die Ergebnisse an allen drei Standorten einheitlich, und wir planen nächstes Jahr eine größere Studie.","berechtigt|guter punkt|recht |stimmt|begrenzt; allerdings|aber |trotzdem|jedoch; planen|zukunft|nächst|weitere"],
  ["Was würden Sie für die Praxis empfehlen?","Geben Sie eine Empfehlung mit Begründung.","Ich würde empfehlen, Kiesfilter mit regelmäßiger Wartung zu kombinieren, weil die Leistung schnell sinkt, wenn die Filter nicht gereinigt werden.","empfehle|empfehlen|sollte|rate ; weil|da |denn; wartung|reinig|regelmäßig"]],
 fr:[
  ["Merci pour votre présentation. Pourriez-vous résumer votre résultat principal en une ou deux phrases ?","Énoncez votre résultat principal clairement et brièvement.","Bien sûr. Notre résultat principal est que les filtres à gravier éliminent environ quatre-vingts pour cent des matières en suspension à faible coût. Ils conviennent donc aux écoles rurales.","résultat|montré|montre; pour cent|significati|plupart; donc|ainsi|par conséquent|conviennent"],
  ["Comment avez-vous collecté vos données ?","Décrivez la méthode : quoi, combien, combien de temps.","Nous avons prélevé des échantillons d'eau deux fois par semaine pendant six mois sur trois sites. Au total, nous avons analysé cent vingt échantillons en laboratoire.","échantillon|données|mesure|enquête|entretien; semaine|mois|an ; au total|analysé|collecté"],
  ["Votre échantillon n'est-il pas trop petit pour généraliser ?","Reconnaissez la limite, puis défendez calmement votre résultat.","C'est une remarque juste. L'échantillon est limité, donc nous ne pouvons pas généraliser à toutes les régions. Cependant, les résultats étaient cohérents sur les trois sites, et nous prévoyons une étude plus large l'année prochaine.","remarque juste|vous avez raison|bonne question|limité|d accord; cependant|mais |toutefois|néanmoins; prévoyons|futur|prochain|plus large"],
  ["Que recommanderiez-vous pour la pratique ?","Donnez une recommandation avec une raison.","Je recommanderais de combiner les filtres à gravier avec un entretien régulier, parce qu la performance baisse vite quand les filtres ne sont pas nettoyés.","recommand|conseill|devrait|suggère; parce qu|car |puisque; entretien|nettoy|régulier"]]
}},
{id:"seminar", ctx:"aca", title:{en:"Seminar discussion", de:"Seminardiskussion", fr:"Discussion en séminaire"}, turns:{
 en:[
  ["Today's question: should universities replace exams with project work? What is your view?","State your opinion clearly with one reason.","In my view, universities should use more project work, because it shows how students apply knowledge to real problems.","in my view|i think|i believe|in my opinion|from my perspective; because|since|as ; project|exam|student"],
  ["But projects are harder to grade fairly. Exams are more objective.","Disagree politely and give a counter-argument.","I see your point, but I'm not fully convinced. With clear criteria, projects can be graded fairly, and exams also have problems, for example stress and memorisation.","i see your point|i understand|that s true|fair|i agree; but |however|although; criteria|rubric|for example|such as"],
  ["Can you give an example?","Give a concrete example from your experience or reading.","For example, in my engineering course we designed a water filter in teams. The final report and prototype showed our skills much better than a written test.","for example|for instance|such as; course|class|study|research|project; better|more |showed|show"],
  ["Let's try to find a compromise. What would you propose?","Propose a compromise and summarise.","I would propose a combination: a short exam for basic knowledge and a project for application. That way we keep objectivity and still measure practical skills.","propose|suggest|combination|combine|both; exam; project; that way|so |therefore|in this way"]],
 de:[
  ["Heutige Frage: Sollten Hochschulen Prüfungen durch Projektarbeit ersetzen? Was meinen Sie?","Sagen Sie klar Ihre Meinung mit einer Begründung.","Meiner Meinung nach sollten Hochschulen mehr Projektarbeit einsetzen, weil sie zeigt, wie Studierende Wissen auf echte Probleme anwenden.","meiner meinung|ich finde|ich denke|ich glaube|aus meiner sicht; weil|da |denn; projekt|prüfung|studier"],
  ["Aber Projekte sind schwerer fair zu bewerten. Prüfungen sind objektiver.","Widersprechen Sie höflich mit einem Gegenargument.","Ich verstehe Ihren Punkt, bin aber nicht ganz überzeugt. Mit klaren Kriterien kann man Projekte fair bewerten, und auch Prüfungen haben Nachteile, zum Beispiel Stress und Auswendiglernen.","ich verstehe|das stimmt|guter punkt|verständlich; aber |allerdings|jedoch; kriterien|zum beispiel|beispielsweise"],
  ["Können Sie ein Beispiel nennen?","Geben Sie ein konkretes Beispiel aus Erfahrung oder Lektüre.","Zum Beispiel haben wir in meinem Ingenieurkurs im Team einen Wasserfilter entwickelt. Bericht und Prototyp haben unsere Fähigkeiten viel besser gezeigt als eine schriftliche Prüfung.","zum beispiel|beispielsweise; kurs|studium|seminar|projekt|forschung|im team; besser|mehr |gezeigt|zeigt"],
  ["Versuchen wir einen Kompromiss. Was schlagen Sie vor?","Schlagen Sie einen Kompromiss vor und fassen Sie zusammen.","Ich würde eine Kombination vorschlagen: eine kurze Prüfung für Grundwissen und ein Projekt für die Anwendung. So bleibt es objektiv, und wir messen trotzdem praktische Fähigkeiten.","vorschlag|schlage|kombination|kombinieren|beides; prüfung; projekt; so |dadurch|damit|deshalb"]],
 fr:[
  ["Question du jour : les universités devraient-elles remplacer les examens par des projets ? Quel est votre avis ?","Donnez clairement votre avis avec une raison.","À mon avis, les universités devraient utiliser davantage les projets, parce qu'ils montrent comment les étudiants appliquent leurs connaissances à des problèmes réels.","à mon avis|je pense|je crois|selon moi|de mon point de vue; parce qu|car |puisque; projet|examen|étudiant"],
  ["Mais les projets sont plus difficiles à noter équitablement. Les examens sont plus objectifs.","Exprimez poliment votre désaccord avec un contre-argument.","Je comprends votre point de vue, mais je ne suis pas entièrement convaincu. Avec des critères clairs, on peut noter les projets équitablement, et les examens ont aussi des défauts, par exemple le stress et l'apprentissage par cœur.","je comprends|c est vrai|certes|vous avez raison; mais |cependant|pourtant|toutefois; critères|par exemple|comme "],
  ["Pouvez-vous donner un exemple ?","Donnez un exemple concret tiré de votre expérience ou de vos lectures.","Par exemple, dans mon cours d'ingénierie, nous avons conçu un filtre à eau en équipe. Le rapport et le prototype ont mieux montré nos compétences qu'un examen écrit.","par exemple|notamment; cours |études|séminaire|projet|recherche; mieux|plus |montré"],
  ["Essayons de trouver un compromis. Que proposez-vous ?","Proposez un compromis et résumez.","Je proposerais une combinaison : un court examen pour les connaissances de base et un projet pour l'application. Ainsi, on garde l'objectivité tout en mesurant les compétences pratiques.","propos|suggère|combinaison|combiner|les deux; examen; projet; ainsi|de cette façon|donc|comme ça"]]
}}
];

  [60,{en:["Posture & release","Stand tall, feet hip-width apart. Roll the shoulders back 5 times, then slowly tilt the head ear-to-shoulder on each side.","Tension in neck and shoulders squeezes the larynx (voice box)."],de:["Haltung & Lockern","Aufrecht stehen, Füße hüftbreit. Schultern 5× nach hinten kreisen, dann den Kopf langsam Ohr zur Schulter neigen, beide Seiten.","Spannung in Nacken und Schultern engt den Kehlkopf ein."],fr:["Posture & détente","Debout, pieds écartés à largeur de hanches. Roulez les épaules vers l'arrière 5 fois, puis inclinez lentement la tête oreille vers épaule, des deux côtés.","Les tensions du cou et des épaules serrent le larynx."]}],

  ["Phonation","Producing voiced sound: air from the lungs makes the vocal folds (two small bands of muscle and tissue in the larynx, the voice box) vibrate."],

const rnd = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let store={set:{ui:"en",tl:"en",ctx:"pro",rate:0.95},sessions:[],mpt:[],sz:[],fill:[],conv:{},hist:[],art:{}};
try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); store=Object.assign(store,s); store.set=Object.assign({ui:"en",tl:"en",ctx:"pro",rate:0.95},s.set||{}); } else { const nl=(navigator.language||"en").slice(0,2); if(LANGS.includes(nl)){ store.set.ui=nl; store.set.tl=nl; } } }catch(e){ canStore=false; }

/* ---------- audio ---------- */
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(actx.state==="suspended") actx.resume(); return actx; }
function beep(f=880,d=.12,v=.15){ try{ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.frequency.value=f; g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.02);}catch(e){} }
function tone(f,d=2){ try{ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.25,c.currentTime+.05); g.gain.setValueAtTime(.25,c.currentTime+d-.2); g.gain.linearRampToValueAtTime(0,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.05);}catch(e){} }
let wakeLock=null;
async function keepAwake(on){ try{ if(on&&"wakeLock" in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null);} if(!on&&wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }

/* ---------- text-to-speech (partner voice) ---------- */
function speak(text, lang, onend){
  let done=false; const fin=()=>{ if(!done){ done=true; onend&&onend(); } };
  try{
    if(!("speechSynthesis" in window)) return fin();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=LOCALE[lang]; u.rate=+SET.rate||1;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang));
    const pref=vs.find(v=>v.lang.replace("_","-")===LOCALE[lang])||vs[0]; if(pref) u.voice=pref;
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    setTimeout(fin, 1500+text.length*90/(+SET.rate||1));
  }catch(e){ fin(); }
}
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let srBroken = !SR;
function recognizeOnce(lang, onInterim){
  return new Promise((resolve,reject)=>{
    let r; try{ r=new SR(); }catch(e){ srBroken=true; return reject("unsupported"); }
    r.lang=LOCALE[lang]; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    let finalTxt="", interim="", tFirst=null, tLast=null, err=null;
    r.onresult=e=>{ const now=performance.now(); if(tFirst===null) tFirst=now; tLast=now; interim=""; finalTxt="";
      for(let i=0;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal) finalTxt+=tr+" "; else interim+=tr+" "; }
      onInterim&&onInterim((finalTxt+interim).trim()); };
    r.onerror=e=>{ err=e.error; if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)) srBroken=true; };
    r.onend=()=>{ const text=(finalTxt||interim).trim(); if(err&&err!=="no-speech"&&!text) reject(err); else resolve({text,tFirst,tLast}); };
    try{ r.start(); }catch(e){ srBroken=true; reject("start-failed"); }
    recognizeOnce.current=r;
  });
}
function stopRecognition(){ try{ recognizeOnce.current&&recognizeOnce.current.stop(); }catch(e){} }

/* ---------- text matching & scoring ---------- */
const norm = s => String(s).toLowerCase().replace(/ß/g,"ss").replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function parseKW(str){ return str.split(";").map(g=>g.split("|").map(a=>a.replace(/^\s+/,"")).filter(a=>a.trim())).filter(g=>g.length); }
function kwHit(textN, alt){ const whole=/\s$/.test(alt), k=norm(alt); if(!k) return false; const hay=" "+textN+" ";
  if(whole) return hay.includes(" "+k+" "); if(k.length>=5) return hay.includes(k); return hay.includes(" "+k); }
function scoreTurn({text,dur,latency,level,model,kw,lang}){
  const tn=norm(text), words=tn?tn.split(" "):[], groups=parseKW(kw);
  const hits=groups.map(g=>g.some(a=>kwHit(tn,a)));
  let content=groups.length?hits.filter(Boolean).length/groups.length:1;
  const mw=norm(model).split(" ");
  if(level===1){ const ms=new Set(mw), ws=new Set(words); let o=0; ms.forEach(w=>{ if(ws.has(w)) o++; }); content=0.5*content+0.5*(o/ms.size); }
  const complete=Math.min(1, words.length/(0.6*mw.length));
  const wpm = dur>1.5 ? words.length/(dur/60) : null;
  const pace = wpm===null?0.7 : wpm<110?Math.max(0,(wpm-60)/50) : wpm>170?Math.max(0,(230-wpm)/60) : 1;
  const fset=new Set(FILLERS[lang].map(norm)), fillers=words.filter(w=>fset.has(w)).length;
  const fluency=Math.max(0, 1-0.25*fillers-(latency!=null&&latency>4?0.3:0));
  const score=Math.round(100*(0.5*content+0.2*complete+0.15*pace+0.15*fluency));
  return {score,content,complete,pace,fluency,wpm,fillers,hits,groups,auto:true};
}

/* ================= conversation state ================= */
function cKey(id,lang){ return id+"."+lang; }
function getConv(id,lang){ return store.conv[cKey(id,lang)]||{lvl:1,mastered:false,box:0,due:0,best:{},n:0}; }
function setConv(id,lang,s){ store.conv[cKey(id,lang)]=s; save(); }
function dueList(){ const now=Date.now(), out=[]; SCENES.forEach(sc=>LANGS.forEach(l=>{ const s=getConv(sc.id,l); if(s.mastered&&s.due<=now) out.push({sc,l,s}); })); return out; }
function stepsPassed(s){ return s.mastered?3:Math.max(0,s.lvl-1); }

  const box=$("#sceneList"); if(!box) return; box.innerHTML="";
  SCENES.filter(s=>s.ctx===SET.ctx).forEach(sc=>{

/* ================= conversation player ================= */
let ATT=null;
function startAttempt(sc,lang,level,mode,onlyTurns){
  ac(); keepAwake(true);
  const all=sc.turns[lang].map((_,i)=>i);
  ATT={sc,lang,level,mode,order:onlyTurns||all,pos:0,res:{},t0:Date.now()};
  $("#convList").classList.add("hidden"); $("#convPlayer").classList.remove("hidden");
  $("#cpTitle").textContent=sc.title[lang]+" ("+lang.toUpperCase()+")";
  const pm=mode==="review"?PASS.review:PASS[level];
  $("#cpLevel").innerHTML=(mode==="review"?`↻ ${t("review")} – `:"")+`${t("lvl")} ${level} · ${t("lvl"+level)} – ${t("lvl_d"+level)} <b>(${t("res_need",{s:"–",n:pm}).split("·")[1].trim()})</b>`+(mode==="weak"?`<br><i>${t("weak_note")}</i>`:"");
  if(curView!=="talk") show("talk"); window.scrollTo(0,0);
  renderTurn();
}
function closeAttempt(){ stopRecognition(); try{speechSynthesis.cancel();}catch(e){} keepAwake(false); ATT=null; $("#convPlayer").classList.add("hidden"); $("#convList").classList.remove("hidden"); renderScenes(); renderToday(); }
$("#cpClose").onclick=closeAttempt;

function renderTurn(){
  const A=ATT, ti=A.order[A.pos], [partner,task,model,kw]=A.sc.turns[A.lang][ti], groups=parseKW(kw);
  $("#cpSteps").innerHTML=A.order.map((_,k)=>`<i class="${k<A.pos||(k===A.pos&&A.res[A.order[k]])?'d':''}"></i>`).join("");
  const cue = A.level===1 ? `<div class="card flat"><div class="muted">${t("model")}</div><div style="font-size:1.05rem">${esc(model)}</div></div>`
            : A.level===2 ? `<div class="muted">${t("keypoints")}</div><div>${groups.map(g=>`<span class="kp">${esc(g[0].trim())}</span>`).join("")}</div>` : "";
  $("#cpBody").innerHTML=`
    <div class="muted" style="margin-top:8px">${t("turn")} ${A.pos+1}/${A.order.length} · ${t("partner")}</div>
    <div class="bubble them"><span id="pLine">${esc(partner)}</span> <button class="b sm alt" id="pReplay" style="min-height:30px;padding:3px 9px">🔊</button></div>
    <p><b>${t("your_task")}:</b> ${esc(task)}</p>
    ${cue}
    <div id="answerBox"></div>`;
  $("#pReplay").onclick=()=>speak(partner,A.lang);
  A.cur={text:"",dur:0,latency:null,readyT:null};
  speak(partner,A.lang,()=>{ if(ATT===A) A.cur.readyT=performance.now(); });
  renderAnswerControls();

function renderAnswerControls(){

    if(Math.abs(cents)<=30){ if(MIC.hT0===null) MIC.hT0=now; const h=(now-MIC.hT0)/1000; $("#holdTime").textContent=h.toFixed(1)+" s"; if(h>MIC.hBest){ MIC.hBest=h; $("#holdBest").textContent=h.toFixed(1)+" s"; } } else MIC.hT0=null;
  } else MIC.hT0=null;
  MIC.pH=MIC.pH.filter(p=>now-p.t<8000);
  if(MIC.pH.length>10){ const fs=MIC.pH.map(p=>p.f).sort((a,b)=>a-b); $("#pitchStats").textContent=t("pitch_stats",{m:fs[fs.length>>1].toFixed(0),a:fs[Math.floor(fs.length*.05)].toFixed(0),b:fs[Math.floor(fs.length*.95)].toFixed(0)}); }
  drawPitch(); MIC.raf=requestAnimationFrame(loopMic);
}
$("#thr").oninput=e=>{ $("#thrVal").textContent=e.target.value; $("#levelThr").style.left=((+e.target.value+80)/80*100)+"%"; };
$("#thr").oninput({target:$("#thr")});
$("#sustainSave").onclick=()=>{ if(MIC.sBest<1) return toast(t("toast_hold")); saveMPT(MIC.sBest,"mic"); };
let REC={mr:null,chunks:[],t0:0,h:null,n:0}; const topLevel=window.self===window.top;
$("#recBtn").onclick=async()=>{
  if(REC.mr){ REC.mr.stop(); return; }
  try{ const stream=MIC.stream||await navigator.mediaDevices.getUserMedia({audio:true}); const mr=new MediaRecorder(stream); REC.mr=mr; REC.chunks=[];
    mr.ondataavailable=e=>{ if(e.data.size) REC.chunks.push(e.data); };
    mr.onstop=()=>{ clearInterval(REC.h); const blob=new Blob(REC.chunks,{type:mr.mimeType||"audio/webm"}), url=URL.createObjectURL(blob); REC.n++;
      $("#takes").prepend(el("div",{class:"card flat",style:"padding:10px"},`<b>${t("take")} ${REC.n}</b> <span class="muted">${fmt((performance.now()-REC.t0)/1000)} · ${new Date().toLocaleTimeString()}</span><audio controls src="${url}" style="width:100%"></audio>`+(topLevel?`<a href="${url}" download="voicecoach-${REC.n}.webm">${t("download")}</a>`:"")));
      REC.mr=null; $("#recBtn").textContent=t("rec_btn"); if(!MIC.stream) stream.getTracks().forEach(x=>x.stop()); $("#recSentence").textContent=rnd(REC_SENT[SET.tl]); };
    mr.start(); REC.t0=performance.now(); $("#recBtn").textContent=t("rec_stop"); REC.h=setInterval(()=>$("#recTime").textContent=fmt((performance.now()-REC.t0)/1000),250);
  }catch(e){ micError(e); toast(t("mic_title")+" ✗"); }
};

/* ================= articulation ================= */
let SP={snd:Object.keys(ART[SET.tl])[0],pos:"i",idx:0,n:0};
function artKey(){ return SET.tl+"|"+SP.snd; }
function artStats(lang,snd){ const a=store.art[lang+"|"+snd]||[]; const l=a.slice(-10); return {n:a.length,p:l.length?Math.round(l.filter(Boolean).length/l.length*100):0,mastered:l.length>=10&&l.filter(Boolean).length>=9}; }
function renderSpeech(){
  if(!ART[SET.tl][SP.snd]) SP.snd=Object.keys(ART[SET.tl])[0];
  chipSet($("#soundChips"),Object.keys(ART[SET.tl]).map(k=>[k,k+(artStats(SET.tl,k).mastered?" ✓":"")]),SP.snd,v=>{ SP.snd=v; SP.idx=0; renderSpeech(); });
  chipSet($("#posChips"),[["i",t("pos_i")],["m",t("pos_m")],["f",t("pos_f")],["s",t("pos_s")]],SP.pos,v=>{ SP.pos=v; SP.idx=0; renderSpeech(); });
  $("#soundTip").innerHTML="<b>"+t("how_sound")+"</b> "+esc(ART[SET.tl][SP.snd].tip);
  showWord(); showArtMastery();
}
function curList(){ return ART[SET.tl][SP.snd][SP.pos]; }
function showWord(){ const L=curList(); SP.idx=(SP.idx+L.length)%L.length; const w=L[SP.idx]; $("#drillWord").textContent=w; $("#drillWord").style.fontSize=w.length>18?"1.35rem":"2.1rem"; $("#drillHeard").textContent="";
  $("#drillCount").textContent=t("art_count",{n:artStats(SET.tl,SP.snd).n,i:SP.idx+1,t:L.length}); }
function showArtMastery(){ const s=artStats(SET.tl,SP.snd); $("#artBar").style.width=s.p+"%"; $("#artBar").style.background=s.mastered?"var(--ok)":"var(--accent)"; $("#artMastery").innerHTML=t("art_mastery",{p:s.p})+(s.mastered?` <span class="tag ok">${t("art_badge")}</span>`:""); }
function artMark(ok){ const k=artKey(), a=store.art[k]||[], wasM=artStats(SET.tl,SP.snd).mastered; a.push(ok?1:0); store.art[k]=a.slice(-50); save(); SP.n++;
  beep(ok?990:440,.1,.1); showArtMastery(); const nowM=artStats(SET.tl,SP.snd).mastered; if(nowM&&!wasM){ toast(SP.snd+" – "+t("art_badge")); renderSpeech(); }
  if(SP.n%15===0) logSession(t("art_title")+" "+SP.snd,4);
  setTimeout(()=>{ SP.idx++; showWord(); }, ok?600:1200); }
$("#drillOk").onclick=()=>artMark(true); $("#drillBad").onclick=()=>artMark(false);
$("#drillNext").onclick=()=>{ SP.idx++; showWord(); }; $("#drillPrev").onclick=()=>{ SP.idx--; showWord(); };
$("#drillCheck").onclick=async()=>{
  if(srBroken){ toast(t("sr_off")); return; }
  const target=curList()[SP.idx], btn=$("#drillCheck"); if(btn.dataset.on){ stopRecognition(); return; }
  btn.dataset.on="1"; btn.textContent=t("stop"); $("#drillHeard").textContent=t("listening");
  try{ const r=await recognizeOnce(SET.tl,txt=>$("#drillHeard").textContent=t("art_heard",{w:txt}));
    const hn=norm(r.text), tn=norm(target); let ok;
    if(SP.pos==="s"){ const tw=tn.split(" "), hs=new Set(hn.split(" ")); ok=tw.filter(w=>hs.has(w)).length/tw.length>=0.8; } else ok=(" "+hn+" ").includes(" "+tn+" ");
    $("#drillHeard").textContent=t("art_heard",{w:r.text||"…"})+" "+(ok?"✓":"✗"); if(r.text) artMark(ok);
  }catch(e){ $("#drillHeard").textContent=t("sr_err",{e}); }
  delete btn.dataset.on; btn.textContent=t("art_check");
};
let curPair=null;
function nextPair(){ curPair=rnd(PAIRS[SET.tl]); $("#pairBox").textContent=curPair[0]+"  /  "+curPair[1]; $("#pairPicked").textContent=""; }
$("#pairNext").onclick=nextPair; $("#pairPick").onclick=()=>{ if(!curPair) nextPair(); $("#pairPicked").innerHTML=t("pairs_say")+" <b>"+esc(rnd(curPair))+"</b>"; };

/* ---------- paced reader ---------- */
function makeReader(box,getText,wpmIn,wpmLbl,btn,onDone,clickBox){
  let words=[],i=0,h=null;
  function load(){ stop(); words=getText().split(/\s+/).filter(Boolean); box.innerHTML=words.map(w=>`<span>${esc(w)}</span>`).join(" "); i=0; }
  function step(){ const sp=box.children; if(i>0){ sp[i-1].classList.remove("now"); sp[i-1].classList.add("done"); }
    if(i>=words.length){ stop(); onDone&&onDone(); return; }
    sp[i].classList.add("now"); if(clickBox&&clickBox.checked) beep(1200,.03,.12);
    const w=words[i], base=60000/(+wpmIn.value), extra=/[.!?]$/.test(w)?base*.8:/[,;:]$/.test(w)?base*.4:0; i++; h=setTimeout(step,base+extra); }
  function stop(){ clearTimeout(h); h=null; btn.textContent=t("startb"); keepAwake(false); }
  btn.onclick=()=>{ if(h){ stop(); return; } ac(); if(i===0||i>=words.length) load(); btn.textContent=t("stopb"); keepAwake(true); step(); };
  wpmIn.oninput=()=>wpmLbl.textContent=wpmIn.value; return {load};
}
const tw=makeReader($("#twReader"),()=>{ const x=TWISTERS[SET.tl][+$("#twSelect").value||0]; return (x+" ").repeat(3).trim(); },$("#twWpm"),$("#twWpmVal"),$("#twStart"),()=>logSession(t("tw_title"),1),$("#twClick"));
function renderTwisters(){ const s=$("#twSelect"), keep=s.value; s.innerHTML=""; TWISTERS[SET.tl].forEach((x,k)=>s.append(el("option",{value:k},x.length>48?esc(x.slice(0,46))+"…":esc(x)))); if(keep&&s.options[keep]) s.value=keep; tw.load(); }
$("#twSelect").onchange=()=>tw.load();
const pace=makeReader($("#paceReader"),()=>{ const c=CTXS[+$("#paceSelect").value||0]; return PASSAGES[SET.tl][c][1]; },$("#paceWpm"),$("#paceWpmVal"),$("#paceStart"),()=>logSession(t("read_title"),2));
function renderPassages(){ const s=$("#paceSelect"); s.innerHTML=""; CTXS.forEach((c,k)=>s.append(el("option",{value:k},`${esc(PASSAGES[SET.tl][c][0])} (${t("ctx_"+c)})`))); s.value=CTXS.indexOf(SET.ctx); pace.load(); }
$("#paceSelect").onchange=()=>pace.load();

/* ---------- impromptu & fillers ---------- */
let TP={dur:60,h:null,left:60};
function drawDur(){ chipSet($("#topicDur"),[[30,"30 s"],[60,"1 min"],[120,"2 min"],[180,"3 min"]],TP.dur,v=>{ TP.dur=+v; TP.left=+v; $("#topicTime").textContent=fmt(+v); drawDur(); }); } drawDur();
$("#topicNew").onclick=()=>{ $("#topicBox").textContent=rnd(TOPICS[SET.tl][SET.ctx]); $("#topicBox").dataset.set="1"; };
$("#topicStart").onclick=()=>{
  if(TP.h){ clearInterval(TP.h); TP.h=null; $("#topicStart").textContent=t("startb"); keepAwake(false); return; }
  if(!$("#topicBox").dataset.set) $("#topicNew").onclick();
  ac(); TP.left=TP.dur; $("#topicTime").textContent=fmt(TP.left); $("#topicStart").textContent=t("stopb"); keepAwake(true); beep(880);
  TP.h=setInterval(()=>{ TP.left--; $("#topicTime").textContent=fmt(TP.left); if(TP.left===10) beep(660,.1); if(TP.left<=0){ clearInterval(TP.h); TP.h=null; beep(990,.4); $("#topicStart").textContent=t("startb"); keepAwake(false); logSession(t("imp_title"),TP.dur/60); } },1000);
};
let FL={n:0,t0:null,h:null};
function flUpdate(){ const s=FL.t0?(performance.now()-FL.t0)/1000:0; $("#fillTime").textContent=fmt(s); $("#fillRate").textContent=s>10?(FL.n/(s/60)).toFixed(1):"–"; $("#fillTap").textContent=`${t("filler_btn")} (${FL.n})`; }
$("#fillTap").onclick=()=>{ if(!FL.t0) $("#fillStart").onclick(); FL.n++; try{ navigator.vibrate&&navigator.vibrate(30); }catch(e){} flUpdate(); };
$("#fillStart").onclick=()=>{ if(FL.h){ clearInterval(FL.h); FL.h=null; $("#fillStart").textContent=t("start_timer"); return; } if(!FL.t0){ FL.t0=performance.now(); FL.n=0; } FL.h=setInterval(flUpdate,500); $("#fillStart").textContent=t("pause"); };
$("#fillSave").onclick=()=>{ if(!FL.t0) return toast(t("toast_timer")); const min=(performance.now()-FL.t0)/60000; store.fill.push({d:today(),t:Date.now(),n:FL.n,min:Math.round(min*10)/10,rate:Math.round(FL.n/min*10)/10}); save(); logSession(t("filler_title"),min); clearInterval(FL.h); FL={n:0,t0:null,h:null}; $("#fillStart").textContent=t("start_timer"); flUpdate(); };

/* ================= stats & progress ================= */
function refreshStats(){
  const wk=Date.now()-7*DAY, w=store.sessions.filter(s=>s.t>wk);
  $("#stSessions").textContent=w.length; $("#stMinutes").textContent=Math.round(w.reduce((a,s)=>a+s.min,0));
  const days=new Set(store.sessions.map(s=>s.d)); let streak=0; const d=new Date(); if(!days.has(today())) d.setDate(d.getDate()-1);
  while(days.has(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
  $("#stStreak").textContent=streak; $("#streakBadge").textContent=streak?"🔥 "+streak:""; $("#stDue").textContent=dueList().length;
}
function prepCanvas(c,h){ const dpr=window.devicePixelRatio||1, W=c.clientWidth*dpr, H=h*dpr; c.width=W; c.height=H; const g=c.getContext("2d"); g.font=(10*dpr)+"px system-ui"; return {g,W,H,dpr}; }
function renderProgress(){
  $("#prMastTitle").textContent=t("pr_mastery",{l:LANG_NAMES[SET.tl]});
  const pm=$("#prMastery"); pm.innerHTML="";
  CTXS.forEach(c=>{ const sc=SCENES.filter(s=>s.ctx===c), st=sc.map(s=>getConv(s.id,SET.tl)), p=st.reduce((a,s)=>a+stepsPassed(s),0)/(3*sc.length);
    pm.append(el("div",{style:"margin:8px 0"},`<div class="row"><b class="grow">${t("ctx_"+c)}</b><span>${Math.round(p*100)} %</span></div><div class="bar"><i style="width:${p*100}%"></i></div>
      <div class="muted">${sc.map((s,i)=>`${esc(s.title[SET.ui])}: ${st[i].mastered?"✓":t("lvl")+" "+st[i].lvl}`).join(" · ")}</div>`)); });
  let tb=`<table style="margin-top:8px"><tr><th></th>${CTXS.map(c=>`<th>${t("ctx_"+c)}</th>`).join("")}</tr>`;
  LANGS.forEach(l=>{ tb+=`<tr><td><b>${l.toUpperCase()}</b></td>${CTXS.map(c=>{ const sc=SCENES.filter(s=>s.ctx===c); const p=sc.reduce((a,s)=>a+stepsPassed(getConv(s.id,l)),0)/(3*sc.length); return `<td>${Math.round(p*100)} %</td>`; }).join("")}</tr>`; });
  $("#prLangTable").innerHTML=tb+"</table>";
  // score chart
  { const {g,W,H,dpr}=prepCanvas($("#scoreChart"),170), hs=store.hist.slice(-30), Y=v=>H-12*dpr-v/100*(H-22*dpr), X=i=>26*dpr+(hs.length<2?.5:i/(hs.length-1))*(W-36*dpr);
    g.strokeStyle=cssv("--line"); g.fillStyle=cssv("--muted"); [0,50,100].forEach(v=>{ g.beginPath(); g.moveTo(22*dpr,Y(v)); g.lineTo(W,Y(v)); g.stroke(); g.fillText(v,2,Y(v)+3*dpr); });
    g.setLineDash([4*dpr,4*dpr]); g.strokeStyle=cssv("--ok"); [70,75,80].forEach(v=>{ g.beginPath(); g.moveTo(22*dpr,Y(v)); g.lineTo(W,Y(v)); g.stroke(); }); g.setLineDash([]);
    if(!hs.length){ g.fillStyle=cssv("--muted"); g.fillText(t("nothing"),30*dpr,24*dpr); }
    g.strokeStyle=cssv("--accent"); g.lineWidth=1.5*dpr; g.beginPath(); hs.forEach((h,i)=>i?g.lineTo(X(i),Y(h.score)):g.moveTo(X(i),Y(h.score))); g.stroke();
    hs.forEach((h,i)=>{ g.fillStyle=h.pass?cssv("--ok"):cssv("--warn"); g.beginPath(); g.arc(X(i),Y(h.score),(h.mode==="review"?4.5:3.2)*dpr,0,7); g.fill(); }); }
  // articulation
  $("#prArtTitle").textContent=t("pr_art",{l:LANG_NAMES[SET.tl]});
  $("#prArt").innerHTML=Object.keys(ART[SET.tl]).map(k=>{ const s=artStats(SET.tl,k); return `<div class="sc"><span>${k} ${s.mastered?"✓":""}</span><div class="bar"><i style="width:${s.p}%;background:${s.mastered?'var(--ok)':'var(--accent)'}"></i></div><b>${s.n?s.p+"%":"–"}</b></div>`; }).join("");
  // measurements
  { const {g,W,H,dpr}=prepCanvas($("#measChart"),150), ser=[[store.mpt.map(m=>[m.t,m.v]),cssv("--ok")],[store.sz.map(z=>[z.t,z.r*10]),cssv("--accent2")]], all=ser.flatMap(s=>s[0]);
    if(!all.length){ g.fillStyle=cssv("--muted"); g.fillText(t("nothing"),10*dpr,20*dpr); }
    else { const t0=Math.min(...all.map(p=>p[0])), t1=Math.max(...all.map(p=>p[0])), vmax=Math.max(30,...all.map(p=>p[1])), X=x=>22*dpr+(t1===t0?.5:(x-t0)/(t1-t0))*(W-32*dpr), Y=v=>H-12*dpr-v/vmax*(H-22*dpr);
      g.strokeStyle=cssv("--line"); g.fillStyle=cssv("--muted"); [0,10,20,30].filter(v=>v<=vmax).forEach(v=>{ g.beginPath(); g.moveTo(18*dpr,Y(v)); g.lineTo(W,Y(v)); g.stroke(); g.fillText(v,2,Y(v)+3*dpr); });
      ser.forEach(([pts,col])=>{ if(!pts.length) return; g.strokeStyle=col; g.fillStyle=col; g.lineWidth=2*dpr; g.beginPath(); pts.forEach((p,k)=>k?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1]))); g.stroke(); pts.forEach(p=>{ g.beginPath(); g.arc(X(p[0]),Y(p[1]),3*dpr,0,7); g.fill(); }); }); } }
  // history
  const title=id=>{ const s=SCENES.find(x=>x.id===id); return s?s.title[SET.ui]:id; };
  const rows=[...store.hist.map(h=>[h.t,h.d,`${title(h.id)} (${h.lang.toUpperCase()}, ${h.mode==="review"?t("review"):t("lvl")+" "+h.level})`,`${h.score} ${h.pass?"✓":"✗"}`]),
    ...store.sessions.filter(s=>!store.hist.some(h=>Math.abs(h.t-s.t)<1500)).map(s=>[s.t,s.d,esc(s.name),s.min+" min"]),
    ...store.mpt.map(m=>[m.t,m.d,"MPT",m.v+" s"]),...store.sz.map(z=>[z.t,z.d,"s/z",`${z.r} (s ${z.s} / z ${z.z})`]),...store.fill.map(f=>[f.t,f.d,t("filler_title"),`${f.rate}/min`])].sort((a,b)=>b[0]-a[0]).slice(0,80);
  $("#logTable").innerHTML=rows.length?`<table><tr><th>${t("t_date")}</th><th>${t("t_act")}</th><th>${t("t_res")}</th></tr>${rows.map(r=>`<tr><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table>`:`<p class="muted">${t("nothing")}</p>`;
  $("#storeNote").textContent=canStore?t("store_ok"):t("store_no");
}
$("#logCopy").onclick=async()=>{ const title=id=>{ const s=SCENES.find(x=>x.id===id); return s?s.title.en:id; };
  const txt=["VoiceCoach",...store.hist.map(h=>`${h.d}\t${title(h.id)} ${h.lang} ${h.mode} L${h.level}\t${h.score}${h.pass?" pass":" fail"}`),...store.sessions.map(s=>`${s.d}\t${s.name}\t${s.min} min`),...store.mpt.map(m=>`${m.d}\tMPT\t${m.v} s`),...store.sz.map(z=>`${z.d}\ts/z\t${z.r}`),...store.fill.map(f=>`${f.d}\tfillers\t${f.rate}/min`)].join("\n");
  try{ await navigator.clipboard.writeText(txt); toast(t("toast_copied")); }catch(e){ toast(t("toast_copyfail")); } };
$("#logClear").onclick=()=>$("#confirmClear").classList.remove("hidden");
$("#ccNo").onclick=()=>$("#confirmClear").classList.add("hidden");
$("#ccYes").onclick=()=>{ Object.assign(store,{sessions:[],mpt:[],sz:[],fill:[],conv:{},hist:[],art:{}}); save(); $("#confirmClear").classList.add("hidden"); refreshStats(); renderProgress(); renderScenes(); renderSpeech(); toast(t("toast_cleared")); };

/* ================= init ================= */
$("#recSentence").textContent=rnd(REC_SENT[SET.tl]);
applyI18n(); nextPair();
{ const h=location.hash.slice(1); show(VIEWS.includes(h)?h:"today"); }
if("serviceWorker" in navigator && location.protocol==="https:" && topLevel && document.querySelector('link[rel=manifest]')){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
