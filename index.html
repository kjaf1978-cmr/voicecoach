function stopMic(){ cancelAnimationFrame(MIC.raf); MIC.stream.getTracks().forEach(x=>x.stop()); MIC.stream=null; $("#micBtn").textContent=t("mic_on"); keepAwake(false); }
function detectPitch(buf,sr){
  const n0=buf.length; let rms=0; for(let i=0;i<n0;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/n0); if(rms<0.008) return {f:0,rms};
  // decimate to ~24 kHz (2-tap average) – 4× less work, same accuracy for voice up to 1100 Hz
  const d=sr>=32000?2:1, n=Math.floor(n0/d), x=d>1?new Float32Array(n):buf; if(d>1) for(let i=0;i<n;i++) x[i]=(buf[2*i]+buf[2*i+1])/2; const r=sr/d;
  const minLag=Math.floor(r/1100), maxLag=Math.floor(r/65), size=n-maxLag, corr=new Float32Array(maxLag+2); let best=-1,bestLag=0;
  for(let lag=minLag;lag<=maxLag+1;lag++){ let s=0,e1=0,e2=0; for(let i=0;i<size;i++){ const a=x[i],b=x[i+lag]; s+=a*b; e1+=a*a; e2+=b*b; } corr[lag]=s/Math.sqrt(e1*e2+1e-12); }
  for(let lag=minLag+1;lag<=maxLag;lag++){ if(corr[lag]>corr[lag-1]&&corr[lag]>=corr[lag+1]&&corr[lag]>best){ best=corr[lag]; bestLag=lag; if(best>0.93) break; } }
  if(best<0.75) return {f:0,rms};
  const y1=corr[bestLag-1],y2=corr[bestLag],y3=corr[bestLag+1], den=2*(2*y2-y1-y3), dd=den?(y3-y1)/den:0;
  return {f:r/(bestLag+(isFinite(dd)?dd:0)),rms};
}
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawPitch(){ const pc=$("#pitchCanvas"), dpr=window.devicePixelRatio||1, W=pc.clientWidth*dpr, H=170*dpr; if(pc.width!==W){pc.width=W;pc.height=H;}
  const g=pc.getContext("2d"); g.clearRect(0,0,W,H); const lo=hzToMidi(70),hi=hzToMidi(700),yOf=m=>H-(m-lo)/(hi-lo)*H;
  g.font=(10*dpr)+"px system-ui"; g.fillStyle=cssv("--muted"); g.strokeStyle=cssv("--line"); g.lineWidth=1;
  [100,150,200,300,400,600].forEach(f=>{ const y=yOf(hzToMidi(f)); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); g.fillText(f+" Hz",4,y-3); });
  const vt=typeof voiceTarget==="function"&&voiceTarget(); if(vt){ g.fillStyle="rgba(47,138,77,.12)"; const y1=yOf(hzToMidi(vt.hi)), y2=yOf(hzToMidi(vt.lo)); g.fillRect(0,y1,W,y2-y1); }

  const now=performance.now(); g.fillStyle=cssv("--accent2"); MIC.pH.forEach(p=>{ g.beginPath(); g.arc(W-(now-p.t)/8000*W,yOf(hzToMidi(p.f)),2.2*dpr,0,7); g.fill(); }); }
function loopMic(){
  MIC.an.getFloatTimeDomainData(MIC.buf); const {f,rms}=detectPitch(MIC.buf,actx.sampleRate), now=performance.now(), db=20*Math.log10(Math.max(rms,1e-5));

/* ---------- paced reader ---------- */
function makeReader(box,getText,wpmIn,wpmLbl,btn,onDone,clickBox){
  let words=[],i=0,h=null;
  function load(){ stop(); words=getText().split(/\s+/).filter(Boolean); box.innerHTML=words.map(w=>`<span>${esc(w)}</span>`).join(" "); i=0; }
  function step(){ const sp=box.children; if(i>0){ sp[i-1].classList.remove("now"); sp[i-1].classList.add("done"); }
    if(i>=words.length){ stop(); onDone&&onDone(); return; }
    sp[i].classList.add("now"); if(clickBox&&clickBox.checked) beep(1200,.03,.12);
    const w=words[i], base=60000/(+wpmIn.value), extra=/[.!?]$/.test(w)?base*.8:/[,;:]$/.test(w)?base*.4:0; i++; h=setTimeout(step,base+extra); }
  function stop(){ clearTimeout(h); h=null; btn.textContent=t("startb"); keepAwake(false); }
  btn.onclick=()=>{ if(h){ stop(); return; } ac(); if(i===0||i>=words.length) load(); btn.textContent=t("stopb"); keepAwake(true); step(); };
  wpmIn.oninput=()=>wpmLbl.textContent=wpmIn.value; return {load};
}

function onSpoken(r,usedSR){

    if(fatal||silent){ A.srMiss++; if(fatal||A.srMiss>=2){ store.flags.conc=false; SET.mode="rec"; save(); toast(t("conc_note")); renderSettings(); } } }

function convScore({text=null,an=null,tips=null,d,level,lang,ticks=null,hints=0}){
  let hits,content;
  if(ticks){ hits=ticks; content=hits.filter(Boolean).length/hits.length; }
  else { const tn=norm(text||""); hits=d.groups.map(g=>g.some(a=>kwHit(tn,a))); content=hits.filter(Boolean).length/hits.length;
    if(level===1&&text){ const ms=new Set(norm(d.model).split(" ")), ws=new Set(tn.split(" ")); let o=0; ms.forEach(w=>{ if(ws.has(w)) o++; }); content=0.5*content+0.5*o/ms.size; } }
  const mw=norm(d.model).split(" ").length;
  const complete = text ? Math.min(1,norm(text).split(" ").length/(0.6*mw)) : (an&&an.ok ? Math.min(1,an.speak/(0.6*mw/2.4)) : 0);
  const del = tips&&tips.scores ? Object.values(tips.scores).reduce((a,b)=>a+b,0)/Object.values(tips.scores).length : null;
  let score = del!=null ? 0.45*content+0.15*complete+0.40*del : 0.6*content+0.4*complete;
  score=Math.max(0,Math.round(score*100)-5*hints);
  const fi = text ? fillerInfo(text,lang) : {n:0,words:[]};
  return {score,content,complete,delivery:del,hits,fillers:fi.words,dims:tips&&tips.scores,auto:!ticks,text};
}

const SUP_SENT={de:"Heute spreche ich ruhig, klar und kraftvoll – meine Stimme kommt aus dem Bauch.",

/* frame energies (10 ms) for any sound incl. voiceless fricatives */
function frameDb(pcm){ const hop=160,N=Math.floor(pcm.length/hop),db=new Float32Array(N); for(let i=0;i<N;i++){ let s=0; for(let j=i*hop;j<i*hop+hop;j++) s+=pcm[j]*pcm[j]; db[i]=10*Math.log10(s/hop+1e-10); } return db; }
/* spectral balance: low band (<1 kHz) vs high band (1–4 kHz) energy on voiced frames, dB. Higher = darker / less pressed. Heuristic only. */
function spectralBalance(pcm,an){
  if(!an||!an.ok) return null; const S=an.series; let lo=0,hi=0,yl=0,yh=0,px=0; const al=1-Math.exp(-2*Math.PI*1000/16000), ah=Math.exp(-2*Math.PI*1000/16000), a4=1-Math.exp(-2*Math.PI*4000/16000); let h4=0;
  for(let i=0;i<pcm.length;i++){ yl+=al*(pcm[i]-yl); yh=ah*(yh+pcm[i]-px); px=pcm[i]; h4+=a4*(yh-h4); const k=Math.floor(i/320); if(S.f0[k]>0){ lo+=yl*yl; hi+=h4*h4; } }
  return hi>0?10*Math.log10(lo/hi):null; }

/* ---- 1) diaphragm impulses ---- */
function pulseControls(box){
  const N=8; box.innerHTML=`<button class="b warm" style="width:100%" id="supGo">${t("sup_start")}</button>`;
  $("#supGo").onclick=async()=>{
    const per=60/SUP.tempo, dot=$("#supBeat"); $("#supGo").disabled=true; ac(); keepAwake(true);
    for(let k=4;k>=1;k--){ dot.textContent=k; dot.classList.add("on"); beep(k===1?1100:800,.08,.15); await new Promise(r=>setTimeout(r,per*500)); dot.classList.remove("on"); await new Promise(r=>setTimeout(r,per*500)); }
    let take; try{ take=await startTake({}); }catch(e){ micError(e); $("#supGo").disabled=false; return; }
    const t0=performance.now(), lead=0.4; dot.textContent="";
    for(let k=0;k<N;k++){ const due=t0+(lead+k*per)*1000; setTimeout(()=>{ dot.textContent=k+1; dot.classList.add("on"); try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){} setTimeout(()=>dot.classList.remove("on"),150); },Math.max(0,due-performance.now())); }
    setTimeout(async()=>{ dot.textContent="…"; const r=await take.stop(); keepAwake(false); dot.textContent=t("sup_ready"); $("#supGo").disabled=false; pulseDone(r,lead,per,N); },(lead+N*per+0.8)*1000);
  };
}
function pulseDone(r,lead,per,N){
  const db=frameDb(r.pcm), floor=pctl(db,0.1), peak=pctl(db,0.99), thr=floor+Math.max(10,0.4*(peak-floor));
  const pulses=[]; for(let i=0;i<db.length;){ if(db[i]>thr){ let j=i,mx=-200; while(j<db.length&&db[j]>thr-3){ mx=Math.max(mx,db[j]); j++; } if(j-i>=3) pulses.push({s:i/100,e:j/100,d:(j-i)/100,pk:mx}); i=j+8; } else i++; }
  const beats=[...Array(N)].map((_,k)=>lead+k*per), errs=pulses.map(p=>Math.min(...beats.map(b=>Math.abs(p.s-b))));
  const nScore=Math.max(0,1-Math.abs(pulses.length-N)/N), meanErr=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:per;
  const timing=Math.max(0,1-meanErr/(per*0.5)), longP=pulses.filter(p=>p.d>0.35).length, crisp=pulses.length?1-longP/pulses.length:0;
  let gaps=0; for(let k=1;k<pulses.length;k++){ let mn=200; for(let i=Math.round(pulses[k-1].e*100);i<Math.round(pulses[k].s*100);i++) mn=Math.min(mn,db[i]); if(pulses[k-1].pk-mn>=15) gaps++; }
  const sep=pulses.length>1?gaps/(pulses.length-1):0, pk=pulses.map(p=>p.pk), m=pk.reduce((a,b)=>a+b,0)/(pk.length||1), sd=Math.sqrt(pk.reduce((a,b)=>a+(b-m)*(b-m),0)/(pk.length||1)), even=pulses.length?Math.max(0,Math.min(1,1-(sd-2)/6)):0;
  const scores={sup_count:nScore,sup_timing:timing,sup_crisp:crisp,sup_sep:sep,sup_even:even}, score=Math.round(100*Object.values(scores).reduce((a,b)=>a+b,0)/5);
  const fix=[],good=[];
  if(pulses.length<N) fix.push({txt:t("sup_t_few",{n:pulses.length,N})}); else if(pulses.length>N) fix.push({txt:t("sup_t_many",{n:pulses.length,N})}); else good.push(t("sup_g_count",{n:pulses.length}));
  if(timing<0.7) fix.push({txt:t("sup_t_timing",{ms:Math.round(meanErr*1000)})}); else good.push(t("sup_g_timing"));
  pulses.filter(p=>p.d>0.35).slice(0,2).forEach(p=>fix.push({t:p.s,txt:t("sup_t_long",{ms:Math.round(p.d*1000)})}));
  if(sep<0.7) fix.push({txt:t("sup_t_sep")}); else good.push(t("sup_g_sep"));
  if(even<0.7) fix.push({txt:t("sup_t_even",{v:(Math.round(sd*10)/10).toLocaleString(SET.ui)})}); else good.push(t("sup_g_even"));
  supResult({r,an:analyze(r.pcm,{minSpeech:20}),fix,good,scores,score,ex:"pulse",title:t("sup_pulse")+" "+SUP.tempo+" bpm"});
}
/* ---- 2) steady airflow on "ssss" ---- */
function flowDone(r){
  const db=frameDb(r.pcm), floor=pctl(db,0.1), peak=pctl(db,0.98), thr=floor+Math.max(8,0.35*(peak-floor));
  let best={s:0,e:0}; for(let i=0;i<db.length;){ if(db[i]>thr){ let j=i,gap=0; while(j<db.length&&(db[j]>thr||gap<15)){ gap=db[j]>thr?0:gap+1; j++; } j-=gap; if(j-i>best.e-best.s) best={s:i,e:j}; i=j+1; } else i++; }
  const dur=(best.e-best.s)/100, seg=Array.from(db.slice(best.s,best.e)).filter(v=>v>thr-6);
  const core=seg.slice(Math.floor(seg.length*0.1),Math.floor(seg.length*0.9)), m=core.reduce((a,b)=>a+b,0)/(core.length||1), sd=Math.sqrt(core.reduce((a,b)=>a+(b-m)*(b-m),0)/(core.length||1));
  const raw=Array.from(db.slice(best.s,best.e)), half=raw.slice(0,Math.floor(raw.length/2)), tail=raw.slice(-Math.max(20,Math.floor(raw.length*0.15))), avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1), drop=avg(half)-avg(tail);
  const dS=Math.min(1,dur/15), stS=Math.max(0,Math.min(1,1-(sd-1.5)/4)), endS=Math.max(0,Math.min(1,1-(drop-3)/9));
  const scores={sup_dur:dS,sup_steady:stS,sup_end:endS}, score=Math.round(100*(0.5*dS+0.3*stS+0.2*endS)), f1=x=>(Math.round(x*10)/10).toLocaleString(SET.ui);
  const fix=[],good=[];
  if(dur<10) fix.push({txt:t("sup_t_short",{s:f1(dur)})}); else good.push(t("sup_g_dur",{s:f1(dur)}));
  if(sd>3) fix.push({txt:t("sup_t_wobble",{v:f1(sd)})}); else good.push(t("sup_g_steady",{v:f1(sd)}));
  if(drop>6) fix.push({t:best.e/100-2,txt:t("sup_t_fade",{v:f1(drop)})});
  supResult({r,an:analyze(r.pcm,{minSpeech:20}),fix,good,scores,score,ex:"flow",title:t("sup_flow"),extra:`<p><b>${t("sup_dur")}:</b> ${f1(dur)} s · <b>${t("sup_steady")}:</b> ${f1(sd)} dB</p>`});
}

const COACH_OF={fast:"fast",slow:"slow",nopause:"pauses",manypause:"fluent",longpause:"fluent",mono:"melody",uptalk:"uptalk",trail:"trail",quiet:"quiet",clip:"clip",late:"late",fillers:"fillers",clarity:"clarity"};

/* ---------- assignments ---------- */
function coachStore(){ return store.coach||(store.coach={}); }
function coachRegister(fix,src){
  if(!fix||!fix.length) return; const C=coachStore(), added=[];
  fix.forEach(f=>{ const id=COACH_OF[f.code]; if(!id) return; let a=C[id];
    if(!a){ a=C[id]={id,created:Date.now(),streak:0,attempts:0,done:false,hist:[],src:"",words:[]}; added.push(id); }
    else if(a.done&&!a.recheckDue){ a.done=false; a.streak=0; a.reopened=Date.now(); added.push(id); }
    if(src){ a.src=src; a.srcLang=SET.ui; } a.lastSeen=Date.now(); if(f.miss){ if(a.wordsLang!==SET.tl) a.words=[]; a.wordsLang=SET.tl; a.words=[...new Set(f.miss.concat(a.words||[]))].slice(0,8); } });

}
function coachRegisterExt(id,src,extra){ const C=coachStore(); let a=C[id]; if(!a){ a=C[id]=Object.assign({id,created:Date.now(),streak:0,attempts:0,done:false,hist:[],src:src||"",srcLang:SET.ui},extra||{}); save(); renderCoachList(); toast("🏋 "+t("coach_new",{n:coachName(id)})); } else if(a.done){ a.done=false; a.streak=0; save(); renderCoachList(); } }
function coachName(id){ if(id.startsWith("art:")){ const [l,s]=id.slice(4).split("|"); return t("cd_art",{s,l:langIn(l)}); } if(id.startsWith("sup:")) return t(id==="sup:pulse"?"sup_pulse":"sup_flow"); return t("cd_"+id); }
function coachOpen(){ const C=coachStore(), now=Date.now(); return Object.values(C).filter(a=>!a.done||(a.recheckAt&&a.recheckAt<=now)); }
function coachAttempt(id,pass,val){ const a=coachStore()[id]; if(!a) return null; const rc=a.done&&a.recheckAt&&a.recheckAt<=Date.now();
  a.attempts++; a.hist.push({t:Date.now(),v:val,p:pass}); a.hist=a.hist.slice(-40); a.streak=pass?a.streak+1:0;
  let achieved=false; const need=rc?1:STREAK;
  if(a.streak>=need){ achieved=true; a.streak=0; if(rc){ a.rechecks=(a.rechecks||0)+1; a.recheckAt=a.rechecks<RECHECK.length?Date.now()+RECHECK[a.rechecks]*DAY:null; } else { a.done=true; a.doneAt=Date.now(); a.rechecks=0; a.recheckAt=Date.now()+RECHECK[0]*DAY; } markPlan("coach",id); }
  else if(rc&&!pass){ a.done=false; a.recheckAt=null; }
  save(); renderCoachList(); return {achieved,rc,a,need};
}

/* ---------- Today card ---------- */
function renderCoachList(){
  const box=$("#coachList"); if(!box) return; const C=coachStore(), now=Date.now(); box.innerHTML="";
  Object.values(C).forEach(a=>{ if(a.id.startsWith("art:")&&!a.done){ const [l,s]=a.id.slice(4).split("|"); if(ART[l]&&ART[l][s]&&artStats(l,s).mastered){ a.done=true; a.doneAt=now; a.rechecks=0; a.recheckAt=now+RECHECK[0]*DAY; markPlan("coach",a.id); save(); } } });
  const open=Object.values(C).filter(a=>!a.done), due=Object.values(C).filter(a=>a.done&&a.recheckAt&&a.recheckAt<=now), done=Object.values(C).filter(a=>a.done&&!(a.recheckAt&&a.recheckAt<=now));
  if(!open.length&&!due.length) box.append(el("p",{class:"muted"},t("coach_none")));
  [...due,...open].forEach(a=>{ const rc=a.done; const need=rc?1:STREAK;
    const r=el("div",{class:"planitem"},`<span class="ck">${rc?"🔁":"🏋"}</span><span class="grow"><b>${esc(coachName(a.id))}</b>${rc?` <span class="tag due">${t("coach_recheck")}</span>`:""}<br>

    const b=el("button",{class:"b sm warm"},t("coach_train")); b.onclick=()=>coachGo(a.id); r.append(b); box.append(r); });
  if(done.length){ const d=el("details",{},`<summary>✓ ${t("coach_done_list",{n:done.length})}</summary>`); done.forEach(a=>d.append(el("p",{class:"muted"},`✓ ${esc(coachName(a.id))}${a.recheckAt?" – "+t("coach_next_check",{d:new Date(a.recheckAt).toLocaleDateString(SET.ui)}):" – "+t("coach_retired")}`))); box.append(d); }

function coachGoalShort(id){ if(DRILLS[id]&&DRILLS[id].goal) return DRILLS[id].goal(); if(id.startsWith("art:")) return t("cg_art"); if(id.startsWith("sup:")) return t("cg_sup"); return t("cg_"+id); }
function coachGo(id){
  if(id.startsWith("art:")){ const [l,s]=id.slice(4).split("|"); if(SET.tl!==l) setTl(l); SP.snd=s; SP.pos="i"; SP.idx=0; show("speech"); renderSpeech(); scrollToId("serBox"); return; }

/* ---------- drill runner (overlay) ---------- */
let CR=null;
function markupText(s){ return esc(s).replace(/\*([^*]+)\*/g,"<b class='stress'>$1</b>").replace(/ \/ /g," <span class='pmark'>⏸</span> "); }
const plainText=s=>s.replace(/\*/g,"").replace(/ \/ /g," ");
function openCoach(id){
  const def=DRILLS[id]; if(!def) return; const a=coachStore()[id]||null;
  CR={id,def,lang:SET.tl,i:a&&a.ti?a.ti%def.texts(SET.tl,a).length:0};
  $("#coachSheet").classList.remove("hidden"); document.body.style.overflow="hidden"; renderCoach();
}
function closeCoach(){ stopRecognition(); try{speechSynthesis.cancel();}catch(e){} if(CR&&CR.guide) clearInterval(CR.guide); CR=null; $("#coachSheet").classList.add("hidden"); document.body.style.overflow=""; renderCoachList(); renderPlan(); }
function renderCoach(res){
  const R=CR, def=R.def, a=coachStore()[R.id], texts=def.texts(R.lang,a), text=texts[R.i%texts.length];
  const rc=a&&a.done&&a.recheckAt&&a.recheckAt<=Date.now(), need=rc?1:STREAK, streak=a?a.streak:0;
  const box=$("#coachBody");
  box.innerHTML=`<div class="row"><h2 class="grow" style="margin:0">🏋 ${esc(t("cd_"+R.id))}</h2><button class="b sm alt" id="coachClose">${t("close")}</button></div>
    ${a&&a.src&&(!a.srcLang||a.srcLang===SET.ui)?`<p class="muted">${t("coach_why",{s:esc(a.src)})}</p>`:""}
    <div class="okbox"><b>${t("coach_goal")}:</b> ${esc(coachGoalShort(R.id))} ${rc?t("coach_goal_rc"):t("coach_goal_n",{n:need})}</div>
    <div class="row" style="margin:8px 0"><span class="dots big">${[...Array(need)].map((_,k)=>`<i class="${k<streak?'on':''}"></i>`).join("")}</span><span class="muted">${t("coach_streak",{a:streak,n:need})} · ${t("coach_tries",{n:a?a.attempts:0})}</span></div>
    <details ${a&&a.attempts?"":"open"}><summary>${t("coach_how")}</summary><ul class="list">${(def.how?def.how():t("ch_"+R.id)).split("|").map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
    ${!def.needSR||srLang()?"":`<div class="warnbox">${t("coach_nosr")}</div>`}
    <div class="muted" style="margin-top:8px">${t(def.kind==="prompt"?"coach_answer":"coach_read",{l:langIn(R.lang)})} (${(R.i%texts.length)+1}/${texts.length})</div>
    <div class="card flat reader" ${tlAttr(R.lang)} id="coachText" style="font-size:1.25rem;line-height:1.6">${def.kind==="prompt"?`<b>${esc(text)}</b>`:markupText(text)}</div>
    <div class="row">${def.model||def.kind==="prompt"?`<button class="b sm alt" id="coachModel">🔊 ${t(def.kind==="prompt"?"coach_hear_q":"coach_model")}</button>`:""}${def.guide?`<button class="b sm alt" id="coachGuide">▶ ${t("coach_guide",{w:def.guide})}</button>`:""}<button class="b sm alt" id="coachOther">↻ ${t("coach_other")}</button></div>
    <div id="coachPat" style="margin-top:6px"></div><div id="coachRec" style="margin-top:8px"></div><div id="coachRes"></div>`;
  $("#coachClose").onclick=closeCoach;
  $("#coachOther").onclick=()=>{ R.i++; renderCoach(); };
  if($("#coachModel")) $("#coachModel").onclick=()=>speak(plainText(text),R.lang,null,def.kind==="prompt"?null:0.9,def.kind==="prompt"?null:"model");
  if($("#coachGuide")) $("#coachGuide").onclick=()=>guideText(def.guide);
  const recBox=$("#coachRec");
  R.pan=null; if(def.prate&&typeof textTemplate==="function"){ const tpl=textTemplate(text,R.lang,def.prate); R.pan=patternPanel($("#coachPat"),tpl,{band:R.id==="tone"?voiceTarget():null}); }
  const ctl=recControls(recBox,{lang:srLang()?R.lang:null,maxSec:def.maxSec||60,onStart:()=>R.pan&&R.pan.reset(),onPitch:R.pan?(f,s,db)=>R.pan.onPitch(f,s,db):null,onDone:r=>coachDone(r,text)});

    const go=el("button",{class:"b warm",style:"width:100%;margin-top:6px"},"▶ "+t("coach_q_start")); recBox.prepend(go); recBox.querySelector("[data-rec]").classList.add("hidden");

  }

}
function guideText(wpm){ const R=CR, box=$("#coachText"); if(!box) return; if(R.guide){ clearInterval(R.guide); R.guide=null; }
  const raw=plainText(R.def.texts(R.lang,coachStore()[R.id])[R.i%R.def.texts(R.lang,coachStore()[R.id]).length]).split(/\s+/);
  box.innerHTML=raw.map(w=>`<span>${esc(w)}</span>`).join(" "); let k=0; const sp=box.children;
  const step=()=>{ if(k>0){ sp[k-1].classList.remove("now"); sp[k-1].classList.add("done"); } if(k>=sp.length){ clearInterval(R.guide); R.guide=null; return; } sp[k].classList.add("now"); k++; };
  step(); R.guide=setInterval(step,60000/wpm); }
function coachDone(r,text){
  const R=CR; if(!R) return; if(R.guide){ clearInterval(R.guide); R.guide=null; }
  const def=R.def, an=analyze(r.pcm,{minSpeech:def.kind==="words"?40:80}), sr=r.sr.text?r.sr:null;
  const tips=makeTips(an,{sr,lang:R.lang,expected:def.kind==="prompt"?null:plainText(text),statements:R.id!=="melody"});
  const take={blob:r.blob,an,tips,kind:"coach-"+R.id,title:t("cd_"+R.id),lang:R.lang,text:sr?sr.text:""};
  const wrap=el("div");
  const finish=m=>{ const out=coachAttempt(R.id,m.pass,m.v); const a=out?out.a:null;
    const head=el("div",{class:m.pass?"okbox":"warnbox",style:"margin-top:8px"},`<div style="font-size:1.3rem;font-weight:800">${m.pass?"✓ "+t("coach_pass"):"✗ "+t("coach_fail")}</div><div>${esc(m.txt)}</div>
      <div style="margin-top:4px"><b>${m.pass?t("coach_next_pass"):t("coach_next_fail")}</b> ${esc(m.pass?t(def.next||("cn_"+R.id)):t(m.fb||("cf_"+R.id)))}</div>`);
    wrap.prepend(head);
    if(out&&out.achieved){ beep(1320,.35,.12); wrap.prepend(el("div",{class:"okbox",style:"font-size:1.1rem"},`🏆 <b>${out.rc?t("coach_rc_ok",{d:out.a.recheckAt?Math.round((out.a.recheckAt-Date.now())/DAY):0}):t("coach_achieved",{d:RECHECK[0]})}</b>`)); }
    const nb=el("div",{class:"row",style:"margin-top:8px"});
    const nxt=el("button",{class:"b grow"},t("coach_next_text")); nxt.onclick=()=>{ R.i++; if(a) a.ti=R.i; save(); renderCoach(); };
    const same=el("button",{class:"b alt grow"},t("coach_same")); same.onclick=()=>renderCoach();
    nb.append(same,nxt); wrap.append(nb); renderCoach(wrap); $("#coachRes").scrollIntoView({behavior:"smooth"}); };
  const pres=R.pan&&an.ok?R.pan.evaluate(an):null;
  if(pres) wrap.append(patternResultBox(pres,dw=>{ const res=$("#coachRes"); res.innerHTML=""; const hold=el("div"); res.append(hold); wordDrill(hold,Object.assign({dw,lang:R.lang,onBack:()=>renderCoach()},pres.ctx)); }));
  wrap.append(replayView(take,{onSave:()=>saveTake(take),noRegister:true}));
  if(!an.ok){ finish({pass:false,v:null,txt:an.noVoice?t("tip_noise"):t("tip_short")}); return; }
  if(def.needSR&&!sr){ /* self-assessment fallback */
    const q=el("div",{class:"card",style:"margin-top:8px"},`<p><b>${t(R.id==="fillers"?"coach_self_fill":"coach_self_clear")}</b></p><div class="chips"></div>`);
    const opts=R.id==="fillers"?[[0,"0"],[1,"1"],[2,"2"],[3,"3+"]]:[[1,"✓ "+t("ser_ok")],[0,"✗"]];
    chipSet(q.querySelector(".chips"),opts,null,v=>{ q.remove(); const n=+v; finish(R.id==="fillers"?{pass:n===0&&an.speak>=12,v:n,txt:t("cm_fillers",{n,s:Math.round(an.speak)})}:{pass:n===1,v:n,txt:n?t("ser_ok"):t("coach_fail")}); });
    wrap.prepend(q); renderCoach(wrap); return; }
  finish(def.metric(an,{text,sr,lang:R.lang}));
}

/* ---- targets by gender and age (typical adult speaking-pitch ranges; conservative, never extreme) ---- */
function voiceTarget(){
  const g=SET.gender, a=+SET.age||0;
  if(!g||g==="n"||(a&&a<12)) return null;
  if(g==="m"){ if(a&&a<18) return {lo:90,hi:170,note:"tone_teen_m"}; if(a>=60) return {lo:95,hi:145,note:"tone_senior_m"}; return {lo:85,hi:135}; }
  if(a&&a<18) return {lo:185,hi:260}; if(a>=50) return {lo:160,hi:230,note:"tone_senior_f"}; return {lo:165,hi:240};
}
function toneMetric(an){
  const tg=voiceTarget()||{lo:0,hi:9999}, f=an.f0med, inB=f>=tg.lo&&f<=tg.hi;
  const pass = SET.gender==="f" ? inB&&an.sdSt>=2.8 : inB&&an.uptalk.length===0;
  const fb = !inB ? (f<tg.lo?"cf_tone_low":"cf_tone_high") : (SET.gender==="f"&&an.sdSt<2.8?"cf_tone_mel":"cf_tone_up");
  return {v:f,pass,fb,txt:t("cm_tone",{f:Math.round(f),lo:tg.lo,hi:tg.hi,v:f1(an.sdSt),u:an.uptalk.length})};
}
DRILLS.tone={dim:"melody",kind:"read",model:true,texts:l=>SET.gender==="f"?CT.melody[l].concat(CT.pauses[l]):CT.statements[l].concat(CT.endings[l]),metric:toneMetric,
  goal:()=>{ const tg=voiceTarget(); return tg?t(SET.gender==="f"?"cg_tone_f":"cg_tone_m",tg):t("tone_target_none"); },
  how:()=>t(SET.gender==="f"?"ch_tone_f":"ch_tone_m"), next:"cn_tone", prate:4.0};

ROUTINES.push({g:"m",name:{en:"Resonance – masculine voice",de:"Resonanz – männlicher Klang",fr:"Résonance – voix masculine"},steps:[
 [45,{en:["Open throat","Start a yawn with closed lips and feel the wide space in the throat. Then sigh “hmm” from a comfortable middle pitch down.","A relaxed, low larynx gives a fuller sound."],de:["Weiter Hals","Mit geschlossenen Lippen ein Gähnen beginnen und den weiten Raum im Hals spüren. Dann von mittlerer Tonhöhe aus „hmm“ nach unten seufzen.","Ein entspannter, tief stehender Kehlkopf gibt einen volleren Klang."],fr:["Gorge ouverte","Commencez un bâillement lèvres fermées et sentez l'espace large dans la gorge. Puis soupirez « hmm » d'une hauteur moyenne vers le grave.","Un larynx détendu et bas donne un son plus plein."]}],
 [60,{en:["Chest humming","Hand on your chest. Hum “mmm” in the lower, comfortable part of your voice until you feel the vibration under your hand. 5 long breaths.","Trains chest resonance – the basis of a full, masculine sound."],de:["Brustsummen","Hand auf die Brust. „mmm“ im unteren, bequemen Teil deiner Stimme summen, bis du die Vibration unter der Hand spürst. 5 lange Atemzüge.","Trainiert die Brustresonanz – die Grundlage eines vollen, männlichen Klangs."],fr:["Fredonnement de poitrine","Main sur la poitrine. Fredonnez « mmm » dans la partie basse et confortable de votre voix jusqu'à sentir la vibration sous la main. 5 longues respirations.","Entraîne la résonance de poitrine – la base d'un son plein et masculin."]}],
 [60,{en:["Hum into words","“mmm-one, mmm-two, mmm-three …” up to ten: keep the chest vibration from the hum in each number.","Transfers the resonance to speech."],de:["Vom Summen ins Wort","„mmm-eins, mmm-zwei, mmm-drei …“ bis zehn: die Brustvibration des Summens in jede Zahl mitnehmen.","Überträgt die Resonanz auf die Sprache."],fr:["Du fredonnement aux mots","« mmm-un, mmm-deux, mmm-trois… » jusqu'à dix : gardez la vibration de poitrine dans chaque nombre.","Transfère la résonance à la parole."]}],
 [60,{en:["Falling statements","Say short statements and let the voice clearly fall at the end: “I'll do it.” “That's correct.” “See you tomorrow.” Calm, unhurried.","Falling endings sound decisive and calm."],de:["Fallende Aussagen","Kurze Aussagen sprechen und die Stimme am Ende deutlich fallen lassen: „Ich mache das.“ „Das stimmt.“ „Bis morgen.“ Ruhig, ohne Eile.","Fallende Enden klingen entschieden und ruhig."],fr:["Affirmations descendantes","Dites de courtes affirmations en faisant nettement descendre la voix : « Je m'en occupe. » « C'est exact. » « À demain. » Calmement, sans hâte.","Les fins descendantes sonnent décidées et calmes."]}],

function textTemplate(text,lang,rate,amp){

  const toks=text.split(/\s+/).filter(Boolean), syl=[], words=[], pauses=[]; let t=0, phrase=[];
  const flush=type=>{ const n=phrase.length; phrase.forEach((s,i)=>{ let st=1.5-2.5*(i/Math.max(1,n-1)); if(s.stress) st+=4;
      if(i===n-1){ if(type==="?") st+=5; else if(type===",") st+=1; else st-=2.5; } s.st=st*amp; }); phrase=[]; };
  toks.forEach(tok=>{
    if(tok==="/"){ flush(","); pauses.push({s:t,e:t+0.8}); t+=0.8; return; }
    if(/^[–—-]$/.test(tok)){ flush(","); pauses.push({s:t,e:t+0.3}); t+=0.3; return; }
    const stress=tok.includes("*"), w=tok.replace(/\*/g,""), clean=w.replace(/[^\p{L}\p{N}'’-]/gu,""); if(!clean) return;
    const n=Math.max(1,sylCount(clean,lang)); words.push({t,w:clean});

    const pm=w.match(/[.!?,;:]$/);
    if(pm){ const ty=pm[0]==="?"?"?":/[,;:]/.test(pm[0])?",":"."; flush(ty); const pd=ty===","?0.3:0.6; pauses.push({s:t,e:t+pd}); t+=pd; }

function clipTemplate(an){

  S.f0.forEach((f,k)=>{ const tt=k*S.hop-an.first; if(f>0&&tt>=0&&tt<=an.total) pts.push({t:tt,st:12*Math.log2(f/med)}); });

function patternPanel(box,tpl,{center=patternCenter(),band=voiceTarget(),relative=false}={}){

  const draw=(cursor)=>{
    const dpr=window.devicePixelRatio||1, W=cv.clientWidth*dpr, H=190*dpr; if(!W) return; if(cv.width!==W){ cv.width=W; cv.height=H; }
    const g=cv.getContext("2d"); g.clearRect(0,0,W,H);

const WD_STREAK=3, WD_TOL=1.5;
/* word span inside a text template */
function wordSpan(tpl,idx){ const w=tpl.words[idx], nx=tpl.words[idx+1]; let t1=nx?nx.t:tpl.dur; tpl.pauses.forEach(p=>{ if(p.s>w.t&&p.s<t1) t1=p.s; }); return {w:w.w,t0:w.t,t1}; }
/* box with the pattern result + "practise this word" button */
function patternResultBox(res,onWord){
  const box=el("div",{},patternResultHtml(res));
  if(res&&res.devWord&&onWord){ const b=el("button",{class:"b warm",style:"width:100%;margin-top:6px"},t("wd_train",{w:res.devWord.w})); b.onclick=()=>onWord(res.devWord); box.append(b); }
  return box;
}
function wordDrill(box,{dw,tpl,center,relative,ownMed,lang,onBack}){
  const sub={dur:Math.max(0.3,dw.t1-dw.t0),pts:tpl.pts.filter(p=>p.t>=dw.t0-0.01&&p.t<=dw.t1+0.01).map(p=>({t:p.t-dw.t0,st:p.st})),words:[{t:0,w:dw.w}],pauses:[],src:"word"};
  const tMean=sub.pts.reduce((a,p)=>a+p.st,0)/Math.max(1,sub.pts.length), tSlope=sub.pts.length>1?sub.pts[sub.pts.length-1].st-sub.pts[0].st:0;
  const base=relative?(ownMed||center):center; let streak=0;
  const render=(msg)=>{
    box.innerHTML=`<div class="card" style="border:2px solid var(--accent2);margin-top:8px"><div class="row"><h3 class="grow" style="margin:0">🎯 ${esc(t("wd_title",{w:dw.w}))}</h3><button class="b sm alt" data-back>${t("wd_back")}</button></div>
      <p>${esc(t(dw.d<0?"wd_how_up":"wd_how_down",{w:dw.w}))}</p><p class="muted">${t("wd_goal",{n:WD_STREAK})}</p>
      <div class="row"><span class="dots big">${[...Array(WD_STREAK)].map((_,k)=>`<i class="${k<streak?'on':''}"></i>`).join("")}</span><span class="muted">${t("wd_streak",{a:streak,n:WD_STREAK})}</span></div>
      <div class="huge" ${tlAttr(lang)} style="font-size:2.4rem;padding:8px">${esc(dw.w)}</div>
      <button class="b sm alt" data-model>${t("wd_model")}</button>
      <div data-p style="margin-top:6px"></div><div data-r></div><div data-m>${msg||""}</div></div>`;
    box.querySelector("[data-back]").onclick=()=>onBack&&onBack();
    box.querySelector("[data-model]").onclick=()=>speak(dw.w,lang,null,0.75,"model",Math.pow(2,tMean/24));
    const pan=patternPanel(box.querySelector("[data-p]"),sub,{center:base,band:null,relative:false});
    recControls(box.querySelector("[data-r]"),{maxSec:8,onStart:()=>pan.reset(),onPitch:(f,s,db)=>pan.onPitch(f,s,db),onDone:r=>{
      const an=analyze(r.pcm,{minSpeech:15}); if(!an.ok||!an.f0med){ render(`<div class="warnbox">${t("wd_none")}</div>`); return; }
      pan.evaluate(an);
      const S=an.series, v=[]; S.f0.forEach((f,k)=>{ if(f>0) v.push({t:k*S.hop,st:12*Math.log2(f/base)}); });
      const uMean=v.reduce((a,p)=>a+p.st,0)/v.length, diff=uMean-tMean;
      const uSlope=v.length>4?(v.slice(-3).reduce((a,p)=>a+p.st,0)/3)-(v.slice(0,3).reduce((a,p)=>a+p.st,0)/3):0;
      const slopeOk=Math.abs(tSlope)<2||Math.sign(uSlope)===Math.sign(tSlope);
      const ok=Math.abs(diff)<=WD_TOL&&slopeOk; streak=ok?streak+1:0; beep(ok?990:520,.12,.1);
      let m=`<div class="${ok?"okbox":"warnbox"}" style="margin-top:6px"><b>${ok?t("wd_ok"):diff<0?t("wd_up"):t("wd_down")}</b> – ${esc(t("wd_res",{w:dw.w,d:f1(Math.abs(diff)),dir:t(diff<0?"wd_below":"wd_above")}))}${slopeOk?"":"<br>"+t("wd_slope")}</div>`;
      if(streak>=WD_STREAK){ m+=`<div class="okbox" style="margin-top:6px;font-size:1.05rem">🏆 ${esc(t("wd_done",{w:dw.w}))}</div>`; logSession(t("wd_title",{w:dw.w}),1); }
      render(m);
      if(streak>=WD_STREAK){ const bb=el("button",{class:"b",style:"width:100%;margin-top:6px"},t("wd_back")); bb.onclick=()=>onBack&&onBack(); box.querySelector("[data-m]").append(bb); }
    }});
  };
  render(); box.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---- voice types (MIDI note numbers; 60 = C4 ≈ 262 Hz) ---- */
const VTYPES={S:[60,81],M:[57,77],A:[53,74],T:[48,69],Bar:[45,65],B:[40,64]};
const PART_OF={S:"S",M:"S",A:"A",T:"T",Bar:"B",B:"B"};
const NOTE_NAMES={en:["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"],de:["C","Cis","D","Es","E","F","Fis","G","As","A","B","H"],fr:["do","do♯","ré","mi♭","mi","fa","fa♯","sol","la♭","la","si♭","si"]};
const nName=m=>NOTE_NAMES[SET.ui][((m%12)+12)%12]+(Math.floor(m/12)-1);
function voiceType(){ if(SET.vtype) return SET.vtype; return SET.gender==="m"?"Bar":SET.gender==="f"?"M":"A"; }
function vRange(){ const r=SET.vrange; if(r) return r; const v=VTYPES[voiceType()]; return [v[0]+2,v[1]-3]; }

/* ---- synth: soft piano/organ tone ---- */
function synthNote(c,midi,t0,dur,vol,organ){
  const f=midiToHz(midi), g=c.createGain(), o1=c.createOscillator(), o2=c.createOscillator(), g2=c.createGain();
  o1.type="triangle"; o2.type="sine"; o1.frequency.value=f; o2.frequency.value=f*2; g2.gain.value=organ?0.35:0.2;
  o1.connect(g); o2.connect(g2).connect(g); g.connect(outOf(c));
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+0.02);
  if(!organ) g.gain.exponentialRampToValueAtTime(vol*0.45,t0+Math.min(0.4,dur*0.6)); g.gain.setValueAtTime(organ?vol:vol*0.45,t0+Math.max(0.05,dur-0.08)); g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  o1.start(t0); o2.start(t0); o1.stop(t0+dur+0.05); o2.stop(t0+dur+0.05);
}
function click(c,t0,hi){ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=hi?1600:1100; g.gain.setValueAtTime(0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.06); o.connect(g).connect(outOf(c)); o.start(t0); o.stop(t0+0.08); }

/* ---- generic singing session: plays accompaniment, records pitch, evaluates target notes ----
   acc: [{m,t,d,v,organ}] ; targets: [{m,t,d,label}] (seconds after start); countIn beats; onLive(f,tRel) */
/* audio output of the running session/preview: everything goes through one gain node, so Stop silences it at once */
let AOUT=null; function outOf(c){ return AOUT&&AOUT.context===c?AOUT:c.destination; }
const SESS={on:false,paused:false,stopped:false};
function sessBar(show){ let b=document.getElementById("sessBar");
  if(!show){ if(b) b.remove(); return; }
  if(!b){ b=el("div",{id:"sessBar",style:"position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18)"});
    b.innerHTML=`<button class="b grow" data-p>⏸ ${t("pause")}</button><button class="b warm grow" data-s>■ ${t("sess_stop")}</button>`; document.body.append(b);
    b.querySelector("[data-p]").onclick=()=>sessPause(!SESS.paused); b.querySelector("[data-s]").onclick=()=>sessStop(); }
  b.querySelector("[data-p]").innerHTML=SESS.paused?"▶ "+t("sess_resume"):"⏸ "+t("pause"); }
function sessPause(on){ if(!SESS.on) return; const c=ac(); SESS.paused=on; if(on){ c.suspend(); try{ GUIDE&&GUIDE.el&&GUIDE.el.pause(); }catch(e){} } else { c.resume(); try{ GUIDE&&GUIDE.el&&GUIDE.el.currentTime>0&&GUIDE.el.play(); }catch(e){} } sessBar(true); }
function sessStop(){ if(!SESS.on) return; SESS.stopped=true; if(SESS.paused){ SESS.paused=false; ac().resume(); } try{ AOUT&&AOUT.disconnect(); }catch(e){} try{ typeof stopGuide==="function"&&stopGuide(); }catch(e){} }
/* ---- generic singing session on the audio clock (pausable): plays accompaniment, records pitch, evaluates target notes ----
   acc: [{m,t,d,v,organ|voice|vib|buf}] ; targets: [{m,t,d,label}] (s after start); cues: [{t,fn}] ; countIn beats; onLive(f,tRel) */
async function singSession({acc,targets,countIn=0,beat=0.6,total,onLive,onPhase,onStart,cues=[]}){

  const c=ac(), pts=[]; let take, start=null;
  try{ take=await startTake({capture:false,onPitch:(f,sec,db)=>{ if(start===null||SESS.paused) return; const rel=c.currentTime-start; pts.push({t:rel,f:db>-58?f:0,db}); onLive&&onLive(f,rel,db); }}); }catch(e){ micError(e); toast(t("mic_fail")); return null; }
  AOUT=c.createGain(); AOUT.connect(c.destination); SESS.on=true; SESS.paused=false; SESS.stopped=false; sessBar(true);
  const lead=0.35+countIn*beat, cNow=c.currentTime; start=cNow+lead; SESS.t0=start;
  for(let k=0;k<countIn;k++) click(c,cNow+0.35+k*beat,k===0);
  acc.forEach(n=>n.buf?(()=>{ const src=c.createBufferSource(), g=c.createGain(); src.buffer=n.buf; g.gain.value=n.v||0.8; src.connect(g).connect(outOf(c)); src.start(start+n.t,n.off||0,n.d); })():n.voice&&typeof synthVoice==="function"?synthVoice(c,n.m,start+n.t,n.d,n.v||0.08):n.vib!=null&&typeof synthVib==="function"?synthVib(c,n.m,start+n.t,n.d,n.v||0.12,n.vib):synthNote(c,n.m,start+n.t,n.d,n.v||0.12,n.organ)); onStart&&onStart(lead);
  const Q=cues.slice(); if(onPhase) targets.forEach((n,i)=>Q.push({t:n.t,fn:()=>onPhase(i,n)})); Q.sort((a,b)=>a.t-b.t);
  keepAwake(true);
  await new Promise(r=>{ const tick=()=>{ if(SESS.stopped) return r(); const rel=c.currentTime-start; while(Q.length&&Q[0].t<=rel){ try{ Q.shift().fn(); }catch(e){} } if(rel>=total+0.4) return r(); setTimeout(tick,30); }; tick(); });
  const r=await take.stop(); keepAwake(false); const stopped=SESS.stopped; SESS.on=false; SESS.paused=false; sessBar(false); setTimeout(()=>{ try{ AOUT&&AOUT.disconnect(); }catch(e){} AOUT=null; },Math.max(0,(acc.reduce((a,n)=>Math.max(a,n.t+n.d),0)-(c.currentTime-start))*1000)+300);
  if(stopped){ toast(t("sess_stopped")); return null; }
  const res=targets.map(n=>{ const a=n.t+Math.min(0.25,n.d*0.25), b=n.t+n.d*0.88, v=pts.filter(p=>p.t>=a&&p.t<=b&&p.f>0).map(p=>p.f);
    if(v.length<3) return Object.assign({},n,{ok:false,miss:true});
    const fm=pctl(v,0.5); let cents=1200*Math.log2(fm/midiToHz(n.m)), oct=false; if(Math.abs(cents)>900&&Math.abs(Math.abs(cents)-1200)<150){ cents-=Math.sign(cents)*1200; oct=true; }
    const cs=v.map(f=>{ let x=1200*Math.log2(f/midiToHz(n.m)); if(oct) x-=Math.sign(x)*1200; return x; }), mc=cs.reduce((x,y)=>x+y,0)/cs.length, sd=Math.sqrt(cs.reduce((x,y)=>x+(y-mc)*(y-mc),0)/cs.length);
    const near=p=>p.f>0&&Math.abs((((1200*Math.log2(p.f/midiToHz(n.m))%1200)+1800)%1200)-600)<=50;
    const hit=pts.find(p=>p.t>=n.t-0.2&&p.t<=n.t+n.d&&near(p)), lat=hit?hit.t-n.t:null;
    const tail=pts.filter(p=>p.t>=n.t+n.d*0.6&&p.t<=n.t+n.d*0.92), sus=tail.length?tail.filter(p=>p.f>0).length/tail.length:0;
    const vd=pts.filter(p=>p.t>=a&&p.t<=b&&p.f>0).map(p=>p.db), dbm=vd.length?pctl(vd,0.5):null, endv=pts.filter(p=>p.t>=n.t+n.d*0.65&&p.t<=n.t+n.d*0.92&&p.f>0).map(p=>p.db), dbe=endv.length?pctl(endv,0.5):null;
    return Object.assign({},n,{cents:Math.round(cents),sd,oct,lat,sus,dbm,dbe,ok:Math.abs(cents)<=30&&!oct}); });
  return {res,pts,blob:r.blob,pcm:r.pcm};
}
/* note lane using the pattern panel: green bars = targets, orange = live pitch */
function laneTemplate(targets,refM){ const pts=[]; targets.forEach(n=>{ for(let k=0;k<=4;k++) pts.push({t:n.t+n.d*(0.05+0.9*k/4),st:n.m-refM}); }); return {dur:Math.max(...targets.map(n=>n.t+n.d)),pts,words:targets.map(n=>({t:n.t,w:n.label||""})),pauses:[],src:"notes"}; }
function laneView(box,targets,refM){ const pan=patternPanel(box,laneTemplate(targets,refM),{center:Math.round(midiToHz(refM)),band:null}); box.querySelector(".muted").remove(); return pan; }
function resultList(res){ return `<div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0">${res.map(n=>`<span class="kp ${n.ok?"hit":"miss"}" title="${n.miss?t("nt_miss"):n.cents+" ct"}">${esc(n.label||nName(n.m))} ${n.miss?"–":n.oct?"8va":(n.cents>0?"+":"")+n.cents}</span>`).join("")}</div>`; }

  if(m<-20) out.push(t("nt_flat",{c:Math.round(m)})); else if(m>20) out.push(t("nt_sharp",{c:Math.round(m)})); if(v.some(n=>n.sd>40)) out.push(t("nt_unsteady")); return out; }

/* ---- 1 voice type ---- */
function renderVType(){
  const box=$("#vtBody"); if(!box) return; const r=SET.vrange, v=voiceType();
  box.innerHTML=`<p class="muted">${t("vt_desc")}</p><p><b>${r?t("vt_result",{lo:nName(r[0]),hi:nName(r[1]),n:r[1]-r[0],v:t("v_"+v)}):t("vt_none",{v:t("v_"+v)})}</b></p>
    <div data-step></div><div class="row"><span class="muted">${t("vt_choose")}</span><div class="chips" data-ch></div></div>`;
  chipSet(box.querySelector("[data-ch]"),Object.keys(VTYPES).map(k=>[k,t("v_"+k)]),v,k=>{ SET.vtype=k; if(!SET.vrangeMeasured) SET.vrange=null; save(); renderChoir(); });
  const st=box.querySelector("[data-step]"); let low=null;
  const step=n=>{ st.innerHTML=`<p><b>${t(n===1?"vt_low":"vt_high")}</b></p><div data-r></div>`;
    recControls(st.querySelector("[data-r]"),{maxSec:15,label:n===1?"● "+t("vt_low").split(":")[0]:"● "+t("vt_high").split(":")[0],onDone:rr=>{ const an=analyze(rr.pcm,{minSpeech:40}); const v2=Array.from(an.series?an.series.f0:[]).filter(f=>f>0);
      if(v2.length<10){ toast(t("tip_short")); return; }
      if(n===1){ low=Math.round(hzToMidi(pctl(v2,0.05))); step(2); }
      else { const hi=Math.round(hzToMidi(pctl(v2,0.95))), lo=Math.min(low,hi-6); SET.vrange=[lo,hi]; SET.vrangeMeasured=true;
        const cand=Object.keys(VTYPES).filter(k=>SET.gender==="m"?["T","Bar","B"].includes(k):SET.gender==="f"?["S","M","A"].includes(k):true);
        SET.vtype=cand.sort((a,b)=>(Math.abs(VTYPES[a][0]-lo)+Math.abs(VTYPES[a][1]-hi))-(Math.abs(VTYPES[b][0]-lo)+Math.abs(VTYPES[b][1]-hi)))[0]; save(); renderChoir(); } }}); };
  const b=el("button",{class:"b"+(r?" alt":""),style:"width:100%"},r?t("vt_redo"):"▶ "+t("vt_title").replace(/^1 · /,"")); b.onclick=()=>step(1); st.append(b);
}

/* ---- 3 note accuracy (call & response) ---- */
const EXER={five:[0,2,4,5,7,5,4,2,0],triad:[0,4,7,12,7,4,0],int:[0,7,0,12,0],third:[0,4,2,5,4,7,5,9,7],long:[0,7,4]};
let NT={ex:"five",shift:0,round:0,only:null};
const KEYPC=[0,2,4,5,7,9,10]; function niceKey(m){ while(!KEYPC.includes(((m%12)+12)%12)) m--; return m; }
function ntRoot(){ const [lo,hi]=vRange(), span=Math.max(...EXER[NT.ex])-Math.min(...EXER[NT.ex]); return niceKey(Math.max(lo+2,Math.min(hi-span-1,lo+3)))+NT.shift; }
function renderNotes(){
  const box=$("#ntBody"); if(!box) return; const root=ntRoot();
  box.innerHTML=`<p class="muted">${t("nt_desc")}</p><div class="chips" data-ex></div>
    <div class="row"><b class="grow">${t("nt_key",{n:nName(root)})}</b><button class="b sm alt" data-dn>${t("nt_down")}</button><button class="b sm alt" data-up>${t("nt_up")}</button></div>
    <div class="beatdot" data-dot style="width:auto;height:auto;padding:14px;border-radius:16px;font-size:1.3rem">–</div><div data-lane></div>
    <button class="b warm" style="width:100%" data-go>${t("nt_start")}</button><div data-out></div>`;
  chipSet(box.querySelector("[data-ex]"),Object.keys(EXER).map(k=>[k,t("ex_"+k)]),NT.ex,k=>{ NT.ex=k; NT.round=0; NT.only=null; renderNotes(); });
  box.querySelector("[data-up]").onclick=()=>{ NT.shift++; renderNotes(); }; box.querySelector("[data-dn]").onclick=()=>{ NT.shift--; renderNotes(); };
  box.querySelector("[data-go]").onclick=()=>runNotes(box);
}
async function runNotes(box){
  const root=ntRoot(), seq=(NT.only||EXER[NT.ex].map(x=>root+x)), long=NT.ex==="long", play=0.9, gap=0.15, sing=long?2.6:1.5, step=play+gap+sing+0.25;
  const acc=[], targets=[]; seq.forEach((m,i)=>{ acc.push({m,t:i*step,d:play,v:0.16}); targets.push({m,t:i*step+play+gap,d:sing,label:nName(m)}); });
  const go=box.querySelector("[data-go]"), dot=box.querySelector("[data-dot]"); go.disabled=true;

  const cues=seq.map((m,i)=>({t:i*step,fn:()=>{ dot.classList.remove("on"); dot.textContent=t("nt_listen"); }}));
  const out=await singSession({acc,targets,cues,total:seq.length*step,onLive:(f,rel)=>{ if(targets.some(n=>rel>=n.t&&rel<=n.t+n.d)) lane.pushAt(f,rel); },
    onPhase:(i,n)=>{ dot.classList.add("on"); dot.textContent=t("nt_sing",{n:n.label}); }});
  go.disabled=false; dot.classList.remove("on"); dot.textContent="–"; if(!out) return;
  const ok=out.res.filter(n=>n.ok).length, all=ok===out.res.length; NT.round=all?NT.round+1:0;
  const o=box.querySelector("[data-out]"), tips=tendencyTips(out.res), wrong=out.res.filter(n=>!n.ok).map(n=>n.m);
  o.innerHTML=`<div class="${all?"okbox":"warnbox"}" style="margin-top:8px"><b>${t("nt_res",{c:ok,n:out.res.length})}</b> · ${t("nt_round",{a:NT.round,n:2})}${resultList(out.res)}${tips.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>
    ${NT.round>=2?`<div class="okbox" style="margin-top:6px">${t("nt_done")}</div>`:""}<div class="row" style="margin-top:6px" data-b></div>`;
  const rb=o.querySelector("[data-b]"), again=el("button",{class:"b grow"},t("nt_again")); again.onclick=()=>{ NT.only=null; runNotes(box); }; rb.append(again);
  if(wrong.length&&wrong.length<out.res.length){ const wb=el("button",{class:"b warm grow"},t("nt_wrong",{n:wrong.length})); wb.onclick=()=>{ NT.only=wrong; NT.round=0; runNotes(box); }; rb.append(wb); }

}

/* ---- 4 four-part chorale (G major; S A T B per chord) ---- */
const CHORALE=[{c:"I",S:71,A:67,T:62,B:55},{c:"IV",S:72,A:67,T:64,B:48},{c:"V",S:74,A:66,T:62,B:50},{c:"I",S:71,A:67,T:62,B:43},{c:"vi",S:71,A:67,T:64,B:52},{c:"IV",S:72,A:67,T:64,B:48},{c:"V7",S:72,A:66,T:62,B:50},{c:"I",S:71,A:67,T:62,B:43}];
let PT4={part:null,bpm:66};
function renderPart(){
  const box=$("#ptBody"); if(!box) return; const part=PT4.part||PART_OF[voiceType()];
  box.innerHTML=`<p class="muted">${t("pt_desc")}</p><div class="row"><span class="muted">${t("pt_part")}:</span><div class="chips" data-p></div></div>
    <div class="row"><span class="muted">${t("pt_slow")}:</span><div class="chips" data-t></div></div><div data-lane></div><button class="b warm" style="width:100%" data-go>${t("pt_go")}</button><div data-out></div>`;
  chipSet(box.querySelector("[data-p]"),[["S",t("v_S")],["A",t("v_A")],["T",t("v_T")],["B",t("v_B")]],part,v=>{ PT4.part=v; renderPart(); });
  chipSet(box.querySelector("[data-t]"),[[54,"54"],[66,"66"],[80,"80"]],PT4.bpm,v=>{ PT4.bpm=+v; renderPart(); });
  const [lo,hi]=vRange(), pm=CHORALE.map(ch=>ch[part]); let sh=0, best=1e9; for(let k=-7;k<=7;k++){ const over=Math.max(0,lo-(Math.min(...pm)+k))+Math.max(0,Math.max(...pm)+k-hi), sc=over*10+Math.abs(k); if(sc<best){ best=sc; sh=k; } }
  const beat=60/PT4.bpm, dur=2*beat, targets=CHORALE.map((ch,i)=>({m:ch[part]+sh,t:i*dur,d:dur,label:ch.c}));
  const lane=laneView(box.querySelector("[data-lane]"),targets,targets[0].m);
  box.querySelector("[data-go]").onclick=async()=>{ const go=box.querySelector("[data-go]"); go.disabled=true; lane.reset();
    const acc=[]; CHORALE.forEach((ch,i)=>["S","A","T","B"].filter(p=>p!==part).forEach(p=>acc.push({m:ch[p]+sh,t:i*dur,d:dur*0.98,v:0.06,organ:true})));
    const out=await singSession({acc,targets,countIn:4,beat,total:CHORALE.length*dur,onLive:(f,rel)=>{ if(rel>=0) lane.pushAt(f,rel); }});
    go.disabled=false; if(!out) return; const ok=out.res.filter(n=>n.ok).length, tips=tendencyTips(out.res);
    box.querySelector("[data-out]").innerHTML=`<div class="${ok===out.res.length?"okbox":"warnbox"}" style="margin-top:8px"><b>${t("pt_res",{c:ok,n:out.res.length})}</b>${resultList(out.res)}${tips.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>`;
    logSession(t("pt_title").replace(/^\d · /,""),Math.max(0.5,CHORALE.length*dur/60)); };
}

/* ---- 5 round: traditional melody (public domain), relative semitones & beats ---- */

 de:"Bru- der Ja- kob, Bru- der Ja- kob, schläfst du noch? schläfst du noch? Hörst du nicht die Glo- cken? Hörst du nicht die Glo- cken? Ding, dang, dong, ding, dang, dong.",

  const ALL=allSongs(); if(!SG.id||!ALL.find(x=>x.id===SG.id)){ const own=SONGS.find(s=>s.lyr[SET.tl]); SG.id=(own||SONGS[0]).id; }
  const s=ALL.find(x=>x.id===SG.id), l=songLang(s), st=sgStore(s.id), shift=songShift(s), bpm=SG.bpm||s.bpm;
  box.innerHTML=`<p class="muted">${t("sg_desc")}</p>
   <div class="row"><span class="muted">${t("sg_song")}:</span></div><div class="chips" data-s></div>
   <div class="row"><span class="muted">${t("sg_level")}:</span><div class="chips" data-l></div></div>
   <div class="row"><span class="muted">${t("pt_slow")}:</span><div class="chips" data-t></div><span class="muted">${t("sg_guide")}:</span><div class="chips" data-g></div></div>
   <p class="muted" style="font-size:.8rem">${s.my&&s.audio===undefined?`<span class="warnbox" style="display:block;margin-bottom:4px">${t("my_old")}</span>`:""}${s.my?"🎙 "+t("my_tag"):t("sg_lyr",{l:LANG_NAME[SET.ui][l]})+(s.lyr[SET.tl]?"":" "+t("sg_orig"))} · ${t("nt_key",{n:nName(60+shift)})} · ${t("sg_hist",{n:st.runs})}${st.best?" · "+t("sg_best",{p:st.best}):""}${Object.keys(st.mastered).length?" · "+t("sg_mastered",{l:Object.keys(st.mastered).map(k=>t("lv_"+k)).join(", ")}):""}</p>
   <div class="card flat" data-lyr ${tlAttr(l)} style="line-height:1.9;font-size:1.02rem"></div>
   ${SG.phrase!=null?`<div class="warnbox">${t("sg_phrase_mode",{n:SG.phrase+1,a:SG.phStreak})}</div>`:""}
   <div data-lane></div>
   ${s.my?`<div data-big></div><div class="row"><button class="b alt sm grow" data-led>📝 ${t(s.lyrics?"ly_edit":"ly_add")}</button>${s.lyrics&&s.audio?`<button class="b alt sm grow" data-lsync>⏱ ${t("ly_sync")}</button>`:""}</div>`:""}
   ${s.my?`<div class="row"><button class="b alt sm grow" data-syn>${t("my_hear_notes")}</button>${s.audio?`<button class="b alt sm grow" data-fix>${t("my_fix")}</button>`:""}</div>`:""}
   <div class="row"><button class="b alt grow" data-lis>${t("sg_listen")}</button><button class="b warm grow" data-go>${SG.phrase!=null?t("sg_phrase_go",{n:SG.phrase+1}):t("sg_go")}</button></div>
   ${SG.phrase!=null?`<button class="b alt sm" data-back style="margin-top:6px">${t("sg_back")}</button>`:""}<div data-out></div>${s.my?`<button class="b alt sm" data-del style="margin-top:8px">🗑 ${t("my_del")}</button>`:""}`;
  if(s.my) box.querySelector("[data-del]").onclick=()=>{ SongAudio.del(s.id); store.mySongs=(store.mySongs||[]).filter(x=>x.id!==s.id); save(); SG.id=null; SG.last=null; renderSongs(); };
  renderMySong(box);
  chipSet(box.querySelector("[data-s]"),ALL.slice().sort((a,b)=>(!!b.lyr[SET.tl]-!!a.lyr[SET.tl])||(!!a.my-!!b.my)).map(x=>[x.id,(x.my?"🎙 ":"")+songName(x)+(sgStore(x.id).mastered[SG.lv]?" ✓":"")]),s.id,v=>{ SG.id=v; SG.bpm=null; SG.phrase=null; SG.last=null; renderSongs(); });
  chipSet(box.querySelector("[data-l]"),["b","i","a"].map(k=>[k,t("lv_"+k)]),SG.lv,v=>{ SG.lv=v; renderSongs(); });
  chipSet(box.querySelector("[data-t]"),[Math.round(s.bpm*0.75),s.bpm,Math.round(s.bpm*1.15)].map(v=>[v,s.my?Math.round(v/s.bpm*100)+" "+t("my_pct"):String(v)]),bpm,v=>{ SG.bpm=+v; renderSongs(); });
  const gms=s.my&&s.audio?[["orig",t("my_orig")],["synth",t("my_synth")],["off",t("sg_off")]]:[["synth",t("sg_on")],["off",t("sg_off")]];
  if(!SG.gm||!gms.find(g=>g[0]===SG.gm)) SG.gm=s.my&&s.audio?"orig":(SG.guide?"synth":"off");
  chipSet(box.querySelector("[data-g]"),gms,SG.gm,v=>{ SG.gm=v; SG.guide=v!=="off"; renderSongs(); });
  const useOrig=SG.gm==="orig", rate=bpm/s.bpm;
  const beat=60/bpm, {targets,dur}=songTargets(s,shift,beat,SG.phrase);
  // lyrics with one span per syllable
  const ly=box.querySelector("[data-lyr]"); let lines={}; targets.forEach((n,i)=>{ (lines[n.ph]=lines[n.ph]||[]).push(`<span data-i="${i}" style="padding:1px 2px;border-radius:4px">${esc(n.label)}</span>`); });
  ly.innerHTML=Object.keys(lines).map(p=>`<div><span class="muted" style="font-size:.75rem">${+p+1}</span> ${lines[p].join(" ").replace(/-<\/span> /g,"-</span>")}</div>`).join("");
  const mid=Math.round((Math.min(...targets.map(n=>n.m))+Math.max(...targets.map(n=>n.m)))/2), lane=laneView(box.querySelector("[data-lane]"),targets,mid);
  const hl=i=>{ ly.querySelectorAll("span[data-i]").forEach(e=>{ const k=+e.dataset.i; e.style.background=k===i?"var(--accent2)":""; e.style.color=k===i?"#fff":(k<i?"var(--muted)":""); }); };
  if(SG.last&&SG.last.id===s.id&&SG.last.phrase===SG.phrase) showSongResult(box,s,SG.last.res,SG.last.m);
  const origOff=()=>s.phT?s.phT[SG.phrase==null?0:SG.phrase]:0;
  const hasOrig=s.my&&s.audio;
  const prevStart=(btn,len)=>{ const c=ac(); stopGuide(); GUIDE.out=c.createGain(); GUIDE.out.connect(c.destination); AOUT=GUIDE.out; btn.dataset.lbl=btn.innerHTML; btn.innerHTML="■ "+t("sess_stop"); GUIDE.timers.push(setTimeout(stopGuide,(len+0.8)*1000)); };
  box.querySelector("[data-lis]").onclick=async e=>{ const btn=e.currentTarget; if(btn.dataset.lbl){ stopGuide(); return; } prevStart(btn,dur); const c=ac(), t0=c.currentTime+0.25;
    if(hasOrig){ await playOrig(s,origOff(),dur+0.3,rate,0.25); } else targets.forEach(n=>synthVoice(c,n.m,t0+n.t,n.d*0.95,0.16));
    if(s.lyrics){ const a0=c.currentTime+0.25; LYR.run(box,s,()=>GUIDE.el?GUIDE.el.currentTime:origOff()+(ac().currentTime-a0)*rate); }
    targets.forEach((n,i)=>GUIDE.timers.push(setTimeout(()=>hl(i),(0.25+n.t)*1000))); GUIDE.timers.push(setTimeout(()=>hl(-1),(0.4+dur)*1000)); };
  if(box.querySelector("[data-syn]")) box.querySelector("[data-syn]").onclick=e=>{ const btn=e.currentTarget; if(btn.dataset.lbl){ stopGuide(); return; } prevStart(btn,dur); const c=ac(), t0=c.currentTime+0.25; targets.forEach((n,i)=>{ synthVoice(c,n.m,t0+n.t,n.d*0.95,0.16); GUIDE.timers.push(setTimeout(()=>hl(i),(0.25+n.t)*1000)); }); GUIDE.timers.push(setTimeout(()=>hl(-1),(0.4+dur)*1000)); };
  if(box.querySelector("[data-fix]")) box.querySelector("[data-fix]").onclick=()=>singAlongFix(box,s);
  if(s.my){ LYR.show(box,s,null); box.querySelector("[data-led]").onclick=()=>lyricsEditor(box,s); const ls=box.querySelector("[data-lsync]"); if(ls) ls.onclick=()=>lyricsSync(box,s); if(s.lyrics) ly.style.display="none"; }
  if(box.querySelector("[data-back]")) box.querySelector("[data-back]").onclick=()=>{ SG.phrase=null; SG.phStreak=0; SG.last=null; renderSongs(); };
  box.querySelector("[data-go]").onclick=async()=>{ const go=box.querySelector("[data-go]"); go.disabled=true; lane.reset();
    stopGuide(); const orig=useOrig&&hasOrig, buf=orig&&rate===1?await SongAudio.get(s.id):null;
    const acc=buf?[{buf,t:0,off:origOff(),d:dur+0.2,v:0.8}]:(!orig&&SG.gm!=="off"?targets.map(n=>({m:n.m,t:n.t,d:n.d*0.95,v:0.08,voice:1})):[]);
    const cues=orig&&!buf?[{t:-0.05,fn:()=>playOrig(s,origOff(),dur+0.2,rate,0)}]:[];
    // light chord support on the key note at each phrase start, also without the guide melody
    if(!s.my) [...new Set(targets.map(n=>n.ph))].forEach(p=>{ const f=targets.find(n=>n.ph===p); acc.push({m:60+shift-12,t:f.t,d:Math.min(2,beat*2),v:0.05,organ:true}); });
    if(s.lyrics) LYR.run(box,s,()=>SESS.on&&SESS.t0!=null?(GUIDE.el&&!GUIDE.el.paused?GUIDE.el.currentTime:origOff()+(ac().currentTime-SESS.t0)*rate):null);
    const out=await singSession({acc,targets,countIn:4,beat,total:dur,cues,onLive:(f,rel)=>{ if(rel>=-0.2) lane.pushAt(f,rel); },onPhase:i=>hl(i)});
    go.disabled=false; hl(-1); LYR.stop(); if(!out) return;
    const m=songMetrics(out.res); st.runs++; if(SG.phrase==null) st.best=Math.max(st.best,m.pitch);
    const L=LV[SG.lv], met=["pitch","stab","time","sus","dyn"].filter(k=>metOk(k,m[k],L));
    if(SG.phrase==null&&met.length===5) st.mastered[SG.lv]=today();
    if(SG.phrase!=null){ SG.phStreak=m.pitch>=L.pitch?SG.phStreak+1:0; }
    save(); SG.last={id:s.id,phrase:SG.phrase,res:out.res,m};
    logSession(songName(s),Math.max(0.5,dur/60));
    if(SG.phrase!=null&&SG.phStreak>=2){ const n=SG.phrase+1; SG.phrase=null; SG.phStreak=0; SG.last=null; renderSongs(); $("#sgBody [data-out]").innerHTML=`<div class="okbox" style="margin-top:8px">${t("sg_phrase_done",{n})}</div>`; return; }
    renderSongs(); };
}
function showSongResult(box,s,res,m){
  const L=LV[SG.lv], keys=["pitch","stab","time","sus","dyn"], unit={pitch:" %",stab:" ct",time:" ms",sus:" %",dyn:" dB"}, cmp={pitch:"≥",sus:"≥",stab:"≤",time:"≤",dyn:"≤"};
  const ok=keys.filter(k=>metOk(k,m[k],L)), worst=m.perPh.slice().sort((a,b)=>a.acc-b.acc)[0];
  const rows=keys.map(k=>`<tr><td>${metOk(k,m[k],L)?"✅":"⬜"} <b>${t("pm_"+k)}</b><br><span class="muted" style="font-size:.75rem">${t("pm_"+k+"_u")}</span></td><td style="text-align:right">${m[k]==null?"–":m[k]+unit[k]}</td><td style="text-align:right">${cmp[k]} ${L[k]}${unit[k]}</td></tr>`).join("");
  const o=box.querySelector("[data-out]"), all=ok.length===5&&SG.phrase==null;
  o.innerHTML=`<div class="${all?"okbox":"warnbox"}" style="margin-top:8px">
     <table style="width:100%;border-collapse:collapse;font-size:.85rem"><tr class="muted"><td>${t("sg_col_p")}</td><td style="text-align:right">${t("sg_col_v")}</td><td style="text-align:right">${t("sg_col_t")}</td></tr>${rows}</table>
     ${m.perPh.length>1?`<p style="margin:6px 0 2px"><b>${t("sg_ph")}</b> ${m.perPh.map(p=>`<span class="kp ${p.acc>=L.pitch?"hit":"miss"}">${p.p+1}: ${p.acc} %</span>`).join("")}</p>`:""}
     ${resultList(res)}
     ${all?`<p><b>${t("sg_all",{l:t("lv_"+SG.lv)})}</b></p>`:ok.length<5?`<p><b>${t("sg_some",{c:ok.length})}</b></p><ul class="list" data-nx></ul>`:""}</div><div class="row" data-btn style="margin-top:6px"></div>`;
  const nx=o.querySelector("[data-nx]"), btns=o.querySelector("[data-btn]"), add=(txt,fn,warm)=>{ const b=el("button",{class:"b sm "+(warm?"warm":"alt")},txt); b.onclick=fn; btns.append(b); };
  const again=el("button",{class:"b sm"},t("nt_again")); again.onclick=()=>box.querySelector("[data-go]").click(); btns.append(again);
  if(!nx) return; const li=x=>nx.insertAdjacentHTML("beforeend",`<li>${esc(x)}</li>`);
  if(!metOk("pitch",m.pitch,L)){
    if(SG.phrase==null&&m.perPh.length>1){ li(t("nx_pitch",{n:worst.p+1})); add(t("sg_go_ph",{n:worst.p+1}),()=>{ SG.phrase=worst.p; SG.phStreak=0; SG.last=null; renderSongs(); scrollToId("sgCard"); },true); }
    const wrong=[...new Set(res.filter(n=>!n.ok).map(n=>n.m))]; if(wrong.length){ add(t("nx_wrong",{n:wrong.length}),()=>{ NT.only=wrong; NT.round=0; scrollToId("ntCard"); runNotes($("#ntBody")); }); }
    tendencyTips(res).forEach(li);
  }
  if(!metOk("stab",m.stab,L)){ li(t("nx_stab")); add(t("sg_go_long"),()=>{ NT.ex="long"; NT.only=null; NT.round=0; renderNotes(); scrollToId("ntCard"); }); }
  if(!metOk("time",m.time,L)){ const slow=Math.round(s.bpm*0.75); li(t("nx_time",{b:s.my?"75 "+t("my_pct"):slow})); add(t("sg_go_slow"),()=>{ SG.bpm=slow; SG.last=null; renderSongs(); }); }
  if(!metOk("sus",m.sus,L)) li(t("nx_sus"));
  if(!metOk("dyn",m.dyn,L)) li(t("nx_dyn"));
  if(!metOk("sus",m.sus,L)||!metOk("dyn",m.dyn,L)) add(t("sg_go_breath"),()=>{ show("breath"); scrollToId("supCard"); });
}

async function playOrig(s,off,dur,rate,lead){
  if(rate===1){ const buf=await SongAudio.get(s.id); if(!buf) return; const c=ac(), src=c.createBufferSource(); src.buffer=buf; src.connect(outOf(c)); src.start(c.currentTime+lead,off,dur); GUIDE.src=src; return; }
  const raw=await SongAudio.raw(s.id); if(!raw) return; const blob=raw instanceof Blob?raw:null; if(!blob){ const buf=await SongAudio.get(s.id); if(!buf) return; const c=ac(), src=c.createBufferSource(); src.buffer=buf; src.playbackRate.value=rate; src.connect(outOf(c)); src.start(c.currentTime+lead,off,dur/rate); GUIDE.src=src; return; }
  const a=new Audio(URL.createObjectURL(blob)); if(SET.outId&&a.setSinkId) a.setSinkId(SET.outId).catch(()=>{}); a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true; GUIDE.el=a;

/* warmer, voice-like synth ("oo") with soft attack, legato and late vibrato – replaces the beep sound for melodies */
function synthVoice(c,midi,t0,dur,vol){
  const f=midiToHz(midi), o=c.createOscillator(), o2=c.createOscillator(), lp=c.createBiquadFilter(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain();
  o.type="sawtooth"; o2.type="triangle"; o.frequency.value=f; o2.frequency.value=f; lp.type="lowpass"; lp.frequency.value=Math.min(1600,f*4); lp.Q.value=0.8;
  lfo.frequency.value=5.2; lg.gain.setValueAtTime(0,t0); lg.gain.linearRampToValueAtTime(0,t0+Math.min(0.35,dur*0.5)); lg.gain.linearRampToValueAtTime(f*0.006,t0+Math.min(0.7,dur)); lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  const og=c.createGain(); og.gain.value=0.35; o.connect(og).connect(lp); o2.connect(lp); lp.connect(g); g.connect(outOf(c));
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+0.07); g.gain.setValueAtTime(vol,t0+Math.max(0.08,dur-0.09)); g.gain.linearRampToValueAtTime(0.0001,t0+dur);
  [o,o2,lfo].forEach(x=>{ x.start(t0); x.stop(t0+dur+0.05); });
}
/* ---- improve the melody: the user hums/sings along with the original once (headphones); notes come from the clean voice ---- */
async function singAlongFix(box,s){
  const o=box.querySelector("[data-out]"), raw=await SongAudio.raw(s.id); if(!raw){ toast(t("my_none")); return; }
  const blob=raw instanceof Blob?raw:null, buf=blob?null:await SongAudio.get(s.id); if(!blob&&!buf){ toast(t("my_none")); return; }
  let len=Math.min(s.dur||(buf?buf.duration:180),180);
  o.innerHTML=`<div class="warnbox" style="margin-top:8px">${t("my_fix_info",{s:Math.round(len)})}</div>
    <button class="b warm" style="width:100%;margin-top:6px" data-fgo>${t("my_fix_go")}</button>
    <div data-run class="hidden" style="margin-top:8px"><div class="row"><b class="grow" data-ft>0:00 / ${fmtT(len)}</b><button class="b warm sm" data-fstop>■ ${t("my_fix_done")}</button></div>
      <div class="meter" style="margin-top:4px"><i data-fp style="width:0;background:var(--accent)"></i></div><div class="muted" style="font-size:.75rem;margin-top:6px">🎤 ${t("my_fix_mic")}</div><div class="meter"><i data-fl></i></div>
      <button class="b alt hidden" style="width:100%;margin-top:6px" data-fsound>🔊 ${t("my_fix_sound")}</button></div><p data-fmsg class="muted"></p>`;
  o.querySelector("[data-fgo]").onclick=async()=>{
    stopGuide(); const c=ac(); let take; const lv=o.querySelector("[data-fl]");
    try{ take=await startTake({onLevel:d=>{ lv.style.width=Math.max(0,Math.min(100,(d+70)/60*100))+"%"; }}); }catch(e){ micError(e); toast(t("mic_fail")); return; }
    try{ if(c.state!=="running") await c.resume(); }catch(e){}
    o.querySelector("[data-fgo]").classList.add("hidden"); const run=o.querySelector("[data-run]"); run.classList.remove("hidden"); keepAwake(true);
    const msg=o.querySelector("[data-fmsg]"), ft=o.querySelector("[data-ft]"), fp=o.querySelector("[data-fp]"), snd=o.querySelector("[data-fsound]");
    let playT0=null, a=null, src=null, done=false, tick;
    // the original is played by the phone's media player (keeps playing while the microphone is open); Web Audio only as fallback
    if(blob){ a=new Audio(URL.createObjectURL(blob)); if(SET.outId&&a.setSinkId) a.setSinkId(SET.outId).catch(()=>{}); a.preload="auto"; GUIDE.el=a;
      a.addEventListener("playing",()=>{ if(playT0===null) playT0=performance.now()-a.currentTime*1000; snd.classList.add("hidden"); });
      const go=()=>a.play().catch(()=>snd.classList.remove("hidden")); snd.onclick=go; go(); }
    else { src=c.createBufferSource(); src.buffer=buf; src.connect(c.destination); const st=c.currentTime+0.3; src.start(st,0,len); const p0=performance.now()+300; playT0=p0; GUIDE.src=src; }
    const pos=()=>a?a.currentTime:Math.max(0,(performance.now()-playT0)/1000); if(s.lyrics) LYR.run(box,s,pos);
    tick=setInterval(()=>{ const p=pos(); ft.textContent=fmtT(p)+" / "+fmtT(len); fp.style.width=Math.min(100,p/len*100)+"%";
      if(a&&playT0===null&&performance.now()-take.t0>2500) snd.classList.remove("hidden");
      if(p>=len||(a&&a.ended)) finish(); },200);
    const finish=async()=>{ if(done) return; done=true; clearInterval(tick); LYR.stop(); try{ a&&a.pause(); }catch(e){} try{ src&&src.stop(); }catch(e){} GUIDE.el=null; GUIDE.src=null;
      const r=await take.stop(); keepAwake(false); run.classList.add("hidden");
      if(playT0===null){ msg.innerHTML=`<span class="warnbox" style="display:block">${t("my_fix_nosound")}</span>`; o.querySelector("[data-fgo]").classList.remove("hidden"); return; }
      msg.textContent=t("analysing");
      const res=await importSongPcm(r.pcm,p=>{ msg.textContent=t("my_prog",{p:Math.round(p*100)}); });
      if(!res.notes){ msg.textContent=t("my_none"); o.querySelector("[data-fgo]").classList.remove("hidden"); return; }
      // recording time → time in the original: subtract when the original started (relative to the recording start) and the output latency

    o.querySelector("[data-fstop]").onclick=finish;
  };
}

  // not synced yet: line i starts with phrase i (approximation)
  const P=s.phT||[]; return L.map((_,i)=>P[i]!=null?P[i]:null); }

  show(box,s,pos){ const v=box.querySelector("[data-big]"); if(!v) return; const L=lyrLines(s); if(!L.length){ v.innerHTML=""; return; }
    const T=lyrTimes(s); let i=-1; if(pos!=null){ for(let k=0;k<L.length;k++) if(T[k]!=null&&T[k]<=pos+0.15) i=k; }
    const end=i>=0?(T.slice(i+1).find(x=>x!=null)||(T[i]+6)):0, frac=i>=0?Math.max(0,Math.min(1,(pos-T[i])/Math.max(0.5,end-T[i]))):0;

    v.innerHTML=`<div class="card flat" style="margin:6px 0;padding:10px 12px;line-height:1.5;text-align:center;min-height:5.5em">

      ${cur?`<div style="font-size:1.35rem;font-weight:700;margin:2px 0">${words.map((w,k)=>`<span style="${k<wi?"color:var(--muted)":k===wi?"color:var(--accent2)":""}">${esc(w)}</span>`).join(" ")}</div>`:`<div class="muted" style="font-size:.85rem">${pos==null?t("ly_ready",{n:L.length}):"…"}</div>`}
      ${L.slice(i+1,i+3).map((x,k)=>line(x,k?"color:var(--muted);font-size:.85rem":"font-size:1rem")).join("")}
      ${!s.lyrT&&pos==null?`<div class="muted" style="font-size:.72rem;margin-top:4px">${t("ly_approx")}</div>`:""}</div>`; },

/* tap along: the original plays, tap “Next line” exactly when each line starts */
async function lyricsSync(box,s){
  const L=lyrLines(s); if(!L.length) return; const v=box.querySelector("[data-big]"); stopGuide();
  const raw=await SongAudio.raw(s.id); if(!raw){ toast(t("my_none")); return; } const blob=raw instanceof Blob?raw:null, buf=blob?null:await SongAudio.get(s.id);
  const times=[]; let a=null, src=null, c=ac(), t0=null, timer=null;
  const pos=()=>a?a.currentTime:(t0==null?0:c.currentTime-t0);
  const draw=()=>{ const i=times.length; v.innerHTML=`<div class="card flat" style="margin:6px 0;text-align:center"><b>⏱ ${t("ly_sync")}</b><p class="muted" style="font-size:.8rem">${t("ly_sync_h")}</p>
      <div class="muted" style="font-size:.85rem">${i>0?esc(L[i-1]):"&nbsp;"}</div><div style="font-size:1.25rem;font-weight:700;margin:6px 0">${i<L.length?esc(L[i]):"✓"}</div><div class="muted" style="font-size:.85rem">${i+1<L.length?esc(L[i+1]):"&nbsp;"}</div>
      <div class="muted" data-tm style="margin:4px 0">${fmtT(pos())}</div>
      <button class="b warm" style="width:100%;padding:18px;font-size:1.1rem" data-tap>${i<L.length?t("ly_tap",{n:i+1,m:L.length}):t("ly_done")}</button>
      <div class="row" style="margin-top:6px"><button class="b alt sm grow" data-back1>↶ ${t("ly_undo")}</button><button class="b alt sm grow" data-cx>${t("ly_cancel")}</button></div></div>`;
    v.querySelector("[data-tap]").onclick=()=>{ if(times.length<L.length){ times.push(Math.max(0,pos()-0.15)); draw(); } else finish(true); };
    v.querySelector("[data-back1]").onclick=()=>{ times.pop(); draw(); };
    v.querySelector("[data-cx]").onclick=()=>finish(false); };

function nextScene(){ return SCENES.filter(s=>s.ctx===SET.ctx).map(sc=>({sc,s:getConv(sc.id,SET.tl)})).find(x=>!x.s.mastered); }
function planFor(date){
  if(store.plan[date]) return store.plan[date];
  const gi=typeof goalPlanItems==="function"?goalPlanItems():null;
  if(gi){ store.plan[date]={items:gi,done:{},goal:true}; save(); return store.plan[date]; }
  const dayN=Math.floor(Date.now()/DAY), prof=store.profile;
  const focus=prof&&prof.focus&&prof.focus.length?prof.focus[dayN%prof.focus.length]:DIMS6[dayN%6];
  const items=[{k:"warm",r:dayN%ROUTINES.length},{k:"drill",dim:focus,act:FOCUS_DRILL[focus]},{k:"diction",tw:dayN%6}];
  const co=typeof coachOpen==="function"?coachOpen():[]; if(co.length) items.splice(1,0,{k:"coach",id:co[0].id});
  const due=dueList(); if(due.length) items.push({k:"review",id:due[0].sc.id,l:due[0].l});
  const nx=nextScene(); if(nx) items.push({k:"talk",id:nx.sc.id,l:SET.tl});
  const ls=LESSONS.find(l=>!store.lessons[l.id]&&l.dim===focus)||LESSONS.find(l=>!store.lessons[l.id])||LESSONS[dayN%LESSONS.length];
  items.push({k:"lesson",id:ls.id});
  store.plan[date]={items,done:{}};
  const keys=Object.keys(store.plan).sort(); while(keys.length>60) delete store.plan[keys.shift()];
  save(); return store.plan[date];
}
function markPlan(k,x){ const p=planFor(today()); let ch=false;
  p.items.forEach((it,i)=>{ if(p.done[i]||it.k!==k) return; if(k==="drill"&&it.act!==x) return; if(k==="lesson"&&x&&it.id!==x) return; if(k==="coach"&&x&&it.id!==x) return; if(k==="art"&&x&&it.snd!==x) return; p.done[i]=true; ch=true; });
  if(ch){ save(); renderPlan(); const n=Object.keys(p.done).length; if(n===p.items.length){ beep(1320,.3,.12); toast("🎉 "+t("plan_done",{d:n,n:p.items.length})); } } }
const lessonOf=id=>LESSONS.find(l=>l.id===id);
const drillName=act=>act.startsWith("lesson:")?lessonOf(act.slice(7)).txt[SET.ui][0]:({pace:t("read_title"),into:t("into_title"),proj:t("proj_title"),art:t("art_title"),imp:t("imp_title"),studio:t("studio_title"),support:t("sup_title")}[act]||act);

    const d=!!p.done[i]; const r=el("div",{class:"planitem"+(d?" done":"")},`<span class="ck">${d?"✅":"⬜"}</span><span class="grow">${it.k==="diction"?planLabel(it):esc(planLabel(it))}</span>`);

  $("#planNoTest").classList.toggle("hidden",!!store.profile);

  const passage=PASSAGES[SET.tl].cas[1];
  box.append(el("p",{},"<b>"+(n===1?t("test_p1"):t("test_p2"))+"</b>"));
  box.append(el("div",{class:"card flat",style:"font-size:1.1rem;line-height:1.6"},(n===1?`<div ${tlAttr(SET.tl)}>${esc(passage)}</div>`:`<div ${tlAttr(SET.tl)}>${esc(T[SET.tl].test_prompt)}</div>`+(SET.tl!==SET.ui?`<div class="muted" style="font-size:.9rem">${esc(t("test_prompt"))}</div>`:""))));
  const rc=el("div"); box.append(rc);
  const cancel=el("button",{class:"b sm alt",style:"margin-top:8px"},t("cancel")); cancel.onclick=()=>{ TEST=null; renderTest(); }; box.append(cancel);
  recControls(rc,{lang:srLang(),maxSec:n===1?90:45,onDone:r=>{ TEST.parts.push({r,an:analyze(r.pcm)}); if(n===1) testStep(2); else testFinish(); }});
}
function testFinish(){
  const [p1,p2]=TEST.parts, passage=PASSAGES[SET.tl].cas[1], box=$("#testBody");
  const d1=deliveryScores(p1.an)||{}, d2=deliveryScores(p2.an,{statements:true})||{};
  const av=(a,b)=>a!=null&&b!=null?(a+b)/2:(a??b??null);
  const dims={pace:d1.pace??d2.pace??null, pauses:av(d1.pauses,d2.pauses), melody:av(d1.melody,d2.melody), projection:av(d1.projection,d2.projection)};
  const cl=srClarity(p1.r.sr.text?p1.r.sr:null,passage); if(cl) dims.clarity=cl.score;
  if(p2.r.sr.text){ const fi=fillerInfo(p2.r.sr.text,SET.tl); dims.fluency=clamp01(1-0.2*fi.n-0.1*(p2.an.longPauses||[]).length); }
  else if(p2.an.ok) dims.fluency=clamp01(1-0.15*p2.an.longPauses.length-(p2.an.first>4?0.2:0));
  Object.keys(dims).forEach(k=>{ if(dims[k]==null) delete dims[k]; });
  { const vt=typeof voiceTarget==="function"&&voiceTarget(), f0=p1.an.f0med||p2.an.f0med; if(vt&&f0&&(f0<vt.lo||f0>vt.hi)) coachRegisterExt("tone",t("test_title")); }
  if(!Object.keys(dims).length){ TEST=null; renderTest(); toast(t("tip_noise")); return; }
  const ranked=Object.entries(dims).sort((a,b)=>b[1]-a[1]), score=avgScore(dims);
  const pr={d:today(),t:Date.now(),score,dims,f0:p1.an.f0med||p2.an.f0med||0,strengths:ranked.slice(0,2).map(x=>x[0]),focus:ranked.slice(-2).reverse().map(x=>x[0])};
  store.profile=pr; store.tests.push(pr);
  const td=store.plan[today()]; if(td&&!Object.keys(td.done).length) delete store.plan[today()];
  save(); TEST=null; logSession(t("test_title"),1.5); renderPlan();
  box.innerHTML=`<h3>${t("test_result")}</h3>${profileHtml(pr)}`;
  [[p1,passage,"test-1"],[p2,null,"test-2"]].forEach(([p,exp,k],i)=>{ const tips=makeTips(p.an,{sr:p.r.sr.text?p.r.sr:null,expected:exp}), sc=tips.scores;
    const take={blob:p.r.blob,an:p.an,tips,scores:sc,score:avgScore(sc),kind:k,title:t("test_title")+" "+(i+1)+"/2",lang:SET.tl,text:p.r.sr.text||""};
    const det=el("details",{},`<summary>${t("replay_title")} – ${i+1}/2</summary>`); det.append(replayView(take,{saved:true})); box.append(det);
    saveTake(take).catch(()=>{}); coachRegister(tips.fix,t("test_title")); });
  const again=el("button",{class:"b alt",style:"width:100%;margin-top:8px"},t("test_retake")); again.onclick=()=>testStep(1); box.append(again);
}

/* ---------- library ---------- */
async function renderLibrary(){
  const L=$("#libList"); if(!L) return; L.innerHTML="";
  let all=[]; try{ all=await DB.all(); }catch(e){ L.innerHTML=`<p class="muted">${t("lib_fail")}</p>`; return; }
  all.sort((a,b)=>b.t-a.t);
  if(!all.length){ L.innerHTML=`<p class="muted">${t("lib_empty")}</p>`; return; }
  all.slice(0,100).forEach(o=>{ const r=el("div",{class:"planitem"},`<span class="ck">${o.video?"🎥":"🎙"}</span><span class="grow"><b>${esc(o.title||o.kind)}</b><br><span class="muted">${o.d} · ${o.lang.toUpperCase()} · ${o.kind}${o.score!=null?" · "+o.score:""}</span></span>`);
    const pb=el("button",{class:"b sm"},"▶"), db=el("button",{class:"b sm alt"},"🗑");
    pb.onclick=()=>{ const out=$("#libOut"); out.innerHTML=""; out.append(replayView(o,{saved:true})); out.scrollIntoView({behavior:"smooth"}); };
    db.onclick=async()=>{ if(db.dataset.sure){ await DB.del(o.id); renderLibrary(); $("#libOut").innerHTML=""; } else { db.dataset.sure="1"; db.textContent=t("del")+"?"; db.style.background="var(--warn)"; db.style.color="#fff"; } };
    r.append(pb,db); L.append(r); });
}
const _renderProgress=renderProgress;
renderProgress=function(){ _renderProgress();
  const {g,W,H,dpr}=prepCanvas($("#testChart"),150), ts=store.tests.slice(-20);
  const Y=v=>H-12*dpr-v/100*(H-22*dpr), X=i=>26*dpr+(ts.length<2?.5:i/(ts.length-1))*(W-36*dpr);
  g.strokeStyle=cssv("--line"); g.fillStyle=cssv("--muted"); [0,50,100].forEach(v=>{ g.beginPath(); g.moveTo(22*dpr,Y(v)); g.lineTo(W,Y(v)); g.stroke(); g.fillText(v,2,Y(v)+3*dpr); });
  if(!ts.length){ g.fillText(t("nothing"),30*dpr,24*dpr); }
  g.strokeStyle=cssv("--accent"); g.lineWidth=2*dpr; g.beginPath(); ts.forEach((x,i)=>i?g.lineTo(X(i),Y(x.score)):g.moveTo(X(i),Y(x.score))); g.stroke();
  g.fillStyle=cssv("--accent"); ts.forEach((x,i)=>{ g.beginPath(); g.arc(X(i),Y(x.score),3.5*dpr,0,7); g.fill(); });
  $("#testDims").innerHTML=store.profile?scoreBars(store.profile.dims):"";
  renderLibrary();
};
