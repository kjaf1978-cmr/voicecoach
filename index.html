ROUTINES.push({name:{en:"Voice from the belly",de:"Stimme aus dem Bauch",fr:"Voix du ventre"}, steps:[
 [60,{de:["Bauchatmung spüren","Rücklings liegen oder aufrecht sitzen, eine Hand auf dem Bauch, eine auf der Brust. Durch die Nase einatmen: nur die Bauchhand hebt sich. Langsam durch den Mund aus: der Bauch sinkt. Die Brusthand bleibt ruhig.","So spürst du, wo die Atmung für die Stimme stattfinden soll – unten, nicht oben in Brust und Schultern."],en:["Feel belly breathing","Lie on your back or sit upright, one hand on the belly, one on the chest. Breathe in through the nose: only the belly hand rises. Breathe out slowly through the mouth: the belly sinks. The chest hand stays still.","You feel where breathing for the voice should happen – low, not high in chest and shoulders."],fr:["Sentir la respiration abdominale","Allongé sur le dos ou assis droit, une main sur le ventre, une sur la poitrine. Inspirez par le nez : seule la main du ventre monte. Expirez lentement par la bouche : le ventre descend. La main de la poitrine ne bouge pas.","Vous sentez où doit se faire la respiration pour la voix – en bas, pas dans la poitrine et les épaules."]}],
 [30,{de:["Hecheln","Mund leicht offen, schnell und flach hecheln wie ein Hund nach dem Laufen (etwa 2 pro Sekunde). Nur der Bauch bewegt sich, der Hals bleibt locker. Bei Schwindel sofort aufhören.","Aktiviert und lockert das Zwerchfell."],en:["Panting","Mouth slightly open, pant quickly and lightly like a dog after running (about 2 per second). Only the belly moves, the throat stays loose. Stop at once if you feel dizzy.","Activates and loosens the diaphragm."],fr:["Halètement","Bouche entrouverte, haletez vite et légèrement comme un chien après une course (environ 2 par seconde). Seul le ventre bouge, la gorge reste souple. Arrêtez tout de suite en cas de vertige.","Active et assouplit le diaphragme."]}],
 [45,{de:["Zwerchfell-Impulse auf f","Kurze, kräftige „f – f – f – f“ wie beim Ausblasen einer Kerze. Jeder Impuls ist ein kleiner Ruck der Bauchdecke nach innen; dazwischen Bauch loslassen.","Trainiert den Bauch als Motor für den Luftstrom."],en:["Diaphragm impulses on f","Short, strong “f – f – f – f” like blowing out a candle. Each impulse is a small inward jerk of the belly wall; release the belly in between.","Trains the belly as the motor of the airflow."],fr:["Impulsions sur f","Des « f – f – f – f » courts et forts, comme pour souffler une bougie. Chaque impulsion est un petit coup du ventre vers l'intérieur ; entre deux, relâchez le ventre.","Entraîne le ventre comme moteur du souffle."]}],
 [45,{de:["Impulse mit Stimme","Jetzt „ha – ha – ha“, „ho – ho – ho“, „hey!“ wie ein freundlicher Zuruf. Der Impuls kommt aus dem Bauch, die Kehle bleibt weit, kein Kratzen im Hals.","Verbindet Atemimpuls und Stimme ohne Pressen."],en:["Impulses with voice","Now “ha – ha – ha”, “ho – ho – ho”, “hey!” like a friendly call. The impulse comes from the belly, the throat stays wide, no scratching in the throat.","Connects breath impulse and voice without pushing."],fr:["Impulsions avec la voix","Maintenant « ha – ha – ha », « ho – ho – ho », « hé ! » comme un appel amical. L'impulsion vient du ventre, la gorge reste ouverte, sans gratter.","Relie l'impulsion respiratoire et la voix sans pousser."]}],
 [45,{de:["Gähnen und weit werden","Ein Gähnen beginnen und den weiten Raum im Rachen spüren. Mit diesem Gefühl „hmm“ seufzen, dann „ja“, „nein“, „hallo“ sagen.","Senkt den Kehlkopf und nimmt Druck aus dem Hals."],en:["Yawn and widen","Start a yawn and feel the wide space in the throat. With that feeling sigh “hmm”, then say “yes”, “no”, “hello”.","Lowers the larynx and takes pressure off the throat."],fr:["Bâiller et ouvrir","Commencez un bâillement et sentez l'espace large dans la gorge. Avec cette sensation, soupirez « hmm », puis dites « oui », « non », « bonjour ».","Abaisse le larynx et enlève la pression de la gorge."]}],
 [60,{de:["Summen mit Bauchstütze","Lippen locker zu, „mmmm“ in bequemer Tonlage summen, dabei den Bauch langsam einziehen. Hand auf Brustbein und Gesicht: das Vibrieren spüren. Dann öffnen: „mmm-ma, mmm-mo, mmm-mu“.","Lenkt den Klang nach vorne in den Gesichtsraum (Resonanz) statt in den Hals."],en:["Humming with belly support","Lips loosely closed, hum “mmmm” at a comfortable pitch while slowly pulling the belly in. Hands on breastbone and face: feel the vibration. Then open: “mmm-ma, mmm-mo, mmm-moo”.","Moves the sound forward into the face (resonance) instead of the throat."],fr:["Fredonner avec le ventre","Lèvres fermées sans serrer, fredonnez « mmmm » à hauteur confortable en rentrant lentement le ventre. Mains sur le sternum et le visage : sentez la vibration. Puis ouvrez : « mmm-ma, mmm-mo, mmm-mou ».","Place le son vers l'avant, dans le visage (résonance), plutôt que dans la gorge."]}],
 [60,{de:["Zählen mit Stütze","Einatmen in den Bauch, dann auf einem Atem langsam und deutlich zählen: „eins, zwei, drei …“. Bei jeder Zahl gibt der Bauch einen kleinen Impuls. Aufhören, bevor es im Hals eng wird.","Überträgt die Stütze auf die Sprache."],en:["Counting with support","Breathe into the belly, then count slowly and clearly on one breath: “one, two, three…”. With each number the belly gives a small impulse. Stop before the throat gets tight.","Transfers support to speech."],fr:["Compter avec soutien","Inspirez dans le ventre, puis comptez lentement et nettement sur un souffle : « un, deux, trois… ». À chaque nombre, le ventre donne une petite impulsion. Arrêtez avant que la gorge se serre.","Transfère le soutien vers la parole."]}],
 [60,{de:["Satz mit Bauchstütze","„Heute spreche ich ruhig, klar und kraftvoll.“ – dreimal: leise, normal, tragfähig in den Raum. Die Lautstärke kommt aus dem Bauch, nicht aus mehr Druck im Hals. Danach im Atem-Tab den Vorher/Nachher-Vergleich machen.","Festigt das neue Gefühl im Sprechen."],en:["Sentence with support","“Today I speak calmly, clearly and with energy.” – three times: quiet, normal, carrying into the room. Volume comes from the belly, not from more pressure in the throat. Then do the before/after comparison in the Breath tab.","Anchors the new feeling in speech."],fr:["Phrase avec soutien","« Aujourd'hui, je parle calmement, clairement et avec énergie. » – trois fois : doucement, normalement, en portant la voix dans la pièce. Le volume vient du ventre, pas d'une pression accrue dans la gorge. Ensuite, faites la comparaison avant/après dans l'onglet Souffle.","Ancre la nouvelle sensation dans la parole."]}]

/* ---------- resampling ---------- */
function resample(src, sr, tr){
  if(sr===tr) return src;
  const ratio=sr/tr, n=Math.floor(src.length/ratio), out=new Float32Array(n);
  for(let i=0;i<n;i++){ const a=Math.floor(i*ratio), b=Math.min(src.length,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=src[j]; out[i]=b>a?s/(b-a):src[a]||0; }
  return out;
}
function concatChunks(chunks){ const len=chunks.reduce((a,c)=>a+c.length,0), o=new Float32Array(len); let p=0; for(const c of chunks){ o.set(c,p); p+=c.length; } return o; }

/* ---------- live take: recording + optional speech recognition ---------- */
const FATAL_SR=["not-allowed","service-not-allowed","audio-capture","unsupported","start-failed"];
async function startTake({video=false, lang=null, onLevel=null, onText=null}={}){
  if(typeof MIC!=="undefined" && MIC.stream) stopMic();
  const c=ac(); if(!c) throw new Error("noaudio");
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},
    video: video?{facingMode:"user",width:{ideal:640},height:{ideal:480}}:false});
  const src=c.createMediaStreamSource(stream), proc=c.createScriptProcessor(4096,1,1), an=c.createAnalyser(); an.fftSize=1024;
  const chunks=[]; let capturing=true;
  proc.onaudioprocess=e=>{ if(capturing) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(an); src.connect(proc); proc.connect(c.destination);
  const cands=video?["video/webm;codecs=vp8,opus","video/webm","video/mp4"]:["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];
  let mime=""; for(const m of cands){ try{ if(MediaRecorder.isTypeSupported(m)){ mime=m; break; } }catch(e){} }
  let mr=null; const parts=[];
  try{ mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); mr.ondataavailable=e=>{ if(e.data&&e.data.size) parts.push(e.data); }; mr.start(250); }catch(e){ mr=null; }
  const t0=performance.now(), lb=new Float32Array(an.fftSize); let raf;
  const lvl=()=>{ an.getFloatTimeDomainData(lb); let s=0; for(let i=0;i<lb.length;i++) s+=lb[i]*lb[i]; onLevel&&onLevel(10*Math.log10(s/lb.length+1e-10),(performance.now()-t0)/1000); raf=requestAnimationFrame(lvl); }; lvl();
  const sr={text:"",confs:[],first:null,last:null,err:null,segs:0};
  let srOn=!!(lang && SR && !srBroken), srDone=Promise.resolve();
  const loop=()=>{ if(!srOn) return;
    srDone=recognizeOnce(lang, txt=>onText&&onText((sr.text+" "+txt).trim())).then(r=>{
      if(r.text){ sr.text=(sr.text+" "+r.text).trim(); sr.confs.push(...(r.confs||[])); if(sr.first===null&&r.tFirst!=null) sr.first=(r.tFirst-t0)/1000; if(r.tLast!=null) sr.last=(r.tLast-t0)/1000; }
      sr.segs++; if(srOn&&sr.segs<60) loop();
    }).catch(e=>{ sr.err=String(e); sr.segs++; if(srOn&&!FATAL_SR.includes(sr.err)&&sr.segs<60) setTimeout(loop,150); }); };
  loop();
  return { video, stream, t0, async stop(){
    srOn=false; stopRecognition(); cancelAnimationFrame(raf);
    if(mr&&mr.state!=="inactive") await new Promise(res=>{ mr.onstop=res; try{ mr.stop(); }catch(e){ res(); } });
    capturing=false;
    try{ src.disconnect(); proc.disconnect(); an.disconnect(); }catch(e){}
    stream.getTracks().forEach(t=>t.stop());
    await Promise.race([srDone.catch(()=>{}), new Promise(r=>setTimeout(r,2500))]);
    const blob=parts.length?new Blob(parts,{type:(mr&&mr.mimeType)||mime||(video?"video/webm":"audio/webm")}):null;
    const pcm=resample(concatChunks(chunks),c.sampleRate,16000);
    return {blob, video, pcm, dur:pcm.length/16000, sr};
  }};
}
async function decodeFile(file){
  const c=ac(), buf=await file.arrayBuffer(), ab=await c.decodeAudioData(buf);
  const ch=ab.getChannelData(0); return resample(ch, ab.sampleRate, 16000);
}

/* ---------- acoustic analysis (16 kHz mono) ---------- */
function pctl(arr,p){ if(!arr.length) return 0; const a=Float64Array.from(arr).sort(); return a[Math.min(a.length-1,Math.max(0,Math.floor(p*(a.length-1))))]; }
function pitchFrame(buf, sr){
  const n=buf.length, minLag=Math.floor(sr/600), maxLag=Math.floor(sr/65), size=n-maxLag; if(size<64) return 0;
  let mean=0; for(let i=0;i<n;i++) mean+=buf[i]; mean/=n;
  const corr=new Float32Array(maxLag+2);
  for(let lag=minLag;lag<=maxLag+1;lag++){ let s=0,e1=0,e2=0; for(let i=0;i<size;i++){ const a=buf[i]-mean,b=buf[i+lag]-mean; s+=a*b; e1+=a*a; e2+=b*b; } corr[lag]=s/Math.sqrt(e1*e2+1e-12); }
  let best=-1,bl=0; for(let lag=minLag+1;lag<=maxLag;lag++){ if(corr[lag]>corr[lag-1]&&corr[lag]>=corr[lag+1]&&corr[lag]>best){ best=corr[lag]; bl=lag; if(best>0.92) break; } }
  if(best<0.72) return 0;
  const y1=corr[bl-1],y2=corr[bl],y3=corr[bl+1], den=2*(2*y2-y1-y3), d=den?(y3-y1)/den:0;
  return sr/(bl+(isFinite(d)?d:0));
}
function analyze(pcm, opts={}){
  const SRATE=16000, hop=160, N=Math.floor(pcm.length/hop);
  const out={dur:pcm.length/SRATE, ok:false};
  if(N<50){ out.tooShort=true; return out; }
  const db=new Float32Array(N);
  for(let i=0;i<N;i++){ const a=Math.max(0,i*hop-80), b=Math.min(pcm.length,i*hop+240); let s=0; for(let j=a;j<b;j++) s+=pcm[j]*pcm[j]; db[i]=10*Math.log10(s/(b-a)+1e-10); }
  const floor=pctl(db,0.10), peak=pctl(db,0.98);
  const thr=Math.max(floor+0.32*(peak-floor), floor+9);
  let sp=Array.from(db,v=>v>thr);
  for(let i=0;i<N;){ if(!sp[i]){ let j=i; while(j<N&&!sp[j]) j++; if(i>0&&j<N&&j-i<8) for(let k=i;k<j;k++) sp[k]=true; i=j; } else i++; }   // fill gaps < 80 ms
  for(let i=0;i<N;){ if(sp[i]){ let j=i; while(j<N&&sp[j]) j++; if(j-i<5) for(let k=i;k<j;k++) sp[k]=false; i=j; } else i++; }      // drop blips < 50 ms
  const speechFrames=sp.filter(Boolean).length;
  out.floor=floor; out.peak=peak; out.thr=thr;
  const minSp=opts.minSpeech||150;
  if(speechFrames<minSp || peak-floor<10){ out.tooShort=speechFrames<minSp; out.noVoice=peak-floor<10; out.series=mkSeries(db,new Float32Array(Math.ceil(N/2)),sp); return out; }
  // pitch every 20 ms on speech frames
  const F=Math.ceil(N/2), f0=new Float32Array(F), W=640;
  for(let k=0;k<F;k++){ const i=k*2; if(!sp[i]) continue; const a=Math.max(0,i*hop-W/2+80); if(a+W>pcm.length) break; f0[k]=pitchFrame(pcm.subarray(a,a+W),SRATE); }

  const f0c=new Float32Array(F); for(let k=0;k<F;k++){ const w=[]; for(let d=-2;d<=2;d++){ const v=f0[k+d]; if(v>0) w.push(v); } f0c[k]=f0[k]>0&&w.length>=3?w.sort((x,y)=>x-y)[w.length>>1]:0; }
  const first=sp.indexOf(true), last=N-1-sp.slice().reverse().indexOf(true);
  // pauses and phrases
  const pauses=[], phrases=[]; let segStart=first;
  for(let i=first;i<=last;){ if(!sp[i]){ let j=i; while(j<=last&&!sp[j]) j++; if(j-i>=25){ pauses.push({s:i/100,e:j/100}); phrases.push({s:segStart,e:i}); segStart=j; } i=j; } else i++; }
  phrases.push({s:segStart,e:last+1});
  const total=(last-first+1)/100, pauseTime=pauses.reduce((a,p)=>a+p.e-p.s,0), speak=speechFrames/100;
  // syllable nuclei: envelope peaks, voiced, ≥ 2 dB dip between
  const env=new Float32Array(N); for(let i=0;i<N;i++){ let s=0,c=0; for(let d=-1;d<=1;d++){ const v=db[i+d]; if(v!==undefined){ s+=v; c++; } } env[i]=s/c; }
  let syl=0, lastPk=-100, minSince=Infinity;
  for(let i=1;i<N-1;i++){ minSince=Math.min(minSince,env[i]);
    if(sp[i]&&env[i]>=env[i-1]&&env[i]>env[i+1]&&env[i]>thr+1&&i-lastPk>=7&&env[i]-minSince>=1.5){
      const k=i>>1; if(f0c[k]>0||f0c[k-1]>0||f0c[k+1]>0){ syl++; lastPk=i; minSince=Infinity; } } }
  const voiced=Array.from(f0c).filter(v=>v>0);
  const med=voiced.length?pctl(voiced,0.5):0;
  const st=voiced.map(v=>12*Math.log2(v/med)), mSt=st.reduce((a,b)=>a+b,0)/(st.length||1);
  const sdSt=Math.sqrt(st.reduce((a,b)=>a+(b-mSt)*(b-mSt),0)/(st.length||1));
  const spDb=[]; for(let i=0;i<N;i++) if(sp[i]) spDb.push(db[i]);

  // phrase-final checks
  const uptalk=[], trail=[]; let checked=0;
  phrases.forEach(p=>{ if(p.e-p.s<80) return; checked++;
    const k0=p.s>>1, k1=p.e>>1, all=[], end=[];
    for(let k=k0;k<k1;k++) if(f0c[k]>0) all.push(f0c[k]);
    for(let k=Math.max(k0,k1-15);k<k1;k++) if(f0c[k]>0) end.push(f0c[k]);
    if(all.length>10&&end.length>=4){ const rise=12*Math.log2(pctl(end,0.5)/pctl(all,0.5)); const tail=12*Math.log2(end[end.length-1]/end[0]); if(rise>2.5&&tail>1.5) uptalk.push((p.e/100)-0.3); }
    const L=p.e-p.s, firstHalf=[], lastQ=[]; for(let i=p.s;i<p.s+L/2;i++) if(sp[i]) firstHalf.push(db[i]); for(let i=p.e-Math.floor(L/4);i<p.e;i++) if(sp[i]) lastQ.push(db[i]);
    if(firstHalf.length>10&&lastQ.length>5){ const d=firstHalf.reduce((a,b)=>a+b,0)/firstHalf.length-lastQ.reduce((a,b)=>a+b,0)/lastQ.length; if(d>6) trail.push((p.e/100)-0.4); } });
  Object.assign(out,{ok:true, first:first/100, last:last/100, total, speak, pauses, pauseShare:pauseTime/total,
    longPauses:pauses.filter(p=>p.e-p.s>2), syl, rate:syl/total, artRate:syl/speak,
    f0med:med, sdSt, rangeSt:voiced.length?12*Math.log2(pctl(voiced,0.95)/pctl(voiced,0.05)):0,
    meanDb, clipping:clip/(pcm.length/4)>0.001, uptalk, trail, phrasesChecked:checked,
    segDb:phrases.map(p=>{ let s=0,c=0; for(let i=p.s;i<p.e;i++) if(sp[i]){ s+=db[i]; c++; } return {t:p.s/100,db:c?s/c:-90}; }),
    series:mkSeries(db,f0c,sp)});
  return out;
}
function mkSeries(db,f0,sp){ const d=[],m=[]; for(let i=0;i<db.length;i+=2){ d.push(Math.round(db[i])); m.push(sp[i]?1:0); } return {db:d,f0:Array.from(f0,v=>Math.round(v)),sp:m,hop:0.02}; }

/* ---------- syllables from a transcript (more accurate than acoustic peaks when available) ---------- */
function sylCount(text,lang){ let n=0; norm(text).split(" ").forEach(w=>{ if(!w) return; if(/^[0-9]+$/.test(w)){ n+=w.length; return; }
  let x=w; if(lang==="en") x=x.replace(/(?:[^laeiouy]es|[^laeiouy]ed|[^laeiouy]e)$/,"").replace(/^y/,"");
  if(lang==="fr") x=x.replace(/(ent|es|e)$/,"");
  const m=x.match(/[aeiouy]+/g); n+=Math.max(1,m?m.length:0); }); return n; }

/* ---------- scoring ---------- */
const clamp01=x=>Math.max(0,Math.min(1,x));
function deliveryScores(an,{statements=true}={}){
  if(!an.ok) return null;
  const r=an.rate;
  const pace = r>=3.5&&r<=5.2 ? 1 : r<3.5 ? clamp01((r-2)/1.5) : clamp01((6.7-r)/1.5);
  const ps=an.pauseShare;
  let pauses = ps>=0.08&&ps<=0.30 ? 1 : ps<0.08 ? 0.5+0.5*ps/0.08 : clamp01(1-(ps-0.30)/0.25);
  pauses=clamp01(pauses-0.15*an.longPauses.length);
  let melody=clamp01((an.sdSt-1)/1.5); if(statements&&an.phrasesChecked) melody=clamp01(melody-0.3*an.uptalk.length/an.phrasesChecked);
  let projection=clamp01((an.meanDb+50)/18); if(an.phrasesChecked) projection=clamp01(projection-0.3*an.trail.length/an.phrasesChecked); if(an.clipping) projection=Math.min(projection,0.7);
  return {pace,pauses,melody,projection};
}
function srClarity(sr, expected){
  if(!sr||!sr.text) return null;
  if(expected){ const ew=norm(expected).split(" "), hw=norm(sr.text).split(" "), bag={}; hw.forEach(w=>bag[w]=(bag[w]||0)+1); let hit=0; const miss=[];
    ew.forEach(w=>{ if(bag[w]>0){ hit++; bag[w]--; } else miss.push(w); }); return {score:hit/ew.length, miss:[...new Set(miss)].slice(0,6)}; }
  const c=sr.confs.filter(x=>x>0); return c.length?{score:clamp01((c.reduce((a,b)=>a+b,0)/c.length-0.5)/0.4),miss:[]}:null;
}
function fillerInfo(text, lang){ const set=new Set(FILLERS[lang].map(norm)); const w=norm(text).split(" ").filter(x=>set.has(x)); return {n:w.length, words:[...new Set(w)]}; }

/* ---------- tips (what worked / what to correct) ---------- */
function makeTips(an, {sr=null, lang=SET.tl, expected=null, statements=true, latency=null}={}){
  const fix=[], good=[], f1=x=>(Math.round(x*10)/10).toLocaleString(SET.ui);
  if(!an.ok){ fix.push({txt:an.noVoice?t("tip_noise"):t("tip_short")}); return {fix,good,scores:null}; }
  if(sr&&sr.text) applySrRate(an,sr,lang);
  const sc=deliveryScores(an,{statements});
  if(an.rate>5.2) fix.push({txt:t("tip_fast",{v:f1(an.rate)})}); else if(an.rate<3.5) fix.push({txt:t("tip_slow",{v:f1(an.rate)})}); else good.push(t("tip_pace_ok",{v:f1(an.rate)}));
  if(an.pauseShare<0.08) fix.push({txt:t("tip_nopause",{v:Math.round(an.pauseShare*100)})});
  else if(an.pauseShare>0.30) fix.push({txt:t("tip_manypause",{v:Math.round(an.pauseShare*100)})});
  else if(!an.longPauses.length) good.push(t("tip_pause_ok"));
  an.longPauses.slice(0,3).forEach(p=>fix.push({t:p.s,txt:t("tip_longpause",{s:f1(p.e-p.s)})}));
  if(an.sdSt<2) fix.push({txt:t("tip_mono",{v:f1(an.sdSt)})}); else good.push(t("tip_melody_ok",{v:f1(an.sdSt)}));
  if(statements) an.uptalk.slice(0,3).forEach(x=>fix.push({t:x,txt:t("tip_uptalk")}));
  an.trail.slice(0,3).forEach(x=>fix.push({t:x,txt:t("tip_trail")}));
  if(an.clipping) fix.push({txt:t("tip_clip")});
  else if(an.meanDb<-40) fix.push({txt:t("tip_quiet",{v:Math.round(an.meanDb)})}); else if(!an.trail.length) good.push(t("tip_loud_ok"));
  const lat = latency!=null ? latency : an.first;
  if(lat>4) fix.push({t:0,txt:t("tip_late",{s:f1(lat)})});
  let fluency=null, clarity=null;
  if(sr&&sr.text){
    const fi=fillerInfo(sr.text,lang); fluency=clamp01(1-0.2*fi.n-0.1*an.longPauses.length);
    if(fi.n) fix.push({txt:t("tip_fillers",{n:fi.n,w:fi.words.join(", ")})}); else good.push(t("tip_nofill"));
    const cl=srClarity(sr,expected); if(cl){ clarity=cl.score; if(cl.score<0.85&&cl.miss.length) fix.push({txt:t("tip_clarity",{w:cl.miss.join(", ")})}); else if(cl.score>=0.85) good.push(t("tip_clarity_ok")); }
  }
  const scores=Object.assign({},sc); if(fluency!=null) scores.fluency=fluency; if(clarity!=null) scores.clarity=clarity;
  fix.sort((a,b)=>(a.t??-1)-(b.t??-1));
  return {fix,good,scores};
}
function avgScore(sc){ const v=Object.values(sc||{}).filter(x=>x!=null); return v.length?Math.round(100*v.reduce((a,b)=>a+b,0)/v.length):null; }

/* ---------- replay view ---------- */
const DIM_KEYS=["pace","pauses","melody","projection","fluency","clarity"];
function scoreBars(sc){ return DIM_KEYS.filter(k=>sc&&sc[k]!=null).map(k=>{ const v=sc[k]; return `<div class="sc"><span>${t("d_"+k)}</span><div class="bar"><i style="width:${Math.round(v*100)}%;background:${v>=.8?'var(--ok)':v>=.5?'var(--accent2)':'var(--warn)'}"></i></div><b>${Math.round(v*100)}</b></div>`; }).join(""); }

  return `<p class="muted">${t("m_dur")}: ${f1(an.total)} s · ${t("m_rate")}: ${f1(an.rate)} ${t("m_syl")} · ${t("m_pause")}: ${Math.round(an.pauseShare*100)} % · ${t("m_pitch")}: ${Math.round(an.f0med)} Hz · ${t("m_var")}: ${f1(an.sdSt)} ${t("m_st")} · ${t("m_loud")}: ${Math.round(an.meanDb)} dBFS</p>`; }

function replayView(take, {onSave=null, saved=false, extra=""}={}){

   <div class="row" style="margin-top:8px" data-act></div>`;

    cv.addEventListener("click",e=>{ const r=cv.getBoundingClientRect(); const d=an&&an.dur||media.duration||1; media.currentTime=(e.clientX-r.left)/r.width*d; draw(); }); }

  if(take.blob){
    if(onSave){ const sb=el("button",{class:"b sm"+(saved?" alt":"")},saved?"✓ "+t("saved"):t("save_lib")); sb.disabled=saved; sb.onclick=async()=>{ sb.disabled=true; try{ await onSave(); sb.textContent="✓ "+t("saved"); sb.classList.add("alt"); }catch(e){ sb.disabled=false; toast(t("lib_fail")); } }; act.append(sb); }
    const sh=el("button",{class:"b sm alt"},"↗ "+t("share")); sh.onclick=()=>shareTake(take); act.append(sh);
    if(topLevel&&url){ act.append(el("a",{href:url,download:takeFileName(take),class:"b sm alt",style:"text-decoration:none;display:inline-flex;align-items:center"},"⬇ "+t("download"))); }

function fmtT(s){ s=Math.max(0,s); return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"); }
function drawTimeline(cv, an, cur, tips){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth*dpr, H=120*dpr; if(!W) return; if(cv.width!==W){ cv.width=W; cv.height=H; }
  const g=cv.getContext("2d"); g.clearRect(0,0,W,H);
  if(!an||!an.series){ return; }
  const S=an.series, n=S.db.length, dur=an.dur||n*S.hop, X=tt=>tt/dur*W, top=H*0.48;
  const lo=(an.floor??-80)-3, hi=(an.peak??-10)+2;
  (an.pauses||[]).forEach(p=>{ g.fillStyle="rgba(200,100,59,.18)"; g.fillRect(X(p.s),0,X(p.e)-X(p.s),H); });
  g.fillStyle=cssv("--accent"); g.globalAlpha=.55;
  for(let i=0;i<n;i++){ const v=Math.max(0,Math.min(1,(S.db[i]-lo)/(hi-lo))); const x=X(i*S.hop), w=Math.max(1,X(S.hop)); g.fillRect(x,top-v*top*0.95,w,v*top*0.95); }
  g.globalAlpha=1;
  const med=an.f0med||0; if(med){ const Y=st=>top+ (H-top)/2 - st/12*((H-top)/2-4);
    g.strokeStyle=cssv("--line"); g.setLineDash([4*dpr,4*dpr]); g.beginPath(); g.moveTo(0,Y(0)); g.lineTo(W,Y(0)); g.stroke(); g.setLineDash([]);
    g.fillStyle=cssv("--accent2"); S.f0.forEach((f,k)=>{ if(f>0){ const st=12*Math.log2(f/med); if(Math.abs(st)<14){ g.beginPath(); g.arc(X(k*S.hop),Y(st),1.6*dpr,0,7); g.fill(); } } }); }

  if(cur!=null){ g.strokeStyle=cssv("--ink"); g.lineWidth=2*dpr; g.beginPath(); g.moveTo(X(cur),0); g.lineTo(X(cur),H); g.stroke(); g.lineWidth=1; }
}

/* ---------- library (IndexedDB) ---------- */
const DB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open("voicecoach",1); r.onupgradeneeded=()=>r.result.createObjectStore("takes",{keyPath:"id"}); r.onsuccess=()=>{ this.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction("takes",mode), st=tx.objectStore("takes"), r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }); },
  put(o){ return this.tx("readwrite",s=>s.put(o)); }, all(){ return this.tx("readonly",s=>s.getAll()); }, del(id){ return this.tx("readwrite",s=>s.delete(id)); } };
function slimAn(an){ if(!an) return null; const o={}; ["ok","dur","floor","peak","f0med","sdSt","rate","pauseShare","meanDb","total","first","pauses","series","longPauses","uptalk","trail","phrasesChecked","noVoice","tooShort"].forEach(k=>{ if(an[k]!==undefined) o[k]=an[k]; }); return o; }
async function saveTake(take){
  const o={id:take.id||("t"+Date.now()+Math.random().toString(36).slice(2,6)), t:Date.now(), d:today(), kind:take.kind||"studio", title:take.title||"", lang:take.lang||SET.tl,
    blob:take.blob, video:!!take.video, an:slimAn(take.an), tips:take.tips?{fix:take.tips.fix,good:take.tips.good}:null, scores:take.scores||(take.tips&&take.tips.scores)||null, score:take.score??null, text:take.text||""};
  await DB.put(o); take.id=o.id;

}
function takeFileName(take){ return `voicecoach-${(take.kind||"take")}-${new Date(take.t||Date.now()).toISOString().slice(0,16).replace(/[:T]/g,"-")}.${(take.blob&&take.blob.type.includes("mp4"))?"mp4":"webm"}`; }

    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"VoiceCoach",text:(take.title||"")+(take.score!=null?` – ${take.score}/100`:"")}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  toast(t("share_fail"));
}

"use strict";

/* ---------- audio ---------- */
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(actx.state==="suspended") actx.resume(); return actx; }
function beep(f=880,d=.12,v=.15){ try{ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.frequency.value=f; g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.02);}catch(e){} }
function tone(f,d=2){ try{ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,c.currentTime); g.gain.linearRampToValueAtTime(.25,c.currentTime+.05); g.gain.setValueAtTime(.25,c.currentTime+d-.2); g.gain.linearRampToValueAtTime(0,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d+.05);}catch(e){} }
let wakeLock=null;
async function keepAwake(on){ try{ if(on&&"wakeLock" in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null);} if(!on&&wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }

/* ---------- text-to-speech (partner voice) ---------- */
function speak(text, lang, onend, rate){
  let done=false; const fin=()=>{ if(!done){ done=true; onend&&onend(); } };
  try{
    if(!("speechSynthesis" in window)) return fin();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=LOCALE[lang]; u.rate=rate||+SET.rate||1;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang));
    const pref=vs.find(v=>v.lang.replace("_","-")===LOCALE[lang])||vs[0]; if(pref) u.voice=pref;
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    setTimeout(fin, 1500+text.length*90/(rate||+SET.rate||1));
  }catch(e){ fin(); }
}
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){}

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let srBroken = !SR;
function recognizeOnce(lang, onInterim){
  return new Promise((resolve,reject)=>{
    let r; try{ r=new SR(); }catch(e){ srBroken=true; return reject("unsupported"); }
    r.lang=LOCALE[lang]; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    let finalTxt="", interim="", tFirst=null, tLast=null, err=null, confs=[];
    r.onresult=e=>{ const now=performance.now(); if(tFirst===null) tFirst=now; tLast=now; interim=""; finalTxt="";
      confs=[]; for(let i=0;i<e.results.length;i++){ const tr=e.results[i][0].transcript; if(e.results[i].isFinal){ finalTxt+=tr+" "; confs.push(e.results[i][0].confidence||0); } else interim+=tr+" "; }
      onInterim&&onInterim((finalTxt+interim).trim()); };
    r.onerror=e=>{ err=e.error; if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)) srBroken=true; };
    r.onend=()=>{ const text=(finalTxt||interim).trim(); if(err&&err!=="no-speech"&&!text) reject(err); else resolve({text,tFirst,tLast,confs}); };
    try{ r.start(); }catch(e){ srBroken=true; reject("start-failed"); }
    recognizeOnce.current=r;
  });
}
function stopRecognition(){ try{ recognizeOnce.current&&recognizeOnce.current.stop(); }catch(e){} }

/* ---------- text matching & scoring ---------- */
const norm = s => String(s).toLowerCase().replace(/ß/g,"ss").replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function parseKW(str){ return str.split(";").map(g=>g.split("|").map(a=>a.replace(/^\s+/,"")).filter(a=>a.trim())).filter(g=>g.length); }
function kwHit(textN, alt){ const whole=/\s$/.test(alt), k=norm(alt); if(!k) return false; const hay=" "+textN+" ";
  if(whole) return hay.includes(" "+k+" "); if(k.length>=5) return hay.includes(k); return hay.includes(" "+k); }
function scoreTurn({text,dur,latency,level,model,kw,lang}){
  const tn=norm(text), words=tn?tn.split(" "):[], groups=parseKW(kw);
  const hits=groups.map(g=>g.some(a=>kwHit(tn,a)));
  let content=groups.length?hits.filter(Boolean).length/groups.length:1;
  const mw=norm(model).split(" ");
  if(level===1){ const ms=new Set(mw), ws=new Set(words); let o=0; ms.forEach(w=>{ if(ws.has(w)) o++; }); content=0.5*content+0.5*(o/ms.size); }
  const complete=Math.min(1, words.length/(0.6*mw.length));
  const wpm = dur>1.5 ? words.length/(dur/60) : null;
  const pace = wpm===null?0.7 : wpm<110?Math.max(0,(wpm-60)/50) : wpm>170?Math.max(0,(230-wpm)/60) : 1;
  const fset=new Set(FILLERS[lang].map(norm)), fillers=words.filter(w=>fset.has(w)).length;
  const fluency=Math.max(0, 1-0.25*fillers-(latency!=null&&latency>4?0.3:0));
  const score=Math.round(100*(0.5*content+0.2*complete+0.15*pace+0.15*fluency));
  return {score,content,complete,pace,fluency,wpm,fillers,hits,groups,auto:true};
}

function cKey(id,lang){ return id+"."+lang; }
function getConv(id,lang){ return store.conv[cKey(id,lang)]||{lvl:1,mastered:false,box:0,due:0,best:{},n:0}; }
function setConv(id,lang,s){ store.conv[cKey(id,lang)]=s; save(); }
function dueList(){ const now=Date.now(), out=[]; SCENES.forEach(sc=>LANGS.forEach(l=>{ const s=getConv(sc.id,l); if(s.mastered&&s.due<=now) out.push({sc,l,s}); })); return out; }
function stepsPassed(s){ return s.mastered?3:Math.max(0,s.lvl-1); }

function renderScenes(){
  const box=$("#sceneList"); if(!box) return; box.innerHTML="";
  SCENES.filter(s=>s.ctx===SET.ctx).forEach(sc=>{
    const s=getConv(sc.id,SET.tl), due=s.mastered&&s.due<=Date.now();
    const status = s.mastered ? (due?`<span class="tag due">${t("due_now")}</span>`:`<span class="tag ok">${t("mastered")} ✓</span>`) : `<span class="tag">${t("lvl")} ${s.lvl}</span>`;
    const bestTxt=[1,2,3].map(l=>s.best[l]!=null?`${t("lvl")} ${l}: ${s.best[l]}`:null).filter(Boolean).join(" · ");
    const c=el("div",{class:"card"},`<div class="row"><b class="grow">${esc(sc.title[SET.ui])}</b>${status}</div>
      <div class="bar"><i style="width:${stepsPassed(s)/3*100}%"></i></div>
      <p class="muted">${bestTxt?t("best")+" – "+bestTxt:"&nbsp;"}${s.mastered&&!due?` · ${t("next_rev")}: ${new Date(s.due).toLocaleDateString()}`:""}</p>
      <div class="row lv"></div>`);
    const lv=c.querySelector(".lv");
    [1,2,3].forEach(l=>{ const unlocked = s.mastered || l<=s.lvl; const b=el("button",{class:"b sm grow"+(l===s.lvl&&!s.mastered?"":" alt")},`${l} · ${t("lvl"+l)}${unlocked?"":" 🔒"}`); b.disabled=!unlocked; b.onclick=()=>startAttempt(sc,SET.tl,l,"level"); lv.append(b); });
    if(s.mastered){ const b=el("button",{class:"b sm "+(due?"warm":"alt")},"↻ "+t("review")); b.onclick=()=>startAttempt(sc,SET.tl,3,"review"); lv.append(b); }
    box.append(c);
  });
}

let BR={p:0,run:false,raf:null};
function renderBreathPresets(){ chipSet($("#breathPresets"),BREATH.map((b,i)=>[i,b.name[SET.ui]]),BR.p,v=>{ if(BR.run) stopBreath(); BR.p=+v; renderBreathPresets(); }); $("#breathDesc").textContent=BREATH[BR.p].desc[SET.ui]; }
function stopBreath(){ BR.run=false; cancelAnimationFrame(BR.raf); $("#brStart").textContent=t("startb"); $("#ballLbl").textContent=t("br_ready"); $("#ball").style.transform="scale(.35)"; keepAwake(false); }
$("#brStart").onclick=()=>{
  if(BR.run){ stopBreath(); return; }
  ac(); keepAwake(true);
  const P=BREATH[BR.p].ph, cyc=P.reduce((a,p)=>a+p[1],0), rounds=+$("#brRounds").value, t0=performance.now(), PH=BREATH_PH[SET.ui];
  BR.run=true; $("#brStart").textContent=t("stopb"); let lastPh=-1,lastSec=-1;
  const step=now=>{ if(!BR.run) return;
    const tt0=(now-t0)/1000, r=Math.floor(tt0/cyc);
    if(r>=rounds){ stopBreath(); beep(990,.3); logSession(BREATH[BR.p].name[SET.ui],rounds*cyc/60); return; }
    $("#brRound").textContent=r+1; let tt=tt0-r*cyc,k=0; while(tt>P[k][1]){ tt-=P[k][1]; k++; }
    const prev=P[(k-1+P.length)%P.length][2], f=tt/P[k][1], s=prev+(P[k][2]-prev)*(0.5-0.5*Math.cos(Math.PI*f));
    $("#ball").style.transform=`scale(${s.toFixed(3)})`;
    const sec=Math.ceil(P[k][1]-tt); if(k!==lastPh){ lastPh=k; beep(k===0?660:520,.1,.1); }
    if(sec!==lastSec){ lastSec=sec; $("#ballLbl").innerHTML=PH[P[k][0]]+"<br>"+sec; }
    BR.raf=requestAnimationFrame(step); };
  BR.raf=requestAnimationFrame(step);
};
function stopwatch(disp,onStop){ let t0=0,h=null; return {running:()=>!!h, start(){ t0=performance.now(); h=setInterval(()=>disp.textContent=((performance.now()-t0)/1000).toFixed(1)+" s",50); }, stop(){ clearInterval(h); h=null; const v=(performance.now()-t0)/1000; disp.textContent=v.toFixed(1)+" s"; onStop(v); }}; }

    if(i>=words.length){ stop(); onDone&&onDone(); return; }
    sp[i].classList.add("now"); if(clickBox&&clickBox.checked) beep(1200,.03,.12);
    const w=words[i], base=60000/(+wpmIn.value), extra=/[.!?]$/.test(w)?base*.8:/[,;:]$/.test(w)?base*.4:0; i++; h=setTimeout(step,base+extra); }

const canRecord=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function startAttempt(sc,lang,level,mode,onlyTurns){
  ac(); keepAwake(true);

  $("#convList").classList.add("hidden"); $("#convPlayer").classList.remove("hidden");
  $("#cpTitle").textContent=sc.title[SET.ui]+" ("+lang.toUpperCase()+")";
  const pm=mode==="review"?PASS.review:PASS[level];
  $("#cpLevel").innerHTML=(mode==="review"?`↻ ${t("review")} – `:"")+`${t("lvl")} ${level} · ${t("lvl"+level)} – ${t("lvl_d"+level)} <b>(${t("res_need",{s:"–",n:pm}).split("·")[1].trim()})</b>`
    +(mode==="weak"?`<br><i>${t("weak_note")}</i>`:"")+(SET.mode==="text"?`<br><i>${t("txt_mode_note")}</i>`:"");
  if(curView!=="talk") show("talk"); window.scrollTo(0,0);
  renderTurn();
}
function closeAttempt(){ stopRecognition(); try{speechSynthesis.cancel();}catch(e){} keepAwake(false); ATT=null; $("#convPlayer").classList.add("hidden"); $("#convList").classList.remove("hidden"); renderScenes(); renderToday(); renderPlan(); }
$("#cpClose").onclick=closeAttempt;
function turnData(){ const A=ATT, ti=A.order[A.pos], [partner,taskTl,model,kw]=A.sc.turns[A.lang][ti], task=(A.sc.turns[SET.ui]&&A.sc.turns[SET.ui][ti]||[])[1]||taskTl; return {ti,partner,task,model,kw,groups:parseKW(kw)}; }
function stepsBar(){ const A=ATT; $("#cpSteps").innerHTML=A.order.map((_,k)=>`<i class="${k<A.pos||(k===A.pos&&A.res[A.order[k]])?'d':''}"></i>`).join(""); }

function renderTurn(){
  const A=ATT, d=turnData(); stepsBar();
  const cue = A.level===1 ? `<div class="card flat"><div class="muted">${t("model")}</div><div style="font-size:1.05rem" ${tlAttr(A.lang)}>${esc(d.model)}</div></div>`
            : A.level===2 ? `<div class="muted">${t("keypoints")}</div><div>${d.groups.map(g=>`<span class="kp" lang="${A.lang}">${esc(g[0].trim())}</span>`).join("")}</div>` : "";
  $("#cpBody").innerHTML=`<div class="muted" style="margin-top:8px">${t("turn")} ${A.pos+1}/${A.order.length} · ${t("partner")}</div>
    <div class="bubble them"><span ${tlAttr(A.lang)}>${esc(d.partner)}</span> <button class="b sm alt" id="pReplay" style="min-height:30px;padding:3px 9px">🔊</button></div>
    <div id="pbLine"></div>
    <p><b>${t("your_task")}:</b> ${esc(d.task)}</p>${cue}<div id="answerBox"></div>`;
  $("#pReplay").onclick=()=>speak(d.partner,A.lang);
  A.cur={readyT:null,tapT:null,pushed:false,first:null,hints:0};
  speak(d.partner,A.lang,()=>{ if(ATT===A&&A.cur.readyT===null) A.cur.readyT=performance.now(); });
  renderAnswer();
}
function renderAnswer(){
  const A=ATT, box=$("#answerBox"); box.innerHTML="";
  if(SET.mode==="text") return renderTextAnswer(box);
  if(!canRecord()){ box.innerHTML=`<div class="warnbox" style="margin:8px 0">${t("sr_off")}</div>`; return renderSelfRate(box); }
  const useSR = SET.mode==="auto" && !srBroken && store.flags.conc!==false;
  const wrap=el("div",{style:"margin-top:8px"}); box.append(wrap);
  recControls(wrap,{lang:useSR?A.lang:null,maxSec:150,label:t("speak"),onStart:tt=>{ A.cur.tapT=tt; if(A.cur.readyT===null) A.cur.readyT=tt; },onDone:r=>onSpoken(r,useSR)});
  const sb=el("button",{class:"b sm alt",style:"margin-top:6px"},t("rate_self")); sb.onclick=()=>{ box.innerHTML=""; renderSelfRate(box); }; box.append(sb);
}
function onSpoken(r,usedSR){
  const A=ATT; if(!A) return; const d=turnData();
  const an=analyze(r.pcm);
  if(usedSR){ const fatal=r.sr.err&&FATAL_SR.includes(r.sr.err), silent=!r.sr.text&&an.ok;
    if(fatal||silent){ A.srMiss++; if(fatal||A.srMiss>=2){ store.flags.conc=false; SET.mode="rec"; save(); toast(t("conc_note")); renderSettings(); } } }
  const latency=(A.cur.tapT!=null&&A.cur.readyT!=null)?Math.max(0,(A.cur.tapT-A.cur.readyT)/1000)+(an.ok?an.first:0):null;
  const sr=r.sr.text?r.sr:null;
  const tips=makeTips(an,{sr,lang:A.lang,expected:A.level===1?d.model:null,latency});
  const take={blob:r.blob,video:false,an,tips,kind:"conv",title:A.sc.title[SET.ui]+" – "+d.task,lang:A.lang,text:r.sr.text||""};
  if(sr) turnResult(convScore({text:sr.text,an,tips,d,level:A.level,lang:A.lang}),take);
  else renderSelfCheck(take);
}
function convScore({text=null,an=null,tips=null,d,level,lang,ticks=null,hints=0}){
  let hits,content;
  if(ticks){ hits=ticks; content=hits.filter(Boolean).length/hits.length; }
  else { const tn=norm(text||""); hits=d.groups.map(g=>g.some(a=>kwHit(tn,a))); content=hits.filter(Boolean).length/hits.length;
    if(level===1&&text){ const ms=new Set(norm(d.model).split(" ")), ws=new Set(tn.split(" ")); let o=0; ms.forEach(w=>{ if(ws.has(w)) o++; }); content=0.5*content+0.5*o/ms.size; } }
  const mw=norm(d.model).split(" ").length;
  const complete = text ? Math.min(1,norm(text).split(" ").length/(0.6*mw)) : (an&&an.ok ? Math.min(1,an.speak/(0.6*mw/2.4)) : 0);
  const del = tips&&tips.scores ? Object.values(tips.scores).reduce((a,b)=>a+b,0)/Object.values(tips.scores).length : null;
  let score = del!=null ? 0.45*content+0.15*complete+0.40*del : 0.6*content+0.4*complete;
  score=Math.max(0,Math.round(score*100)-5*hints);
  const fi = text ? fillerInfo(text,lang) : {n:0,words:[]};
  return {score,content,complete,delivery:del,hits,fillers:fi.words,dims:tips&&tips.scores,auto:!ticks,text};
}
function renderSelfCheck(take){
  const A=ATT, d=turnData(), box=$("#answerBox"); box.innerHTML="";
  box.append(replayView(take,{onSave:()=>saveTake(take)}));
  const w=el("div",{class:"card",style:"margin-top:8px"},`<p><b>${t("self_kp")}</b></p>`);
  d.groups.forEach((g,i)=>w.append(el("label",{class:"check"},`<input type="checkbox" data-i="${i}"> <span>${esc(g.map(x=>x.trim()).join(" / "))}</span>`)));
  const go=el("button",{class:"b warm",style:"width:100%"},t("score_it"));
  go.onclick=()=>{ const ticks=d.groups.map((_,i)=>w.querySelector(`[data-i="${i}"]`).checked); turnResult(convScore({an:take.an,tips:take.tips,d,level:A.level,lang:A.lang,ticks}),take); };
  w.append(go); box.append(w);
}
function renderSelfRate(box){
  const vals=[null,null,null,null], wrap=el("div",{},`<p><b>${t("self_title")}</b></p>`);
  ["self_c1","self_c2","self_c3","self_c4"].forEach((k,i)=>{ const r=el("div",{class:"rate-row"},`<div class="muted">${t(k)}</div><div class="chips"></div>`), ch=r.querySelector(".chips");
    const draw=()=>chipSet(ch,[0,1,2,3,4].map(n=>[n,String(n)]),vals[i],v=>{ vals[i]=+v; draw(); go.disabled=vals.some(x=>x===null); }); draw(); wrap.append(r); });
  const go=el("button",{class:"b warm",style:"width:100%"},t("score_it")); go.disabled=true;
  go.onclick=()=>turnResult({score:Math.round(vals.reduce((a,b)=>a+b,0)/16*100),self:vals,auto:false,hits:null,fillers:[]},null);
  wrap.append(go); box.append(wrap);
}
function renderTextAnswer(box){
  const A=ATT, d=turnData();
  box.innerHTML=`<textarea id="txtAns" placeholder="${esc(t("text_ph"))}"></textarea><p class="muted" id="hintOut"></p>
    <div class="row"><button class="b sm alt" id="hintBtn">${t("hint")}</button><span class="grow"></span><button class="b" id="sendBtn">${t("send")}</button></div>`;
  $("#hintBtn").onclick=()=>{ const tn=norm($("#txtAns").value), miss=d.groups.find(g=>!g.some(a=>kwHit(tn,a))); if(!miss) return; A.cur.hints++; A.hints++; $("#hintOut").textContent=t("hint_txt",{k:miss[0].trim()}); };
  $("#sendBtn").onclick=()=>{ const txt=$("#txtAns").value.trim(); if(!txt) return; turnResult(convScore({text:txt,d,level:A.level,lang:A.lang,hints:A.cur.hints}),null); };
}
function turnResult(res,take){
  const A=ATT, d=turnData(), ti=d.ti, pm=A.mode==="review"?PASS.review:PASS[A.level];
  // pushback: partner insists once when content is weak (levels 2–3, review)
  if(A.level>=2&&!A.cur.pushed&&res.hits&&res.content<0.6){
    A.cur.pushed=true; A.cur.first=res; const line=rnd(PUSHBACK[A.lang]);
    $("#pbLine").innerHTML=`<div class="bubble them" style="border-left:4px solid var(--accent2)">${esc(line)}</div><p class="muted">${t("pushback")}</p>`;
    speak(line,A.lang,()=>{ if(ATT===A) A.cur.readyT=performance.now(); }); A.cur.readyT=null; A.cur.tapT=null;
    renderAnswer(); return;
  }
  if(A.cur.first&&A.cur.first.score>res.score) res=Object.assign({},A.cur.first,{pushedBack:true});
  A.res[ti]=Object.assign(res,{take});
  const good=res.score>=pm, last=A.pos===A.order.length-1;
  const bars = res.self ? ["self_c1","self_c2","self_c3","self_c4"].map((k,i)=>`<div class="sc"><span>${t(k).split(":")[0]}</span><div class="bar"><i style="width:${res.self[i]*25}%"></i></div><b>${res.self[i]}/4</b></div>`).join("")
    : [["c_content",res.content],["c_complete",res.complete]].concat(res.delivery!=null?[["c_delivery",res.delivery]]:[]).map(([k,v])=>`<div class="sc"><span>${t(k)}</span><div class="bar"><i style="width:${Math.round(v*100)}%;background:${v>=.8?'var(--ok)':v>=.5?'var(--accent2)':'var(--warn)'}"></i></div><b>${Math.round(v*100)}</b></div>`).join("");
  const kps = res.hits ? `<div>${d.groups.map((g,i)=>`<span class="kp ${res.hits[i]?"hit":"miss"}">${res.hits[i]?"✓":"✗"} ${esc(g[0].trim())}</span>`).join("")}</div>` : "";
  const box=$("#answerBox"); box.innerHTML=`${res.text&&SET.mode!=="text"?`<div class="muted">${t("heard")}</div><div class="bubble me">${esc(res.text)}</div>`:res.text?`<div class="bubble me">${esc(res.text)}</div>`:""}
    <div class="card flat"><div class="scorebig" style="color:${good?'var(--ok)':'var(--accent2)'}">${res.score}</div>${bars}${kps}
    ${res.fillers&&res.fillers.length?`<p class="muted">${t("fb_fillers",{w:esc(res.fillers.join(", "))})}</p>`:""}</div>
    <div id="turnReplay"></div>
    ${A.level>1?`<details ${good?"":"open"}><summary>${t("model")}</summary><p>${esc(d.model)}</p></details>`:""}
    <div class="row"><button class="b alt grow" id="againBtn">${t("retry_turn")}</button><button class="b grow" id="nextBtn">${last?t("finish"):t("next_turn")}</button></div>
    ${res.auto&&take?`<p><button class="b sm alt" id="wrongBtn">${t("sr_wrong")}</button></p>`:""}`;
  if(take) $("#turnReplay").append(replayView(take,{onSave:()=>saveTake(take)}));
  beep(good?990:520,.15,.1);
  $("#againBtn").onclick=()=>{ delete A.res[ti]; A.cur={readyT:performance.now(),tapT:null,pushed:false,first:null,hints:0}; $("#pbLine").innerHTML=""; renderAnswer(); };
  $("#nextBtn").onclick=()=>{ if(last) finishAttempt(); else { A.pos++; renderTurn(); } };
  if($("#wrongBtn")) $("#wrongBtn").onclick=()=>renderSelfCheck(take);
  stepsBar();
}
function finishAttempt(){
  const A=ATT, R=A.order.map(i=>A.res[i]||{score:0}), avg=Math.round(R.reduce((a,r)=>a+r.score,0)/R.length);
  const pm=A.mode==="review"?PASS.review:PASS[A.level], passed=avg>=pm, s=getConv(A.sc.id,A.lang); let msg="";
  if(A.mode!=="weak"){
    s.n=(s.n||0)+1; s.best[A.level]=Math.max(s.best[A.level]||0,avg);
    if(A.mode==="level"&&passed){ if(A.level<3){ if(s.lvl<=A.level) s.lvl=A.level+1; } else if(!s.mastered){ s.mastered=true; s.box=1; s.due=Date.now()+INTERVALS[1]*DAY; msg=t("res_mastered"); } }
    if(A.mode==="review"){ if(passed){ s.box=Math.min(INTERVALS.length-1,(s.box||1)+1); s.due=Date.now()+INTERVALS[s.box]*DAY; msg=t("res_rev_ok",{d:INTERVALS[s.box]}); } else { s.mastered=false; s.lvl=2; s.box=0; s.due=0; msg=t("res_rev_fail"); } }
    setConv(A.sc.id,A.lang,s);
  }
  store.hist.push({t:Date.now(),d:today(),id:A.sc.id,lang:A.lang,ctx:A.sc.ctx,level:A.level,mode:A.mode,score:avg,pass:passed}); save();
  logSession(A.sc.title[SET.ui]+" – "+(A.mode==="review"?t("review"):t("lvl")+" "+A.level),(Date.now()-A.t0)/60000);
  markPlan(A.mode==="review"?"review":"talk");
  // feedback summary
  const allHits=[], allMiss=[], fill=new Set(), dimSum={}, dimN={};
  A.order.forEach(i=>{ const r=A.res[i]; if(!r) return; const g=parseKW(A.sc.turns[A.lang][i][3]);
    if(r.hits) r.hits.forEach((h,k)=>(h?allHits:allMiss).push(g[k][0].trim())); (r.fillers||[]).forEach(f=>fill.add(f));
    if(r.dims) for(const k in r.dims){ dimSum[k]=(dimSum[k]||0)+r.dims[k]; dimN[k]=(dimN[k]||0)+1; } });
  const dims=Object.keys(dimSum).map(k=>[k,dimSum[k]/dimN[k]]).sort((a,b)=>b[1]-a[1]);
  const worked=[], improve=[];
  if(allHits.length) worked.push(t("c_content")+": "+allHits.slice(0,8).map(esc).join(", "));
  dims.filter(x=>x[1]>=0.8).forEach(x=>worked.push(t("d_"+x[0])+" ("+Math.round(x[1]*100)+")"));
  if(allMiss.length) improve.push(t("keypoints")+": "+allMiss.slice(0,8).map(esc).join(", "));
  dims.filter(x=>x[1]<0.65).forEach(x=>improve.push(t("d_"+x[0])+" ("+Math.round(x[1]*100)+")"));
  if(fill.size) improve.push(t("fb_fillers",{w:esc([...fill].join(", "))}));
  if(A.hints) improve.push(t("hints_used",{n:A.hints}));
  const weak=A.order.filter(i=>A.res[i]&&A.res[i].score<pm);
  $("#cpBody").innerHTML=`<div class="scorebig" style="color:${passed?'var(--ok)':'var(--accent2)'};margin-top:10px">${avg}</div>
    <h2 style="text-align:center">${passed?t("res_pass"):t("res_fail")}</h2>
    <p style="text-align:center" class="muted">${t("res_need",{s:avg,n:pm})}</p>
    ${msg?`<div class="${passed?"okbox":"warnbox"}">${msg}</div>`:""}
    <table style="margin-top:10px">${A.order.map((i,k)=>`<tr><td>${k+1}.</td><td>${esc((A.sc.turns[SET.ui]||A.sc.turns[A.lang])[i][1])}</td><td><b style="color:${(A.res[i]?.score??0)>=pm?'var(--ok)':'var(--warn)'}">${A.res[i]?.score??"–"}</b></td></tr>`).join("")}</table>
    <h3>${t("fb_title")}</h3>
    ${worked.length?`<p><b>✓ ${t("fb_worked")}</b></p><ul class="list">${worked.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    ${improve.length?`<p><b>✗ ${t("fb_improve")}</b></p><ul class="list">${improve.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
    ${weak.length?`<details><summary>${t("fb_alt")}</summary>${weak.map(i=>`<p><i>${esc((A.sc.turns[SET.ui]||A.sc.turns[A.lang])[i][1])}</i><br><span ${tlAttr(A.lang)}>${esc(A.sc.turns[A.lang][i][2])}</span></p>`).join("")}</details>`:""}
    <div class="row" style="margin-top:12px" id="resBtns"></div>`;
  const rb=$("#resBtns"), sc=A.sc, lang=A.lang, lvl=A.level, mode=A.mode;
  const add=(label,cls,fn)=>{ const b=el("button",{class:"b grow "+cls},label); b.onclick=fn; rb.append(b); };
  if(!passed||mode==="weak") add(t("btn_repeat"),"",()=>startAttempt(sc,lang,mode==="review"?2:lvl,"level"));
  if(weak.length&&mode!=="weak") add(t("btn_weak"),"alt",()=>startAttempt(sc,lang,lvl,"weak",weak));
  if(passed&&mode==="level"&&lvl<3) add(t("btn_nextlvl"),"",()=>startAttempt(sc,lang,lvl+1,"level"));
  add(t("btn_back"),"alt",closeAttempt);
  beep(passed?1180:440,.35,.12); keepAwake(false); refreshStats();
}

/* ================= articulation: series check with error analysis (v3.2) ================= */
/* Rough grapheme → sound-class tokens, so that "Sonne" vs "Tonne" becomes s→t, "Schule" vs "Sule" ʃ→s */
const SND_TOKENS={de:/sch|ch|ck|ng|qu|ph|ß|[a-zäöü]/g, en:/sh|ch|th|ck|ng|qu|ph|wh|[a-z]/g, fr:/ch|gn|qu|ph|ou|au|eau|an|en|on|in|[a-zàâçéèêëîïôûùü]/g};
function sndClass(tok,next,lang){
  const v="aeiouyäöüàâéèêëîïôûùœ";
  if(lang==="de"){ return ({sch:"ʃ",ch:"ç",ck:"k",ng:"ŋ",qu:"kv",ph:"f",ß:"s",z:"ts",v:"f",w:"v",c:"k",j:"j",x:"ks"}[tok])||(v.includes(tok)?"V":tok); }
  if(lang==="en"){ if(tok==="c") return "eiy".includes(next||"")?"s":"k"; return ({sh:"ʃ",ch:"tʃ",th:"θ",ck:"k",ng:"ŋ",qu:"kw",ph:"f",wh:"w",x:"ks",j:"dʒ"}[tok])||(v.includes(tok)?"V":tok); }
  if(tok==="c") return "eiy".includes(next||"")?"s":"k"; if(tok==="g") return "eiy".includes(next||"")?"ʒ":"g";
  return ({ch:"ʃ",gn:"ɲ",qu:"k",ph:"f",ç:"s",j:"ʒ",ou:"V",au:"V",eau:"V",an:"Ṽ",en:"Ṽ",on:"Ṽ",in:"Ṽ",h:"",x:"ks"}[tok])??(v.includes(tok)?"V":tok);
}
function toSounds(word,lang){ const w=String(word).toLowerCase().replace(/[^a-zäöüßàâçéèêëîïôûùœ]/g,""); const toks=w.match(SND_TOKENS[lang])||[];
  if(lang==="fr"&&toks.length>2){ if(toks[toks.length-1]==="e") toks.pop(); if("tsdxz".includes(toks[toks.length-1])&&toks.length>2) toks.pop(); if(toks[toks.length-1]==="e"&&toks.length>2) toks.pop(); }
  const isV=x=>!!x&&/^[aeiouyäöüàâéèêëîïôûùœ]|^(ou|au|eau|an|en|on|in)$/.test(x);
  const out=[]; toks.forEach((tk,i)=>{ let c=sndClass(tk,toks[i+1]&&toks[i+1][0],lang); if(!c) return;
    if(lang==="fr"&&tk==="s"&&isV(toks[i-1])&&isV(toks[i+1])) c="z";
    if(c!=="V"&&c.length===1&&out[out.length-1]===c) return; [...(c.length===2&&c!=="tʃ"&&c!=="dʒ"?c:[c])].forEach(x=>{ if(!(x==="V"&&out[out.length-1]==="V")) out.push(x); }); }); return out; }
/* Levenshtein alignment over sound classes → list of operations */
function alignSounds(a,b){ const n=a.length,m=b.length,D=[...Array(n+1)].map(()=>new Array(m+1).fill(0));

  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  const ops=[]; let i=n,j=m;
  while(i>0||j>0){ if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){ if(a[i-1]!==b[j-1]) ops.unshift({op:"sub",a:a[i-1],b:b[j-1],i:i-1}); i--; j--; }
    else if(i>0&&D[i][j]===D[i-1][j]+1){ ops.unshift({op:"del",a:a[i-1],i:i-1}); i--; } else { ops.unshift({op:"ins",b:b[j-1],i}); j--; } }

const SND_LABEL={"ʃ":{de:"sch",en:"sh",fr:"ch"},"ç":{de:"ch",en:"ch",fr:"ch"},"θ":{en:"th"},"ʒ":{fr:"j",en:"zh",de:"j"},"ŋ":{de:"ng",en:"ng",fr:"ng"},"ts":{de:"z"},"tʃ":{en:"ch"},"dʒ":{en:"j"},"V":{de:"Vokal",en:"vowel",fr:"voyelle"},"Ṽ":{fr:"voyelle nasale",de:"Nasalvokal",en:"nasal vowel"},"ɲ":{fr:"gn"}};
const sndLabel=(c,l)=>(SND_LABEL[c]&&(SND_LABEL[c][l]||SND_LABEL[c].de||SND_LABEL[c].en))||c;
/* specific correction hints for typical substitutions: key "target>heard" */
const CONF_KEYS={"s>t":"stop","s>d":"stop","z>d":"stop","s>θ":"lisp","z>θ":"lisp","s>f":"lisp","s>ʃ":"s_sh","z>ʒ":"s_sh","ʃ>s":"sh_s","ʒ>z":"sh_s","ʃ>ç":"sh_s","ç>ʃ":"ch_sh","ç>s":"ch_sh","k>t":"front","g>d":"front","k>p":"front","t>k":"back","d>g":"back","r>l":"r_l","r>w":"r_w","r>v":"r_w","l>r":"l_r","r>V":"r_vowel","f>p":"f_p","v>b":"f_p","θ>f":"th","θ>s":"th","θ>t":"th","ð>d":"th","ʒ>ʃ":"voice","z>s":"voice","v>f":"voice","b>p":"voice","d>t":"voice","g>k":"voice","s>z":"devoice","p>b":"devoice","t>d":"devoice","k>g":"devoice","ts>s":"ts_s","ts>t":"ts_s"};
function wordDiagnosis(target,heardText,lang){
  const words=norm(heardText||"").split(" ").filter(Boolean), tn=norm(target);
  if(!words.length) return {ok:false,heard:"",hints:[{k:"h_unrec"}]};
  if(tn.includes(" ")){ // sentence: word-level check
    const hs=new Set(words), tw=tn.split(" "), miss=tw.filter(w=>!hs.has(w));
    const ok=miss.length/tw.length<=0.2; return {ok,heard:heardText,hints:ok?[]:[{k:"h_words",w:miss.join(", ")}],miss}; }
  if(words.includes(tn)) return {ok:true,heard:heardText,hints:[]};
  const T=toSounds(target,lang); let best=null;
  words.forEach(w=>{ const H=toSounds(w,lang), al=alignSounds(T,H); if(!best||al.dist<best.al.dist) best={w,H,al}; });
  const hints=[]; const al=best.al, rel=al.dist/Math.max(1,T.length);
  if(rel>0.6){ hints.push({k:"h_unrec"}); return {ok:false,heard:heardText,best:best.w,hints}; }
  const posOf=i=>i<=0?"pos_start":i>=T.length-1?"pos_end":"pos_mid";
  al.ops.slice(0,2).forEach(o=>{
    if(o.op==="sub"&&!(o.a==="V"&&o.b==="V")){ const key=CONF_KEYS[o.a+">"+o.b]; hints.push({k:"h_sub",a:sndLabel(o.a,lang),b:sndLabel(o.b,lang),pos:posOf(o.i),conf:key}); }
    else if(o.op==="del"){ if(o.i>=T.length-1) hints.push({k:"h_end",a:sndLabel(o.a,lang)}); else if(o.i===0) hints.push({k:"h_start",a:sndLabel(o.a,lang)}); else hints.push({k:"h_del",a:sndLabel(o.a,lang),pos:posOf(o.i)}); }
    else if(o.op==="ins") hints.push({k:"h_ins",b:sndLabel(o.b,lang)});
  });
  if(!hints.length) hints.push({k:"h_close"});
  return {ok:false,heard:heardText,best:best.w,hints};
}
function hintText(h){ const s=t(h.k,{a:h.a,b:h.b,w:h.w||"",pos:h.pos?t(h.pos):""}); return h.conf?s+" "+t("conf_"+h.conf):s; }

async function recordWord(w){
  const S=SER, isSent=w.includes(" "), maxMs=isSent?9000:4500; let floor=null, fl=[], started=false, quietSince=null, stopped=false;
  const stopNow=async()=>{ if(stopped||!S.take) return; stopped=true; const tk=S.take; S.take=null; $("#serState").textContent=t("analysing"); const r=await tk.stop(); evalWord(w,r); };
  S.stopNow=stopNow;
  try{
    S.take=await startTake({lang:S.auto?S.lang:null,onText:txt=>{ const h=$("#serHeard"); if(h){ h.classList.remove("hidden"); h.textContent=txt; } },
      onLevel:(db,sec)=>{ const lv=$("#serLv"); if(lv) lv.style.width=Math.max(0,Math.min(100,(db+70)/60*100))+"%";
        if(sec<0.3){ fl.push(db); return; } if(floor===null) floor=Math.min(-50,fl.reduce((a,b)=>a+b,0)/Math.max(1,fl.length));

}

}

const SUP_SENT={de:"Heute spreche ich ruhig, klar und kraftvoll – meine Stimme kommt aus dem Bauch.",

/* frame energies (10 ms) for any sound incl. voiceless fricatives */
function frameDb(pcm){ const hop=160,N=Math.floor(pcm.length/hop),db=new Float32Array(N); for(let i=0;i<N;i++){ let s=0; for(let j=i*hop;j<i*hop+hop;j++) s+=pcm[j]*pcm[j]; db[i]=10*Math.log10(s/hop+1e-10); } return db; }
/* spectral balance: low band (<1 kHz) vs high band (1–4 kHz) energy on voiced frames, dB. Higher = darker / less pressed. Heuristic only. */
function spectralBalance(pcm,an){
  if(!an||!an.ok) return null; const S=an.series; let lo=0,hi=0,yl=0,yh=0,px=0; const al=1-Math.exp(-2*Math.PI*1000/16000), ah=Math.exp(-2*Math.PI*1000/16000), a4=1-Math.exp(-2*Math.PI*4000/16000); let h4=0;
  for(let i=0;i<pcm.length;i++){ yl+=al*(pcm[i]-yl); yh=ah*(yh+pcm[i]-px); px=pcm[i]; h4+=a4*(yh-h4); const k=Math.floor(i/320); if(S.f0[k]>0){ lo+=yl*yl; hi+=h4*h4; } }
  return hi>0?10*Math.log10(lo/hi):null; }

/* ---- 1) diaphragm impulses ---- */
function pulseControls(box){
  const N=8; box.innerHTML=`<button class="b warm" style="width:100%" id="supGo">${t("sup_start")}</button>`;
  $("#supGo").onclick=async()=>{
    const per=60/SUP.tempo, dot=$("#supBeat"); $("#supGo").disabled=true; ac(); keepAwake(true);
    for(let k=4;k>=1;k--){ dot.textContent=k; dot.classList.add("on"); beep(k===1?1100:800,.08,.15); await new Promise(r=>setTimeout(r,per*500)); dot.classList.remove("on"); await new Promise(r=>setTimeout(r,per*500)); }
    let take; try{ take=await startTake({}); }catch(e){ micError(e); $("#supGo").disabled=false; return; }
    const t0=performance.now(), lead=0.4; dot.textContent="";
    for(let k=0;k<N;k++){ const due=t0+(lead+k*per)*1000; setTimeout(()=>{ dot.textContent=k+1; dot.classList.add("on"); try{ navigator.vibrate&&navigator.vibrate(40); }catch(e){} setTimeout(()=>dot.classList.remove("on"),150); },Math.max(0,due-performance.now())); }
    setTimeout(async()=>{ dot.textContent="…"; const r=await take.stop(); keepAwake(false); dot.textContent=t("sup_ready"); $("#supGo").disabled=false; pulseDone(r,lead,per,N); },(lead+N*per+0.8)*1000);
  };
}
function pulseDone(r,lead,per,N){
  const db=frameDb(r.pcm), floor=pctl(db,0.1), peak=pctl(db,0.99), thr=floor+Math.max(10,0.4*(peak-floor));
  const pulses=[]; for(let i=0;i<db.length;){ if(db[i]>thr){ let j=i,mx=-200; while(j<db.length&&db[j]>thr-3){ mx=Math.max(mx,db[j]); j++; } if(j-i>=3) pulses.push({s:i/100,e:j/100,d:(j-i)/100,pk:mx}); i=j+8; } else i++; }
  const beats=[...Array(N)].map((_,k)=>lead+k*per), errs=pulses.map(p=>Math.min(...beats.map(b=>Math.abs(p.s-b))));
  const nScore=Math.max(0,1-Math.abs(pulses.length-N)/N), meanErr=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:per;
  const timing=Math.max(0,1-meanErr/(per*0.5)), longP=pulses.filter(p=>p.d>0.35).length, crisp=pulses.length?1-longP/pulses.length:0;
  let gaps=0; for(let k=1;k<pulses.length;k++){ let mn=200; for(let i=Math.round(pulses[k-1].e*100);i<Math.round(pulses[k].s*100);i++) mn=Math.min(mn,db[i]); if(pulses[k-1].pk-mn>=15) gaps++; }
  const sep=pulses.length>1?gaps/(pulses.length-1):0, pk=pulses.map(p=>p.pk), m=pk.reduce((a,b)=>a+b,0)/(pk.length||1), sd=Math.sqrt(pk.reduce((a,b)=>a+(b-m)*(b-m),0)/(pk.length||1)), even=pulses.length?Math.max(0,Math.min(1,1-(sd-2)/6)):0;
  const scores={sup_count:nScore,sup_timing:timing,sup_crisp:crisp,sup_sep:sep,sup_even:even}, score=Math.round(100*Object.values(scores).reduce((a,b)=>a+b,0)/5);
  const fix=[],good=[];
  if(pulses.length<N) fix.push({txt:t("sup_t_few",{n:pulses.length,N})}); else if(pulses.length>N) fix.push({txt:t("sup_t_many",{n:pulses.length,N})}); else good.push(t("sup_g_count",{n:pulses.length}));
  if(timing<0.7) fix.push({txt:t("sup_t_timing",{ms:Math.round(meanErr*1000)})}); else good.push(t("sup_g_timing"));
  pulses.filter(p=>p.d>0.35).slice(0,2).forEach(p=>fix.push({t:p.s,txt:t("sup_t_long",{ms:Math.round(p.d*1000)})}));
  if(sep<0.7) fix.push({txt:t("sup_t_sep")}); else good.push(t("sup_g_sep"));
  if(even<0.7) fix.push({txt:t("sup_t_even",{v:(Math.round(sd*10)/10).toLocaleString(SET.ui)})}); else good.push(t("sup_g_even"));
  supResult({r,an:analyze(r.pcm,{minSpeech:20}),fix,good,scores,score,ex:"pulse",title:t("sup_pulse")+" "+SUP.tempo+" bpm"});
}
/* ---- 2) steady airflow on "ssss" ---- */
function flowDone(r){
  const db=frameDb(r.pcm), floor=pctl(db,0.1), peak=pctl(db,0.98), thr=floor+Math.max(8,0.35*(peak-floor));
  let best={s:0,e:0}; for(let i=0;i<db.length;){ if(db[i]>thr){ let j=i,gap=0; while(j<db.length&&(db[j]>thr||gap<15)){ gap=db[j]>thr?0:gap+1; j++; } j-=gap; if(j-i>best.e-best.s) best={s:i,e:j}; i=j+1; } else i++; }
  const dur=(best.e-best.s)/100, seg=Array.from(db.slice(best.s,best.e)).filter(v=>v>thr-6);
  const core=seg.slice(Math.floor(seg.length*0.1),Math.floor(seg.length*0.9)), m=core.reduce((a,b)=>a+b,0)/(core.length||1), sd=Math.sqrt(core.reduce((a,b)=>a+(b-m)*(b-m),0)/(core.length||1));

let AB={};
function abStep(n){

function abDone(){
  const A=AB[1],B=AB[2], f1=x=>x==null?"–":(Math.round(x*10)/10).toLocaleString(SET.ui);

  const cA=A.tips.scores.clarity, cB=B.tips.scores.clarity, trA=A.an.trail.length, trB=B.an.trail.length;
  const rows=[[t("m_loud"),f1(A.an.meanDb)+" dBFS",f1(B.an.meanDb)+" dBFS",B.an.meanDb-A.an.meanDb>=1.5],

  if(cA!=null&&cB!=null) rows.push([t("d_clarity"),Math.round(cA*100)+" %",Math.round(cB*100)+" %",cB>=cA]);

    <p class="muted" style="font-size:.78rem">${t("sup_bal_note")}</p>`;
  const o=supResult({r:B.r,an:B.an,fix,good,scores:{},score,ex:"ab",title:t("sup_ab"),extra});
  const det=el("details",{},`<summary>${t("sup_A")}</summary>`); det.append(replayView({blob:A.r.blob,an:A.an,tips:A.tips})); o.append(det);

  const rc=el("div"); box.append(rc);
  const cancel=el("button",{class:"b sm alt",style:"margin-top:8px"},t("cancel")); cancel.onclick=()=>{ TEST=null; renderTest(); }; box.append(cancel);
  recControls(rc,{lang:srLang(),maxSec:n===1?90:45,onDone:r=>{ TEST.parts.push({r,an:analyze(r.pcm)}); if(n===1) testStep(2); else testFinish(); }});
}
function testFinish(){
  const [p1,p2]=TEST.parts, passage=PASSAGES[SET.tl].cas[1], box=$("#testBody");
  const d1=deliveryScores(p1.an)||{}, d2=deliveryScores(p2.an,{statements:true})||{};
  const av=(a,b)=>a!=null&&b!=null?(a+b)/2:(a??b??null);
  const dims={pace:d1.pace??d2.pace??null, pauses:av(d1.pauses,d2.pauses), melody:av(d1.melody,d2.melody), projection:av(d1.projection,d2.projection)};
  const cl=srClarity(p1.r.sr.text?p1.r.sr:null,passage); if(cl) dims.clarity=cl.score;
  if(p2.r.sr.text){ const fi=fillerInfo(p2.r.sr.text,SET.tl); dims.fluency=clamp01(1-0.2*fi.n-0.1*(p2.an.longPauses||[]).length); }
  else if(p2.an.ok) dims.fluency=clamp01(1-0.15*p2.an.longPauses.length-(p2.an.first>4?0.2:0));
  Object.keys(dims).forEach(k=>{ if(dims[k]==null) delete dims[k]; });
  if(!Object.keys(dims).length){ TEST=null; renderTest(); toast(t("tip_noise")); return; }
  const ranked=Object.entries(dims).sort((a,b)=>b[1]-a[1]), score=avgScore(dims);
  const pr={d:today(),t:Date.now(),score,dims,f0:p1.an.f0med||p2.an.f0med||0,strengths:ranked.slice(0,2).map(x=>x[0]),focus:ranked.slice(-2).reverse().map(x=>x[0])};
  store.profile=pr; store.tests.push(pr);
  const td=store.plan[today()]; if(td&&!Object.keys(td.done).length) delete store.plan[today()];
  save(); TEST=null; logSession(t("test_title"),1.5); renderPlan();
  box.innerHTML=`<h3>${t("test_result")}</h3>${profileHtml(pr)}`;
  [[p1,passage,"test-1"],[p2,null,"test-2"]].forEach(([p,exp,k],i)=>{ const tips=makeTips(p.an,{sr:p.r.sr.text?p.r.sr:null,expected:exp}), sc=tips.scores;
    const take={blob:p.r.blob,an:p.an,tips,scores:sc,score:avgScore(sc),kind:k,title:t("test_title")+" "+(i+1)+"/2",lang:SET.tl,text:p.r.sr.text||""};
    const det=el("details",{},`<summary>${t("replay_title")} – ${i+1}/2</summary>`); det.append(replayView(take,{saved:true})); box.append(det);
    saveTake(take).catch(()=>{}); });
  const again=el("button",{class:"b alt",style:"width:100%;margin-top:8px"},t("test_retake")); again.onclick=()=>testStep(1); box.append(again);
}

/* ---------- library ---------- */
async function renderLibrary(){
  const L=$("#libList"); if(!L) return; L.innerHTML="";
  let all=[]; try{ all=await DB.all(); }catch(e){ L.innerHTML=`<p class="muted">${t("lib_fail")}</p>`; return; }
  all.sort((a,b)=>b.t-a.t);
  if(!all.length){ L.innerHTML=`<p class="muted">${t("lib_empty")}</p>`; return; }
  all.slice(0,100).forEach(o=>{ const r=el("div",{class:"planitem"},`<span class="ck">${o.video?"🎥":"🎙"}</span><span class="grow"><b>${esc(o.title||o.kind)}</b><br><span class="muted">${o.d} · ${o.lang.toUpperCase()} · ${o.kind}${o.score!=null?" · "+o.score:""}</span></span>`);
    const pb=el("button",{class:"b sm"},"▶"), db=el("button",{class:"b sm alt"},"🗑");
    pb.onclick=()=>{ const out=$("#libOut"); out.innerHTML=""; out.append(replayView(o,{saved:true})); out.scrollIntoView({behavior:"smooth"}); };
    db.onclick=async()=>{ if(db.dataset.sure){ await DB.del(o.id); renderLibrary(); $("#libOut").innerHTML=""; } else { db.dataset.sure="1"; db.textContent=t("del")+"?"; db.style.background="var(--warn)"; db.style.color="#fff"; } };
    r.append(pb,db); L.append(r); });
}
const _renderProgress=renderProgress;
renderProgress=function(){ _renderProgress();
  const {g,W,H,dpr}=prepCanvas($("#testChart"),150), ts=store.tests.slice(-20);
  const Y=v=>H-12*dpr-v/100*(H-22*dpr), X=i=>26*dpr+(ts.length<2?.5:i/(ts.length-1))*(W-36*dpr);
  g.strokeStyle=cssv("--line"); g.fillStyle=cssv("--muted"); [0,50,100].forEach(v=>{ g.beginPath(); g.moveTo(22*dpr,Y(v)); g.lineTo(W,Y(v)); g.stroke(); g.fillText(v,2,Y(v)+3*dpr); });
  if(!ts.length){ g.fillText(t("nothing"),30*dpr,24*dpr); }
  g.strokeStyle=cssv("--accent"); g.lineWidth=2*dpr; g.beginPath(); ts.forEach((x,i)=>i?g.lineTo(X(i),Y(x.score)):g.moveTo(X(i),Y(x.score))); g.stroke();
  g.fillStyle=cssv("--accent"); ts.forEach((x,i)=>{ g.beginPath(); g.arc(X(i),Y(x.score),3.5*dpr,0,7); g.fill(); });
  $("#testDims").innerHTML=store.profile?scoreBars(store.profile.dims):"";
  renderLibrary();
};
