<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>VoiceCoach – Speech, Voice &amp; Communication Trainer</title>
<!--MANIFEST-->
<style>
/* ===== VoiceCoach design system – Apple Human Interface Guidelines (v6.2) =====
   semantic colours (light/dark), system type scale with Dynamic Type, grouped inset layout, 44-pt targets */
:root{
 --bg:#F2F2F7; --card:#FFFFFF; --soft:#F2F2F7; --fill:rgba(118,118,128,.12); --ink:#000000; --muted:#5F5F66; --line:#D1D1D6; --sep:rgba(60,60,67,.18);
 --accent:#0B7A6E; --tint:#0B7A6E; --onaccent:#FFFFFF; --accent2:#C2410C; --rec:#C2410C; --warn:#C4001A; --ok:#1E7B34;
 --bar:rgba(249,249,249,.86); --r:12px; --r2:10px; --shadow:0 1px 2px rgba(0,0,0,.04);
 --fs-large:2.125rem; --fs-t1:1.75rem; --fs-t2:1.375rem; --fs-t3:1.25rem; --fs-head:1.0625rem; --fs-body:1.0625rem; --fs-call:1rem; --fs-sub:.9375rem; --fs-foot:.8125rem; --fs-cap:.75rem;
 color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{
 --bg:#000000; --card:#1C1C1E; --soft:#2C2C2E; --fill:rgba(118,118,128,.24); --ink:#FFFFFF; --muted:#AEAEB2; --line:#38383A; --sep:rgba(84,84,88,.6);
 --accent:#0E8A7C; --tint:#4FD1C0; --accent2:#FF8A4C; --rec:#C2410C; --warn:#FF6961; --ok:#32D74B; --bar:rgba(22,22,24,.86); --shadow:none}}
@supports (font:-apple-system-body){html{font:-apple-system-body}}   /* iOS Dynamic Type */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:var(--fs-body);line-height:1.38;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:8px}
/* navigation bar (translucent material) */
header{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:calc(env(safe-area-inset-top) + 6px) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left));min-height:calc(44px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border-bottom:.5px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--sep)}
header h1{font-size:var(--fs-head);font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
header.scrolled h1{opacity:1}
header .ver{display:none}
header .badge{font-size:var(--fs-foot);color:var(--muted);font-variant-numeric:tabular-nums}
.pill{border:0;background:var(--fill);color:var(--tint);border-radius:99px;padding:0 12px;min-height:34px;font:600 var(--fs-sub)/1 inherit;font-family:inherit;display:inline-flex;align-items:center;gap:6px;position:relative}
.pill::after{content:"";position:absolute;inset:-5px -2px}
/* large title + segmented control */
#viewHead{padding:4px 0 8px}
#viewHead .lt{font-size:var(--fs-large);font-weight:700;letter-spacing:.01em;line-height:1.2;margin:2px 4px 8px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:0 0 6px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:500 var(--fs-sub)/1.15 inherit;font-family:inherit;min-height:34px;border-radius:7px;padding:6px 4px;position:relative}
.seg button::after{content:"";position:absolute;inset:-5px 0}
.seg button[aria-selected=true]{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button[aria-selected=true]{background:#636366}}
main{padding:0 max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:760px;margin:0 auto}
/* tab bar (translucent material) */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:grid;grid-template-columns:repeat(var(--tabs,5),1fr);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav button{background:none;border:0;color:#8E8E93;padding:7px 0 5px;min-height:49px;font:500 .625rem/1.1 inherit;font-family:inherit;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:26px;height:26px}
nav button .f{display:none} nav button[aria-selected=true] .f{display:inline} nav button[aria-selected=true] .o{display:none}
nav button[aria-selected=true]{color:var(--tint)}
section.view{display:none} section.view.on{display:block}
/* grouped inset cards */
.card{background:var(--card);border:0;border-radius:var(--r);padding:16px;margin:0 0 20px;box-shadow:var(--shadow)}
.card.flat{background:var(--soft);border:0;box-shadow:none;border-radius:var(--r2);padding:12px 14px}
@media (prefers-color-scheme:dark){.card.flat{background:var(--soft)}}
.card h2{font-size:var(--fs-t3);font-weight:700;letter-spacing:.01em;margin:0 0 6px;line-height:1.25}
.card h3{font-size:var(--fs-head);font-weight:600;margin:14px 0 6px}
p{margin:6px 0} .muted{color:var(--muted);font-size:var(--fs-sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .grow{flex:1}
/* buttons: filled (primary), tinted/grey (secondary), record */
button{font-family:inherit}
button.b{border:0;border-radius:var(--r);padding:12px 16px;font-size:var(--fs-head);font-weight:600;background:var(--accent);color:var(--onaccent);min-height:50px;transition:opacity .15s,transform .1s;position:relative}
button.b:active{opacity:.75;transform:scale(.985)}
button.b.alt{background:var(--fill);color:var(--tint)}
button.b.warm{background:var(--rec);color:#fff}
button.b.sm{padding:6px 14px;min-height:34px;font-size:var(--fs-sub);border-radius:99px}
button.b.sm::after{content:"";position:absolute;inset:-5px -2px}
button.b:disabled{opacity:.35}
button.b.full{width:100%;text-align:left;margin:4px 0}
button.b:not(.alt) .muted{color:rgba(255,255,255,.88)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:0;background:var(--fill);color:var(--ink);border-radius:99px;padding:6px 14px;min-height:34px;font-size:var(--fs-sub);font-family:inherit;position:relative;transition:background .15s}
.chip::after{content:"";position:absolute;inset:-5px -2px}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.chip:disabled{opacity:.4}
select,input[type=text],input[type=number],input[type=email],input:not([type]){font:inherit;font-size:var(--fs-body);min-height:44px;padding:8px 12px;border-radius:var(--r2);border:0;background:var(--fill);color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:22px;height:22px;vertical-align:middle}
input[type=file]{font-size:var(--fs-sub)}
textarea{width:100%;min-height:90px;font:inherit;font-size:var(--fs-body);padding:12px;border-radius:var(--r2);border:0;background:var(--fill);color:var(--ink)}
.big{font-size:2.5rem;font-weight:700;text-align:center;margin:6px 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.huge{font-size:2rem;font-weight:700;text-align:center;padding:20px 8px;min-height:100px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{background:var(--soft);border-radius:var(--r2);padding:10px 4px;text-align:center}
.stat b{display:block;font-size:var(--fs-t2);font-variant-numeric:tabular-nums} .stat span{font-size:var(--fs-cap);color:var(--muted)}
/* disclosure rows */
details{border-top:.5px solid var(--sep);padding:10px 0 4px}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(45deg)}
dl dt{font-weight:600;margin-top:10px} dl dd{margin:2px 0 0;color:var(--muted);font-size:var(--fs-sub)}
.warnbox,.okbox{background:var(--soft);padding:12px 14px;border-radius:var(--r2);font-size:var(--fs-sub);border-left:0;position:relative;padding-left:40px}
.warnbox::before,.okbox::before{position:absolute;left:12px;top:11px;width:20px;height:20px;border-radius:50%;color:#fff;font:700 13px/20px -apple-system,sans-serif;text-align:center}
.warnbox::before{content:"!";background:var(--warn)} .okbox::before{content:"✓";background:var(--ok)}
canvas{width:100%;display:block;border-radius:var(--r2);background:var(--soft)}
.meter{height:20px;border-radius:10px;background:var(--fill);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ok),var(--accent2),var(--warn));width:0}
.meter u{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.5}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.breath{width:210px;height:210px;margin:10px auto;position:relative;display:flex;align-items:center;justify-content:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.breath .ball{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2BB3A3,#0B5C53);transform:scale(.35);opacity:.92}
.breath .lbl{position:absolute;color:#fff;font-weight:700;text-align:center;font-size:var(--fs-head);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.reader{font-size:1.25rem;line-height:1.7} .reader span{padding:1px 2px;border-radius:5px}
.reader span.now{background:var(--accent2);color:#fff} .reader span.done{color:var(--muted)}
.list{margin:0;padding-left:20px} .list li{margin:4px 0}
.step{display:flex;gap:5px;margin:8px 0} .step i{flex:1;height:4px;border-radius:2px;background:var(--fill)} .step i.d{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-foot)} td,th{border-bottom:.5px solid var(--sep);padding:7px 4px;text-align:left;vertical-align:top}
.tap{width:100%;min-height:110px;font-size:1.5rem;border-radius:20px}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);padding:12px 18px;border-radius:14px;font-size:var(--fs-sub);font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.18);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.cents{position:relative;height:34px;background:var(--fill);border-radius:10px;margin:6px 0}
.cents b{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--accent2);left:50%;transform:translateX(-3px)}
.cents::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--ok)}
.cents .z{position:absolute;left:40%;right:40%;top:0;bottom:0;background:rgba(48,209,88,.18)}
/* messages */
.bubble{border-radius:18px;padding:10px 14px;margin:8px 0;font-size:var(--fs-body);line-height:1.38}
.bubble.them{background:var(--soft);border-bottom-left-radius:5px;margin-right:28px}
.bubble.me{background:var(--accent);color:#fff;border-bottom-right-radius:5px;margin-left:28px}
.card .bubble.them{background:var(--soft)}
.tag{display:inline-block;font-size:var(--fs-cap);font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill);color:var(--ink);margin-right:4px;vertical-align:middle}
.tag.ok{background:var(--ok);color:#fff} .tag.due{background:var(--accent2);color:#fff} .tag.lock{opacity:.5}
@media (prefers-color-scheme:dark){.tag.ok{color:#000}}
.kp{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:99px;border:1px dashed var(--tint);font-size:var(--fs-sub)}
.kp.hit{background:var(--ok);border:1px solid var(--ok);color:#fff} .kp.miss{border-color:var(--warn);color:var(--warn)}
@media (prefers-color-scheme:dark){.kp.hit{color:#000}}
.sc{display:grid;grid-template-columns:minmax(96px,34%) 1fr 44px;gap:8px;align-items:center;font-size:var(--fs-sub);margin:4px 0}
.sc b{text-align:right;font-variant-numeric:tabular-nums}
.scorebig{font-size:2.75rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s}
.sheet .card{width:100%;max-width:760px;margin:0;border-radius:14px 14px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;position:relative;animation:sheetup .28s cubic-bezier(.2,.8,.2,1)}
.sheet .card::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--line)}
@keyframes sheetup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}} @keyframes fadein{from{opacity:0}to{opacity:1}}
.rate-row{margin:8px 0} .rate-row .chips{margin:3px 0}
.tiprow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:var(--fs-sub)} .tiprow button{flex:none}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:8px 0} .cal i{aspect-ratio:1;border-radius:4px;background:var(--fill);position:relative;overflow:hidden}
.cal i b{position:absolute;left:0;right:0;bottom:0;background:var(--ok)} .cal i.today{outline:2px solid var(--tint)}
.planitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep);min-height:52px} .planitem .ck{font-size:1.3rem;width:28px;text-align:center}
.planitem.done .grow{opacity:.55;text-decoration:line-through}
.lesson{border-top:.5px solid var(--sep);padding:8px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:var(--fs-call);min-height:30px} .check input{flex:none}
.beatdot{width:120px;height:120px;margin:12px auto;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;transition:transform .08s,background .08s}
.beatdot.on{background:var(--accent2);color:#fff;transform:scale(1.15)}
.dots{display:inline-flex;gap:4px;vertical-align:middle} .dots i{width:10px;height:10px;border-radius:50%;background:var(--fill);display:inline-block} .dots i.on{background:var(--ok)} .dots i.bad{background:var(--warn)} .dots.big i{width:18px;height:18px}
b.stress{color:var(--accent2);text-decoration:underline} .pmark{color:var(--tint);font-weight:700}
.tipbtn{flex:none;margin-left:auto}
a{color:var(--tint)}
video{border-radius:var(--r2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
@media (min-width:900px){main{padding-top:8px}}
</style>
</head>
<body>
<header>
  <h1>VoiceCoach <span class="ver">v__VERSION__</span></h1>
  <span class="badge" id="streakBadge"></span>
  <button class="pill hidden" id="installBtn" data-t="install"></button>
  <button class="pill" id="setBtn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm8.3 4.6-1.6-.9a6.9 6.9 0 0 0 0-2.6l1.6-.9a.6.6 0 0 0 .2-.8l-1.6-2.8a.6.6 0 0 0-.8-.2l-1.6.9a7 7 0 0 0-2.2-1.3V2.8a.6.6 0 0 0-.6-.6H10.3a.6.6 0 0 0-.6.6v1.8a7 7 0 0 0-2.2 1.3l-1.6-.9a.6.6 0 0 0-.8.2L3.5 8a.6.6 0 0 0 .2.8l1.6.9a6.9 6.9 0 0 0 0 2.6l-1.6.9a.6.6 0 0 0-.2.8l1.6 2.8a.6.6 0 0 0 .8.2l1.6-.9a7 7 0 0 0 2.2 1.3v1.8a.6.6 0 0 0 .6.6h3.2a.6.6 0 0 0 .6-.6v-1.8a7 7 0 0 0 2.2-1.3l1.6.9a.6.6 0 0 0 .8-.2l1.6-2.8a.6.6 0 0 0-.2-.8z"/></svg><span id="setSummary"></span></button>
</header>

<div class="sheet hidden" id="settings"><div class="card">
  <h2 data-t="set_title"></h2>
  <h3 data-t="set_ui"></h3><div class="chips" id="setUi"></div>
  <h3 data-t="set_train"></h3><div class="chips" id="setTl"></div>
  <h3 data-t="set_ctx"></h3><div class="chips" id="setCtx"></div>
  <div id="setProf"></div>
  <div id="setVoice"></div>
  <h3 data-t="set_mode"></h3><div class="chips" id="setMode"></div>
  <div id="setMic"></div>
  <h3><span data-t="set_rate"></span>: <span id="rateVal"></span></h3>
  <input type="range" id="setRate" min="0.6" max="1.3" step="0.05">
  <div class="row" style="margin-top:12px"><span class="grow"></span><button class="b" id="setClose" data-t="set_close"></button></div>
</div></div>

<div class="sheet hidden" id="coachSheet"><div class="card" id="coachBody" style="max-height:92vh"></div></div>

<main>
<!-- TODAY -->
<section class="view on" id="v-today">
  <div class="card" id="goalCard"><h2 data-t="goal_title"></h2><p class="muted" data-t="goal_desc"></p><div id="goalBody"></div></div>
  <div class="card"><div class="row"><h2 class="grow" style="margin:0" data-t="plan_title"></h2><b id="planCount"></b></div>
    <p class="muted" data-t="plan_desc"></p><div id="planList"></div><p class="muted hidden" id="planNoTest" data-t="plan_notest"></p>
    <div class="cal" id="planCal"></div><p class="muted" style="font-size:.75rem" data-t="plan_cal"></p></div>
  <div class="card" id="coachCard"><h2 data-t="coach_title"></h2><p class="muted" data-t="coach_desc"></p><div id="coachList"></div></div>
  <div class="card"><h2 data-t="due_title"></h2><div id="dueList"></div></div>
  <div class="card"><h2 data-t="next_title"></h2><div id="nextBox"></div></div>
  <div class="card">
    <h2 data-t="week_title"></h2>
    <div class="stat">
      <div><b id="stSessions">0</b><span data-t="st_sessions"></span></div>
      <div><b id="stMinutes">0</b><span data-t="st_minutes"></span></div>
      <div><b id="stStreak">0</b><span data-t="st_streak"></span></div>
      <div><b id="stDue">0</b><span data-t="st_due"></span></div>
    </div>
    <p class="muted" data-t="week_note"></p>
  </div>
  <div class="card" id="lessonCard"><h2 data-t="lessons_title"></h2><p class="muted" data-t="lessons_desc"></p><div id="lessonList"></div></div>
  <div class="card"><h2 data-t="routines_title"></h2><p class="muted" data-t="routines_desc"></p><div id="routineList"></div></div>
  <div class="card hidden" id="routinePlayer">
    <div class="row"><b class="grow" id="rpTitle"></b><button class="b sm alt" id="rpClose" data-t="close"></button></div>
    <div class="step" id="rpSteps"></div>
    <h2 id="rpStepTitle" style="margin-top:8px"></h2>
    <p id="rpStepText"></p><p class="muted" id="rpStepWhy"></p>
    <div class="big" id="rpTime">0:00</div>
    <div class="row"><button class="b alt grow" id="rpPrev" data-t="back"></button><button class="b grow" id="rpPlay" data-t="startb"></button><button class="b alt grow" id="rpNext" data-t="next"></button></div>
  </div>
  <div class="card"><h2 data-t="howto_title"></h2><div data-t="howto_html"></div><div class="warnbox" data-t="warn_html" style="margin-top:10px"></div></div>
  <div class="card"><details><summary data-t="gloss_title"></summary><dl id="glossary"></dl></details></div>
</section>

<!-- TALK -->
<section class="view" id="v-talk">
  <div class="card" id="flowCard"></div>
  <div class="card" id="liveCard"></div>
  <div id="convList">
    <div class="card">
      <h2 data-t="talk_title"></h2>
      <p class="muted" data-t="talk_desc"></p>
      <div class="chips" id="talkCtx"></div>
      <div class="chips" id="talkTl"></div>
      <details><summary data-t="grading_title"></summary><div data-t="grading_html" class="muted"></div></details>
    </div>
    <div id="sceneList"></div>
    <div class="card" id="impCard">
      <h2 data-t="imp_title"></h2><p class="muted" data-t="imp_desc"></p>
      <div class="huge" id="topicBox" style="font-size:1.3rem"></div>
      <div class="chips" id="topicDur"></div>
      <div class="big" id="topicTime">1:00</div>
      <div class="row"><button class="b alt grow" id="topicNew" data-t="imp_new"></button><button class="b grow" id="topicStart" data-t="startb"></button></div>
      <div id="impRec" style="margin-top:8px"></div><div id="impOut"></div>
    </div>
    <div class="card">
      <h2 data-t="filler_title"></h2><p class="muted" data-t="filler_desc"></p>
      <button class="b warm tap" id="fillTap"></button>
      <div class="row" style="margin-top:8px"><span class="grow"><span data-t="time"></span>: <b id="fillTime">0:00</b> · <b id="fillRate">–</b> <span data-t="per_min"></span></span>
        <button class="b alt sm" id="fillStart" data-t="start_timer"></button><button class="b alt sm" id="fillSave" data-t="save"></button></div>
    </div>
  </div>

  <div id="convPlayer" class="hidden">
    <div class="card">
      <div class="row"><b class="grow" id="cpTitle"></b><button class="b sm alt" id="cpClose" data-t="close"></button></div>
      <div class="muted" id="cpLevel"></div>
      <div class="step" id="cpSteps"></div>
      <div id="cpBody"></div>
    </div>
  </div>
</section>

<!-- VIDEO -->
<section class="view" id="v-video">
  <div class="card" id="visCard"></div>
</section>

<!-- SPEECH -->
<section class="view" id="v-speech">
  <div class="card" id="consCard"></div>
  <div class="card" id="flowTeaser"></div>
  <div class="card" id="artCard">
    <div class="row"><h2 class="grow" style="margin:0" data-t="art_title"></h2><div class="chips" id="speechTl"></div></div>
    <p class="muted" data-t="art_desc"></p>
    <div class="chips" id="soundChips"></div>
    <div class="chips" id="posChips"></div>
    <p class="muted" id="soundTip"></p>
    <div class="card flat">
      <div class="huge tl" id="drillWord">–</div>
      <p class="muted" id="drillHeard" style="text-align:center;min-height:1.2em"></p>
      <div class="row">
        <button class="b alt" id="drillPrev">◀</button>
        <button class="b grow" id="drillCheck" data-t="art_check"></button>
        <button class="b alt" id="drillOk" style="background:var(--ok);color:#fff">✓</button>
        <button class="b alt" id="drillBad" style="background:var(--warn);color:#fff">✗</button>
        <button class="b alt" id="drillNext">▶</button>
      </div>
      <div class="bar" style="margin-top:10px"><i id="artBar" style="width:0"></i></div>
      <p class="muted" id="artMastery"></p>
      <p class="muted" id="drillCount"></p>
    </div>
    <div id="serBox"></div>
  </div>
  <div class="card">
    <h2 data-t="pairs_title"></h2><p class="muted" data-t="pairs_desc"></p>
    <div class="huge tl" id="pairBox">–</div>
    <div class="row"><button class="b grow" id="pairNext" data-t="pairs_new"></button><button class="b alt grow" id="pairPick" data-t="pairs_pick"></button></div>
    <p class="muted" id="pairPicked"></p>
  </div>
  <div class="card" id="twCard">
    <h2 data-t="tw_title"></h2><p class="muted" data-t="tw_desc"></p>
    <select class="tl" id="twSelect" style="width:100%"></select>
    <div class="reader card tl" id="twReader" style="margin-top:10px"></div>
    <label class="muted"><span data-t="speed"></span>: <span id="twWpmVal">60</span> WPM</label>
    <input type="range" id="twWpm" min="30" max="200" step="5" value="60">
    <div class="row"><label class="muted grow"><input type="checkbox" id="twClick"> <span data-t="metronome"></span></label><button class="b" id="twStart" data-t="startb"></button></div>
    <div id="twRec" style="margin-top:8px"></div><div id="twOut"></div>
  </div>
  <div class="card" id="paceCard">
    <h2 data-t="read_title"></h2><p class="muted" data-t="read_desc"></p>
    <select class="tl" id="paceSelect" style="width:100%"></select>
    <div class="reader card tl" id="paceReader" style="margin-top:10px"></div>
    <label class="muted"><span data-t="speed"></span>: <span id="paceWpmVal">130</span> WPM</label>
    <input type="range" id="paceWpm" min="60" max="200" step="5" value="130">
    <div class="row"><span class="grow"></span><button class="b" id="paceStart" data-t="startb"></button></div>
  </div>
</section>

<!-- VOICE -->
<section class="view" id="v-voice">
  <div class="card" id="toneCard"><h2><span data-t="tone_title"></span> <span class="muted" style="font-size:.85rem;font-weight:400" id="toneSub"></span></h2><div id="toneBody"></div></div>
  <div class="card" id="testCard"><h2 data-t="test_title"></h2><p class="muted" data-t="test_desc"></p><div id="testBody"></div>
    <details><summary data-t="dims_info"></summary><div class="muted" data-t="dims_help"></div></details></div>
  <div class="card" id="studioCard"><h2 data-t="studio_title"></h2><p class="muted" data-t="studio_desc"></p>
    <label class="muted" data-t="studio_prompt"></label><select id="studioPrompt" style="width:100%"></select>
    <div class="card flat hidden" id="studioTask" style="margin-top:8px"></div>
    <label class="check"><input type="checkbox" id="studioVideo"> <span data-t="studio_video"></span></label>
    <div id="studioRec"></div>
    <label class="b sm alt" style="display:inline-flex;align-items:center;margin-top:8px">📂 <span data-t="studio_import"></span><input type="file" id="studioFile" accept="audio/*,video/*" class="hidden"></label>
    <div id="studioOut"></div></div>
  <div class="card" id="refCard"><h2 data-t="ref_title"></h2><p class="muted" data-t="ref_desc"></p><div id="refBody"></div></div>
  <div class="card" id="intoCard"><h2 data-t="into_title"></h2><p class="muted" data-t="into_desc"></p>
    <div class="huge tl" id="intoSent" style="font-size:1.5rem;font-weight:500"></div><button class="b sm alt" id="intoNew" data-t="into_new"></button>
    <div id="intoRec" style="margin-top:8px"></div><div id="intoOut"></div></div>
  <div class="card" id="projCard"><h2 data-t="proj_title"></h2><p class="muted" data-t="proj_desc"></p>
    <div class="huge tl" id="projText" style="font-size:1.2rem;font-weight:500"></div><div id="projRec"></div><div id="projOut"></div></div>
  <div class="card"><h2 data-t="mic_title"></h2><p class="muted" data-t="mic_desc"></p>
    <button class="b" style="width:100%" id="micBtn" data-t="mic_on"></button>
    <div class="warnbox hidden" id="micErr" style="margin-top:8px"></div></div>
  <div class="card"><h2 data-t="pitch_title"></h2><p class="muted" data-t="pitch_desc"></p>
    <div class="row"><div class="big grow" id="pitchHz">– Hz</div><div class="big grow" id="pitchNote">–</div></div>
    <canvas id="pitchCanvas" height="170"></canvas><p class="muted" id="pitchStats"></p></div>
  <div class="card"><h2 data-t="match_title"></h2><p class="muted" data-t="match_desc"></p>
    <div class="row"><select id="targetNote" class="grow"></select><button class="b alt" id="playTarget" data-t="play"></button></div>
    <div class="cents"><div class="z"></div><b id="centsMark"></b></div>
    <div class="row muted"><span class="grow" data-t="too_low"></span><span id="centsTxt">–</span><span class="grow" style="text-align:right" data-t="too_high"></span></div>
    <p class="muted"><span data-t="hold"></span>: <b id="holdTime">0.0 s</b> (<span data-t="best_lbl"></span> <b id="holdBest">0.0 s</b>)</p></div>
  <div class="card"><h2 data-t="loud_title"></h2><p class="muted" data-t="loud_desc"></p>
    <div class="meter"><i id="levelBar"></i><u id="levelThr"></u></div>
    <div class="row" style="margin-top:6px"><span class="grow"><span data-t="level"></span>: <b id="levelDb">–</b></span><span><span data-t="steady"></span>: <b id="steady">–</b></span></div>
    <label class="muted"><span data-t="threshold"></span>: <span id="thrVal">-45</span> dBFS</label>
    <input type="range" id="thr" min="-70" max="-15" value="-45">
    <div class="big" id="sustainTime">0.0 s</div>
    <p class="muted"><span data-t="best_sustain"></span>: <b id="sustainBest">0.0 s</b> <button class="b alt sm" id="sustainSave" data-t="save_mpt"></button></p>
    <p class="muted" data-t="steady_note"></p></div>
  </section>

<!-- BREATH -->
<section class="view" id="v-breath">
  <div class="card" id="ppcCard"></div>
  <div class="card" id="supCard"><h2 data-t="sup_title"></h2><p class="muted" data-t="sup_desc"></p>
    <div class="chips" id="supEx"></div><div id="supBody"></div><div id="supOut"></div></div>
  <div class="card"><h2 data-t="br_title"></h2><p class="muted" data-t="br_desc"></p>
    <div class="chips" id="breathPresets"></div><p class="muted" id="breathDesc"></p>
    <div class="breath"><div class="ring"></div><div class="ball" id="ball"></div><div class="lbl" id="ballLbl"></div></div>
    <div class="row"><span class="muted grow"><span data-t="rounds"></span>: <b id="brRound">0</b> / <select id="brRounds"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></span>
      <button class="b" id="brStart" data-t="startb"></button></div></div>
  <div class="card"><h2 data-t="mpt_title"></h2><p data-t="mpt_what"></p><p class="muted" data-t="mpt_how"></p>
    <div class="big" id="mptTime">0.0 s</div>
    <div class="row"><button class="b grow" id="mptBtn" data-t="startb"></button><button class="b alt" id="mptSave" data-t="save_best"></button></div>
    <p class="muted" id="mptTries"></p></div>
  <div class="card"><h2 data-t="sz_title"></h2><p data-t="sz_what"></p><p class="muted" data-t="sz_how"></p>
    <div class="big" id="szTime">0.0 s</div>
    <div class="row"><button class="b grow" id="sBtn"></button><button class="b warm grow" id="zBtn"></button></div>
    <p id="szResult" class="muted"></p>
    <div class="row"><button class="b alt sm" id="szSave" data-t="sz_save"></button><button class="b alt sm" id="szReset" data-t="sz_reset"></button></div></div>
</section>
<section class="view" id="v-choir">
  <div class="card"><h2 data-t="nav_choir"></h2><p class="muted" data-t="ch_intro"></p><div class="warnbox" data-t="ch_hp"></div><p class="muted" style="font-size:.8rem;margin-top:6px" data-t="ch_bt"></p><details style="margin-top:6px"><summary class="muted" style="font-size:.85rem">🎧 <span data-t="au_title"></span></summary><div id="chAudio"></div></details></div>
  <div class="card" id="vtCard"><h2 data-t="vt_title"></h2><div id="vtBody"></div></div>
  <div class="card" id="wuCard"><h2 data-t="wu_title"></h2><div id="wuBody"></div></div>
  <div class="card" id="ntCard"><h2 data-t="nt_title"></h2><div id="ntBody"></div></div>
  <div class="card" id="ptCard"><h2 data-t="pt_title"></h2><div id="ptBody"></div></div>
  <div class="card" id="rdCard"><h2 data-t="cn_title"></h2><div id="rdBody"></div></div>
  <div class="card" id="sgCard"><h2 data-t="sg_title"></h2><div id="sgBody"></div></div>
  <div class="card" id="swCard"><h2 data-t="sw_title"></h2><div id="swBody"></div></div>
</section>

<!-- PROGRESS -->
<section class="view" id="v-progress">
  <div class="card"><h2 id="prMastTitle"></h2><div id="prMastery"></div><p class="muted" data-t="pr_mastery_note"></p><div id="prLangTable"></div></div>
  <div class="card"><h2 data-t="test_hist"></h2><canvas id="testChart" height="150"></canvas><div id="testDims"></div></div>
  <div class="card"><h2 data-t="lib_title"></h2><p class="muted" data-t="lib_desc"></p><div id="libList"></div><div id="libOut"></div></div>
  <div class="card"><h2 data-t="pr_scores"></h2><canvas id="scoreChart" height="170"></canvas><p class="muted" data-t="pr_scores_note"></p></div>
  <div class="card"><h2 id="prArtTitle"></h2><div id="prArt"></div></div>
  <div class="card"><h2 data-t="pr_meas"></h2><canvas id="measChart" height="150"></canvas><p class="muted" data-t="pr_meas_note"></p></div>
  <div class="card"><h2 data-t="pr_hist"></h2><div id="logTable"></div>
    <div class="row" style="margin-top:10px"><button class="b alt sm" id="logCopy" data-t="copy"></button><button class="b alt sm" id="logClear" data-t="clear"></button></div>
    <div class="warnbox hidden" id="confirmClear" style="margin-top:10px"><p data-t="clear_q"></p>
      <div class="row"><button class="b alt grow" id="ccNo" data-t="cancel"></button><button class="b grow" style="background:var(--warn)" id="ccYes" data-t="del"></button></div></div>
    <p class="muted" id="storeNote"></p></div>
</section>
</main>

<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<!--SCRIPTS-->
</body>
</html>
